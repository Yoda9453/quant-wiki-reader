    function safeLoad(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSave(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    const state = {
      activeId: WIKI_DOCS[0] ? WIKI_DOCS[0].id : "",
      category: "ALL",
      query: "",
      theme: safeLoad("qrv_theme", "light"),
      font: safeLoad("qrv_font", "md"),
      quickScan: safeLoad("qrv_quickscan", false),
      bookmarks: new Set(safeLoad("qrv_bookmarks", [])),
      readIds: new Set(safeLoad("qrv_read", []))
    };

    // DOM refs
    const els = {
      menuBtn: document.getElementById("menuBtn"),
      closeDrawerBtn: document.getElementById("closeDrawerBtn"),
      drawerBackdrop: document.getElementById("drawerBackdrop"),
      sidebar: document.getElementById("sidebar"),
      searchInput: document.getElementById("searchInput"),
      categoryPills: document.getElementById("categoryPills"),
      paperList: document.getElementById("paperList"),
      listCountText: document.getElementById("listCountText"),
      readProgressText: document.getElementById("readProgressText"),
      totalBadge: document.getElementById("totalBadge"),
      fontBtn: document.getElementById("fontBtn"),
      themeBtn: document.getElementById("themeBtn"),
      bookmarkBtn: document.getElementById("bookmarkBtn"),
      bookmarkIcon: document.getElementById("bookmarkIcon"),
      jumpPills: document.getElementById("jumpPills"),
      scanModeBtn: document.getElementById("scanModeBtn"),
      readerArticle: document.getElementById("readerArticle"),
      prevPaperBtn: document.getElementById("prevPaperBtn"),
      nextPaperBtn: document.getElementById("nextPaperBtn"),
      prevPaperTitle: document.getElementById("prevPaperTitle"),
      nextPaperTitle: document.getElementById("nextPaperTitle"),
      toast: document.getElementById("toast")
    };

    let toastTimer = null;
    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.remove("opacity-0");
      els.toast.classList.add("opacity-100");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.remove("opacity-100");
        els.toast.classList.add("opacity-0");
      }, 1700);
    }

    function openDrawer() {
      els.sidebar.classList.remove("-translate-x-full");
      els.drawerBackdrop.classList.remove("hidden");
    }

    function closeDrawer() {
      els.sidebar.classList.add("-translate-x-full");
      els.drawerBackdrop.classList.add("hidden");
    }

    function applyPrefs() {
      document.documentElement.setAttribute("data-theme", state.theme);
      document.documentElement.setAttribute("data-font", state.font);
      const tObj = THEMES.find((t) => t.id === state.theme) || THEMES[0];
      const fObj = FONTS.find((f) => f.id === state.font) || FONTS[1];
      els.themeBtn.textContent = tObj.label;
      els.fontBtn.textContent = fObj.label;
      els.scanModeBtn.textContent = state.quickScan ? "展開全文" : "通勤速讀";
    }

    function getFilteredDocs() {
      const q = state.query.trim().toLowerCase();
      return WIKI_DOCS.filter((doc) => {
        if (state.category === "SAVED" && !state.bookmarks.has(doc.id)) return false;
        if (state.category !== "ALL" && state.category !== "SAVED" && doc.category !== state.category) return false;
        if (q && !doc.searchText.includes(q)) return false;
        return true;
      });
    }

    function renderCategories() {
      els.categoryPills.innerHTML = CATEGORIES.map((cat) => {
        const isActive = state.category === cat.id;
        return `<button type="button" data-cat="${cat.id}" class="pill shrink-0 text-xs px-2.5 py-1 rounded-full transition ${isActive ? "active" : ""}">${cat.label}</button>`;
      }).join("");
    }

    function renderPaperList() {
      const filtered = getFilteredDocs();
      els.listCountText.textContent = `顯示 ${filtered.length} / ${WIKI_DOCS.length} 篇`;
      els.readProgressText.textContent = `已讀 ${state.readIds.size} / ${WIKI_DOCS.length}`;
      els.totalBadge.textContent = String(WIKI_DOCS.length);

      if (!filtered.length) {
        els.paperList.innerHTML = `<div class="p-6 text-center text-xs" style="color: var(--text-muted);">找不到符合條件的論文</div>`;
        return;
      }

      els.paperList.innerHTML = filtered.map((doc) => {
        const isActive = doc.id === state.activeId;
        const isStarred = state.bookmarks.has(doc.id);
        const isRead = state.readIds.has(doc.id);
        return `
          <button type="button" data-doc-id="${doc.id}"
            class="paper-item w-full text-left p-2.5 rounded-xl block ${isActive ? "active" : ""}">
            <div class="flex items-start justify-between gap-1.5">
              <span class="text-sm font-semibold leading-snug line-clamp-2">${escapeHtml(doc.title)}</span>
              ${isStarred ? '<span class="text-amber-500 text-xs shrink-0">★</span>' : ""}
            </div>
            <div class="mt-1 flex items-center gap-1.5 flex-wrap text-xs" style="color: var(--text-muted);">
              <span class="truncate max-w-[175px]">${escapeHtml(doc.authors)}</span>
              <span>·</span>
              <span>${escapeHtml(doc.year)}</span>
              ${isRead ? '<span class="ml-auto text-[10px] px-1.5 py-0.5 rounded" style="background: var(--surface-alt);">已讀</span>' : ""}
            </div>
          </button>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function updateBookmarkBtn() {
      const starred = state.bookmarks.has(state.activeId);
      els.bookmarkBtn.style.color = starred ? "#f59e0b" : "var(--text-muted)";
      els.bookmarkIcon.setAttribute("fill", starred ? "currentColor" : "none");
    }

    function renderMathSafe(container) {
      if (typeof renderMathInElement === "function") {
        try {
          renderMathInElement(container, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\[", right: "\]", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
        } catch (e) {}
      }
    }

    function renderActiveDoc(scrollToTop) {
      const doc = WIKI_DOCS.find((d) => d.id === state.activeId) || WIKI_DOCS[0];
      if (!doc) return;
      state.activeId = doc.id;
      state.readIds.add(doc.id);
      safeSave("qrv_read", Array.from(state.readIds));
      safeSave("qrv_last_id", doc.id);

      if (window.location.hash !== "#" + doc.id) {
        try {
          history.replaceState(null, "", "#" + doc.id);
        } catch (e) {}
      }

      updateBookmarkBtn();

      // Jump pills
      els.jumpPills.innerHTML = doc.sections.map((sec) => {
        return `<button type="button" data-jump="${sec.id}" class="pill shrink-0 text-xs px-2.5 py-1 rounded-lg transition hover:opacity-85">${escapeHtml(sec.label)}</button>`;
      }).join("");

      const tagsHtml = doc.tags.map((t) =>
        `<span class="text-[11px] px-2 py-0.5 rounded-full" style="background: var(--surface-alt); color: var(--text-muted);">${escapeHtml(t)}</span>`
      ).join("");

      const qcBadge = doc.qcTotal > 0
        ? `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium" style="background: var(--surface-alt); color: var(--text-muted);">QC ${doc.qcPass}/${doc.qcTotal}</span>`
        : "";

      const pdfBtn = doc.rawUrl
        ? `<a href="${escapeHtml(doc.rawUrl)}" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-xl transition active:scale-95"
             style="background: var(--accent); color: #ffffff;">
             開啟原始 PDF (Drive) ↗
           </a>`
        : "";

      const sectionsHtml = doc.sections.map((sec) => {
        const collapsed = state.quickScan && !sec.isCore;
        return `
          <section id="${sec.id}" class="sec-card ${collapsed ? "collapsed" : ""}">
            <button type="button" class="sec-header" data-toggle-sec="${sec.id}">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-xs font-bold px-2 py-0.5 rounded-md shrink-0"
                  style="background: var(--accent-soft); color: var(--accent-text);">${escapeHtml(sec.label)}</span>
                <span class="font-bold text-sm sm:text-base truncate">${escapeHtml(sec.heading)}</span>
              </div>
              <svg class="sec-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="sec-content article-body">${sec.html}</div>
          </section>
        `;
      }).join("");

      els.readerArticle.innerHTML = `
        <div class="card rounded-2xl p-4 sm:p-5 mb-4">
          <div class="flex items-center gap-1.5 flex-wrap mb-2">
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full"
              style="background: var(--accent-soft); color: var(--accent-text);">${escapeHtml(doc.primaryTopic)}</span>
            <span class="text-[11px] px-2 py-0.5 rounded-full"
              style="background: var(--surface-alt); color: var(--text-muted);">${doc.isTopicWiki ? "Topic Wiki" : "Paper Wiki"}</span>
            ${qcBadge}
          </div>
          <h1 class="text-xl sm:text-2xl font-bold leading-snug tracking-tight mb-2">${escapeHtml(doc.title)}</h1>
          <div class="text-xs sm:text-sm mb-3" style="color: var(--text-muted);">
            <span class="font-medium">${escapeHtml(doc.authors)}</span>
            <span class="mx-1.5">·</span>
            <span>${escapeHtml(doc.year)}</span>
            ${doc.version ? `<span class="mx-1.5">·</span><span>${escapeHtml(doc.version)}</span>` : ""}
          </div>
          ${tagsHtml ? `<div class="flex flex-wrap gap-1.5 mb-3">${tagsHtml}</div>` : ""}
          <div class="flex items-center gap-2 flex-wrap pt-2 border-t" style="border-color: var(--border);">
            ${pdfBtn}
            <span class="text-[11px] ml-auto" style="color: var(--text-muted);">${escapeHtml(doc.filename)}</span>
          </div>
        </div>
        ${doc.introHtml ? `<div class="card rounded-2xl p-4 mb-4 article-body">${doc.introHtml}</div>` : ""}
        <div>${sectionsHtml}</div>
      `;

      renderMathSafe(els.readerArticle);
      updatePrevNext();
      renderPaperList();

      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function updatePrevNext() {
      const list = getFilteredDocs();
      const idx = list.findIndex((d) => d.id === state.activeId);
      const prev = idx > 0 ? list[idx - 1] : null;
      const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;

      els.prevPaperBtn.disabled = !prev;
      els.prevPaperBtn.dataset.targetId = prev ? prev.id : "";
      els.prevPaperTitle.textContent = prev ? prev.title : "已到第一篇";

      els.nextPaperBtn.disabled = !next;
      els.nextPaperBtn.dataset.targetId = next ? next.id : "";
      els.nextPaperTitle.textContent = next ? next.title : "已到最後一篇";
    }

    // Event Listeners
    els.menuBtn.addEventListener("click", openDrawer);
    els.closeDrawerBtn.addEventListener("click", closeDrawer);
    els.drawerBackdrop.addEventListener("click", closeDrawer);

    els.searchInput.addEventListener("input", (e) => {
      state.query = e.target.value;
      renderPaperList();
      updatePrevNext();
    });

    els.categoryPills.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      state.category = btn.dataset.cat;
      renderCategories();
      renderPaperList();
      updatePrevNext();
    });

    els.paperList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-doc-id]");
      if (!btn) return;
      state.activeId = btn.dataset.docId;
      renderActiveDoc(true);
      closeDrawer();
    });

    els.jumpPills.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-jump]");
      if (!btn) return;
      const sec = document.getElementById(btn.dataset.jump);
      if (sec) {
        sec.classList.remove("collapsed");
        sec.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    els.readerArticle.addEventListener("click", (e) => {
      const hdr = e.target.closest("[data-toggle-sec]");
      if (!hdr) return;
      const sec = document.getElementById(hdr.dataset.toggleSec);
      if (sec) sec.classList.toggle("collapsed");
    });

    els.scanModeBtn.addEventListener("click", () => {
      state.quickScan = !state.quickScan;
      safeSave("qrv_quickscan", state.quickScan);
      applyPrefs();
      renderActiveDoc(false);
      showToast(state.quickScan ? "已切換通勤速讀（僅展開 L0–L1）" : "已展開全部章節");
    });

    els.themeBtn.addEventListener("click", () => {
      const idx = THEMES.findIndex((t) => t.id === state.theme);
      state.theme = THEMES[(idx + 1) % THEMES.length].id;
      safeSave("qrv_theme", state.theme);
      applyPrefs();
      const label = THEMES.find((t) => t.id === state.theme).label;
      showToast(`已切換「${label}」模式`);
    });

    els.fontBtn.addEventListener("click", () => {
      const idx = FONTS.findIndex((f) => f.id === state.font);
      state.font = FONTS[(idx + 1) % FONTS.length].id;
      safeSave("qrv_font", state.font);
      applyPrefs();
    });

    els.bookmarkBtn.addEventListener("click", () => {
      if (state.bookmarks.has(state.activeId)) {
        state.bookmarks.delete(state.activeId);
        showToast("已取消收藏");
      } else {
        state.bookmarks.add(state.activeId);
        showToast("已加入收藏 ★");
      }
      safeSave("qrv_bookmarks", Array.from(state.bookmarks));
      updateBookmarkBtn();
      renderPaperList();
      updatePrevNext();
    });

    els.prevPaperBtn.addEventListener("click", () => {
      const id = els.prevPaperBtn.dataset.targetId;
      if (id) {
        state.activeId = id;
        renderActiveDoc(true);
      }
    });

    els.nextPaperBtn.addEventListener("click", () => {
      const id = els.nextPaperBtn.dataset.targetId;
      if (id) {
        state.activeId = id;
        renderActiveDoc(true);
      }
    });

    window.addEventListener("hashchange", () => {
      const hashId = window.location.hash.replace(/^#/, "");
      if (hashId && WIKI_DOCS.some((d) => d.id === hashId) && hashId !== state.activeId) {
        state.activeId = hashId;
        renderActiveDoc(true);
      }
    });

    // Init
    window.addEventListener("DOMContentLoaded", () => {
      applyPrefs();
      const hashId = window.location.hash.replace(/^#/, "");
      const savedId = safeLoad("qrv_last_id", "");
      if (hashId && WIKI_DOCS.some((d) => d.id === hashId)) {
        state.activeId = hashId;
      } else if (savedId && WIKI_DOCS.some((d) => d.id === savedId)) {
        state.activeId = savedId;
      }
      renderCategories();
      renderActiveDoc(false);
    });

    window.addEventListener("load", () => {
      renderMathSafe(els.readerArticle);
    });
  </script>
</body>
</html>
