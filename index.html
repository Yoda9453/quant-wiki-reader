an reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Use trailing 252-day 5% historical expected shortfall as a non-proprietary proxy, build monthly inverse-ES weights across diversified ETFs and compare OOS drawdowns vs inverse-vol.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does historical expected-shortfall parity improve portfolio tails compared with inverse-volatility allocation?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Use trailing 252-day 5% historical expected shortfall as a non-proprietary proxy, build monthly inverse-ES weights across diversified ETFs and compare OOS drawdowns vs inverse-vol.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Executive summary claims improved downside protection and estimated ~50% historical cost savings versus options; needs detailed review.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1KSXXHGBpcJP0jx0g44g00xbzv8tXuyQ1<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "an introduction to tail risk parity alankar, depalma & scholes tail risk portfolio construction # an introduction to tail risk parity **authors:** alankar, depalma & scholes **date/version:** unverified; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1ksxxhgbpcjp0jx0g44g00xbzv8txuyq1/view) **track:** portfolio construction **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does historical expected-shortfall parity improve portfolio tails compared with inverse-volatility allocation? **author-reported headline:** executive summary claims improved downside protection and estimated ~50% historical cost savings versus options; needs detailed review. **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** allocating by tail-loss exposure may be more relevant than volatility parity. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** proprietary option-implied expected tail loss (etl) drives tail-risk parity weights instead of conventional volatility weights. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | executive summary claims improved downside protection and estimated ~50% historical cost savings versus options; needs detailed review. | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the origi", "sortRank": 1}, {"id": "simaan_2021_bayesian_portfolio_taa", "filename": "Simaan_2021_Bayesian_Portfolio_Selection_TAA_v0.1.1.md", "title": "Bayesian Portfolio Selection: Application to Tactical Asset Allocation", "authors": "Majeed Simaan", "year": "2021", "pubDate": "2021-07-07", "version": "SSRN Working Paper (abstract=3882211, July 7, 2021)", "primaryTopic": "Portfolio Construction & Bayesian Shrinkage", "category": "ML & Portfolio", "isTopicWiki": false, "tags": ["Tactical Asset Allocation", "Parameter Uncertainty", "Mean-Variance Optimization", "Bayesian Shrinkage", "CARA Utility", "Three-Fund Separation"], "rawUrl": "https://drive.google.com/file/d/1OStxYmbiWpLbafGs3ErJkRC2aoRaDryx/view", "rawId": "1OStxYmbiWpLbafGs3ErJkRC2aoRaDryx", "status": "carded", "reviewStatus": "pending_review", "qcPass": 4, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> How can a Bayesian decision-maker incorporate prior beliefs about expected returns into mean-variance (MV) tactical asset allocation under parameter uncertainty, and how does the resulting three-fund rule perform on a two-ETF (<code>SPY<\/code> / <code>IEF<\/code>) allocation problem? <em>(pp. 1–4)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Under CARA utility, Gaussian returns, and a known covariance matrix $\\Sigma = \\Sigma_0$, the Bayesian optimal portfolio decomposes analytically into three funds: the Global Minimum Variance (GMV) portfolio plus two zero-cost arbitrage portfolios driven by the prior mean $\\mu_0$ and the sample mean $\\bar{y}$, with shrinkage weight $\\alpha = \\frac{1}{1+T}$ <em>(pp. 3–4, Eqs. 14–22)<\/em>. In a monthly <code>SPY<\/code>/<code>IEF<\/code> backtest (Feb 2005 – Dec 2020, rolling $T=24$ months), setting the prior to the prior month&#x27;s return ($\\mu_0 = y_t$) achieves an OOS Sharpe ratio of <strong>1.06<\/strong> vs. <strong>0.98<\/strong> for a static 60/40 benchmark <em>(p. 8)<\/em>, while a pessimistic SPY prior ($\\mu_0 = (-0.11, 0.06)$) yields a Sharpe of <strong>0.95<\/strong> vs. <strong>0.98<\/strong> <em>(pp. 7–8)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> Code inspection reveals <strong>two material implementation bugs<\/strong> in the author&#x27;s R scripts: (1) the static prior <code>mu_0 &lt;- c(0.11, 0.06)<\/code> injects <strong>annualized<\/strong> returns directly into <strong>monthly<\/strong> sample means and monthly covariance (a $12\\times$ unit mismatch, <em>p. 5<\/em>), and (2) the Naive 60/40 turnover calculation on <em>p. 9<\/em> erroneously subtracts drifted 60/40 weights from Bayes weights <code>W_in<\/code> instead of <code>W_naive<\/code>, falsely reporting Naive monthly turnover as <strong>66.26%<\/strong> vs. Bayes <strong>20.16%<\/strong>. Treat the paper as a clean pedagogical derivation of three-fund Bayesian shrinkage, not as validated OOS alpha.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> Plug-in mean-variance optimization replaces unknown $(\\mu, \\Sigma)$ with noisy sample estimates, causing severe estimation error and unstable out-of-sample weights <em>(pp. 1–2)<\/em>. Bayesian updating introduces a bias–variance trade-off: shrinking sample means toward an informative prior $\\mu_0$ imposes weight bias but reduces estimation variance, while simultaneously inflating perceived portfolio variance by $(1+\\alpha)$ to penalize finite-sample ambiguity <em>(pp. 1, 3)<\/em>. For the lagged-return prior ($\\mu_0 = y_t$), outperformance is conjectured to stem from modest positive monthly return autocorrelation in both <code>SPY<\/code> (6.47%) and <code>IEF<\/code> (2.22%) <em>(pp. 9–10)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> Economically, Eq. 20–22 shows that with a fixed prior precision equal to $\\Sigma_0^{-1}$, a 24-month rolling window gives the prior only $\\alpha = 1/25 = 4\\%$ weight—meaning the dynamic tilt in the $\\mu_0 = y_t$ experiment is actually <strong>96% driven by 24-month rolling sample MV (plus ad-hoc sigmoid weight compression)<\/strong> and only 4% by the 1-month return prior! The paper&#x27;s useful conceptual contribution is the <strong>closed-form three-fund separation<\/strong> separating variance minimization ($d_g$), sample signal ($B_\\alpha \\bar{y}$), and external alpha/prior view ($B_\\alpha \\mu_0$).<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li><strong>Preferences &amp; Likelihood:<\/strong> CARA utility $U(w) = -\\frac{1}{\\gamma}e^{-\\gamma w}$ with $w = d^\\top y$, conditional returns $y \\mid \\theta \\sim \\mathcal{N}(\\mu, \\Sigma)$, and Normal-Wishart joint prior $\\theta \\sim \\text{NW}(\\mu_0, \\tau, \\Sigma_0, \\nu)$ <em>(p. 2, Eqs. 2–4)<\/em>.<\/li><li><strong>Known-Covariance Simplification ($\\Sigma = \\Sigma_0$):<\/strong> Posterior mean distribution is <em>(p. 3, Eqs. 13–14)<\/em>: $$\\mu \\mid X, \\mu_0 \\sim \\mathcal{N}\\!\\left(\\alpha \\mu_0 + (1-\\alpha)\\bar{y},\\; \\frac{1}{1+T}\\Sigma_0\\right), \\quad \\alpha = \\frac{1}{1+T}$$<\/li><li>**Equivalent MV Objective <em>(p. 3, Eq. 16)<\/em>:** $$\\max_{d:\\, d^\\top \\mathbf{1} = 1} \\; d^\\top [\\alpha \\mu_0 + (1-\\alpha)\\bar{y}] - \\frac{\\gamma}{2}(1+\\alpha)d^\\top \\Sigma_0 d$$<\/li><li>**Three-Fund Optimal Portfolio <em>(pp. 3–4, Eqs. 17–22, setting $\\gamma = 1$ in Eq. 17)<\/em>:** $$d^* = d_g + \\alpha B_\\alpha \\mu_0 + (1-\\alpha)B_\\alpha \\bar{y} = \\alpha d^*(\\mu_0) + (1-\\alpha)d^*(\\bar{y})$$ where $d_g = \\frac{\\Sigma_0^{-1}\\mathbf{1}}{\\mathbf{1}^\\top \\Sigma_0^{-1}\\mathbf{1}}$, $B = \\Sigma_0^{-1}(I - \\mathbf{1}d_g^\\top)$, and $B_\\alpha = (1+\\alpha)^{-1}B$.<\/li><li>**Empirical Setup &amp; Ad-Hoc Weight Regularization <em>(pp. 4–6)<\/em>:**<\/li><li class=\"sub-li\">Assets: Monthly adjusted closing prices of <code>SPY<\/code> and <code>IEF<\/code> from <code>quantmod<\/code>, <code>2002-08-30<\/code> to <code>2020-12-31<\/code>; OOS returns span <code>2005-02-28<\/code> to <code>2020-12-31<\/code> (rolling $T = 24$ months, $\\alpha = 1/25 = 0.04$).<\/li><li class=\"sub-li\">Raw MV weights $d^*$ are mapped to long-only weights via elementwise logistic sigmoid and re-normalization: $\\tilde{d}_i = \\frac{e^{d^*_i}}{1+e^{d^*_i}}$, then $w_i = \\tilde{d}_i / \\sum_j \\tilde{d}_j$ <em>(p. 5)<\/em>.<\/li><li class=\"sub-li\">Three priors tested: (1) full-sample mean <code>c(0.11, 0.06)<\/code> <em>(p. 5)<\/em>, (2) pessimistic SPY <code>c(-0.11, 0.06)<\/code> <em>(p. 7)<\/em>, and (3) prior-month return $\\mu_0 = y_t$ <em>(p. 8)<\/em>.<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>Full-sample static prior (<code>0.11, 0.06<\/code>)<\/td><td>Outperforms 60/40 cumulatively (plot ~3.5x vs ~3.0x); SPY weight &gt;80% most months, drops in 2008, late 2016, COVID-19<\/td><td><code>SPY<\/code>/<code>IEF<\/code>, Feb 2005 – Dec 2020 vs. 60/40 Naive (look-ahead prior)<\/td><td>Figs. pp. 6–7<\/td><\/tr><tr><td>Pessimistic SPY prior (<code>-0.11, 0.06<\/code>)<\/td><td>Bayes Sharpe <strong>0.95<\/strong> vs. Naive 60/40 <strong>0.98<\/strong> (lower cumulative return &amp; lower vol)<\/td><td>Feb 2005 – Dec 2020, annualized $\\sqrt{12}\\bar{r}/\\sigma$ (no Rf subtracted)<\/td><td>pp. 7–8<\/td><\/tr><tr><td>1-Month lagged return prior ($\\mu_0 = y_t$)<\/td><td>Bayes Sharpe <strong>1.06<\/strong> vs. Naive 60/40 <strong>0.98<\/strong> (cum. return ~4.0x vs ~3.0x)<\/td><td>Feb 2005 – Dec 2020 <em>(note: prose on p. 8 erroneously prints 0.95 above R output <code>1.06<\/code>)<\/em><\/td><td>p. 8<\/td><\/tr><tr><td>Reported monthly turnover ($\\mu_0 = y_t$)<\/td><td>Bayes <strong>20.16%<\/strong> (<code>0.2016<\/code>) vs. Naive <strong>66.26%<\/strong> (<code>0.6626<\/code>) <em>(INVALID: R code bug in Naive formula)<\/em><\/td><td>Feb 2005 – Dec 2020<\/td><td>p. 9<\/td><\/tr><tr><td>Monthly lag-1 autocorrelation<\/td><td><code>SPY<\/code>: <strong>6.47%<\/strong> (rolling 24m range -53% to +45%); <code>IEF<\/code>: <strong>2.22%<\/strong> (range -46% to +35%)<\/td><td>Aug 2002 – Dec 2020<\/td><td>pp. 9–10<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Assumes covariance matrix $\\Sigma = \\Sigma_0$ is known without uncertainty to preserve analytical tractability <em>(p. 3)<\/em>.<\/li><li>Explicitly notes that the first static prior <code>c(0.11, 0.06)<\/code> suffers from look-ahead bias (full-sample estimate) <em>(p. 5)<\/em>.<\/li><li>Notes that the logistic weight normalization is an ad-hoc norm-control transformation rather than an exact constrained optimization <em>(p. 5)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li>**Severe Turnover Code Bug <em>(p. 9)<\/em>:<strong> In the Naive 60/40 turnover block, line <code>W_to &lt;- W_in[-1,] - W_to[-nrow(W_to),]<\/code> subtracts drifted 60/40 weights from the <\/strong>Bayes<strong> weight matrix <code>W_in<\/code> instead of <code>W_naive[-1,]<\/code>. True monthly turnover of a 60/40 <code>SPY<\/code>/<code>IEF<\/code> portfolio is ~1–2%, not 66.26%, so the paper&#x27;s claim that Bayes has lower turnover than 60/40 is <\/strong>completely reversed**.<\/li><li>**12× Unit Mismatch in Static Priors <em>(pp. 5, 7)<\/em>:** <code>mu_0 &lt;- c(0.11, 0.06)<\/code> uses annualized returns while <code>y_bar<\/code> and <code>Sigma<\/code> are monthly. This artificially inflates the prior&#x27;s effective weight by ~12× relative to the theoretical $\\alpha = 1/25$.<\/li><li><strong>Missing Risk-Aversion Parameter $\\gamma$ &amp; Unadjusted Sharpe:<\/strong> Eq. 17 omits $1/\\gamma$ (implicitly fixing $\\gamma = 1$, which makes raw MV weights huge and forces the logistic transform to saturate near 0.5/0.5 or 0.99/0.01), and <code>SR_f<\/code> computes $\\sqrt{12}\\bar{r}/\\sigma$ without subtracting the risk-free rate <em>(p. 8)<\/em>.<\/li><li><strong>Two-Asset Bull-Bond Regime &amp; Zero Transaction Costs:<\/strong> Testing only <code>SPY<\/code> + <code>IEF<\/code> during 2005–2020 (strong equity + falling-rate bond bull market) with zero transaction costs and a single fixed $T=24$ window provides weak evidence of standalone TAA edge.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> Replacing plug-in MV expected returns with a properly scaled Bayesian shrinkage posterior $\\mu_{\\text{post}} = \\alpha \\mu_0 + (1-\\alpha)\\bar{y}$ (with variance inflation $(1+\\alpha)\\Sigma$ and explicit risk-aversion $\\gamma$) improves out-of-sample risk-adjusted return and lowers turnover vs. plug-in MV on a multi-asset TAA universe, <em>when<\/em> $\\mu_0$ is an economically grounded, point-in-time prior (e.g., equilibrium/CAPM prior or 12-month TSMOM signal) in matching monthly return units. Discard the buggy turnover script and ad-hoc sigmoid squashing; replace with standard long-only QP (<code>0 &lt;= w &lt;= 1<\/code>, $\\sum w = 1$).<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> Liquid multi-asset ETF universe (<code>SPY<\/code>, <code>EFA<\/code>, <code>EEM<\/code>, <code>IEF<\/code>, <code>TLT<\/code>, <code>GLD<\/code>, <code>DBC<\/code>, plus <code>SHY<\/code>/T-bills as risk-free benchmark).<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> Compute trailing $T$-month sample mean $\\bar{y}$, Ledoit-Wolf shrunk covariance $\\hat{\\Sigma}$, and prior $\\mu_0$ (strictly in monthly units) at month-end close $t$; rebalance at $t+1$ open/close.<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Long-only, fully invested ($\\sum w_i = 1$, $w_i \\ge 0$), realistic 5–10 bps one-way transaction cost, explicit turnover calculation on actual drifted weights <code>|w_target(t) - w_drifted(t-1)|<\/code>.<\/li><li><strong>Deviations from paper:<\/strong> Fix the 12× unit mismatch and turnover bug; replace logistic sigmoid with constrained quadratic programming; test explicit prior-strength $\\alpha \\in \\{0.1, 0.25, 0.5\\}$ rather than tying $\\alpha$ rigidly to $1/(1+T)$; extend OOS through 2022–2026 (including the 2022 stock-bond correlation breakdown).<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Question and null:<\/strong> Does three-fund Bayesian shrinkage (using a point-in-time 12-1 month momentum or yield-based monthly prior $\\mu_0$) beat both 60/40 (or equal-weight) and plug-in MV out-of-sample net of 10 bps costs across 2007–2026? ($H_0: \\text{Sharpe}_{\\text{Bayes}} \\le \\max(\\text{Sharpe}_{\\text{60/40}}, \\text{Sharpe}_{\\text{GMV}})$).<\/li><li><strong>Market-data proxy and sample:<\/strong> Daily/monthly total-return ETFs (<code>SPY<\/code>, <code>IEF<\/code>, plus 5-ETF multi-asset extension <code>SPY<\/code>/<code>EFA<\/code>/<code>IEF<\/code>/<code>GLD<\/code>/<code>SHY<\/code>), 2005–2026 (rolling $T=24$ and $T=36$ months; OOS 2007–2026).<\/li><li><strong>Signal and parameter specification:<\/strong> Monthly covariance via Ledoit-Wolf shrinkage; risk aversion $\\gamma \\in \\{3, 5, 10\\}$; test three unit-consistent priors: (a) GMV/zero-alpha prior ($\\mu_0 = 0$, equivalent to Jorion shrinkage toward GMV), (b) 1-month lagged return $\\mu_0 = y_t$, (c) 12-month TSMOM scaled to monthly volatility.<\/li><li><strong>Benchmark and position rule:<\/strong> Compare against static 60/40, 1/N equal-weight, GMV, and unshrunk plug-in MV; exact QP long-only weights.<\/li><li><strong>OOS / look-ahead controls / execution:<\/strong> Strictly causal rolling windows; $t+1$ execution; zero full-sample priors.<\/li><li><strong>Costs and primary metrics:<\/strong> Excess-return Sharpe (net of T-bills and 10 bps one-way TC), Sortino, MaxDD, true monthly two-way turnover, and 2022 drawdown behavior.<\/li><li><strong>Robustness and predeclared continuation/failure criteria:<\/strong><\/li><li class=\"sub-li\"><em>Continue:<\/em> Beats both 60/40 and GMV by $\\ge +0.10$ net Sharpe with lower MaxDD and monthly turnover $&lt; 25\\%$ across both 2-ETF and 5-ETF universes.<\/li><li class=\"sub-li\"><em>Stop / Kill:<\/em> If net Sharpe edge vanishes once the 12× unit mismatch and true turnover costs are fixed, or if $\\mu_0 = y_t$ degrades under 2022–2026 OOS.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Not pursued<\/strong> — exact replication of the paper&#x27;s R output is trivial (full code is printed on pp. 4–10) but uninformative because of the confirmed unit-mismatch and turnover bugs.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Evidence:<\/strong> Directly builds on Jorion (1986) Bayes-Stein shrinkage, Black &amp; Litterman (1990) view-blending, and DeMiguel et al. (2009) norm-constrained portfolios <em>(pp. 1, 5, 10)<\/em>.<\/li><li><strong>Proposal:<\/strong> Useful as a clean <strong>portfolio-construction wrapper<\/strong> for combining external alpha signals (e.g., Micaletti 2022 Relative Sentiment or Bai &amp; Pukthuanthong 2026 classification expected-return ranks) as the prior $\\mu_0$ inside a variance-penalized MV framework, while comparing against Halperin (2026) matrix-inversion-free rank diversification.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source-backed claim (<code>author_reported<\/code>):<\/strong> Under CARA utility and known $\\Sigma$, Bayesian portfolio selection reduces to a closed-form three-fund combination of GMV, sample-mean arbitrage, and prior-mean arbitrage with shrinkage weight $\\alpha = 1/(1+T)$ <em>(pp. 3–4)<\/em>.<\/li><li><strong>Proposed falsifiable next test (<code>proposed_test<\/code>):<\/strong> Run the bug-fixed, unit-consistent constrained-QP version of the three-fund rule on <code>SPY<\/code>/<code>IEF<\/code> and a 5-ETF TAA basket through 2026 with true turnover and 10 bps costs.<\/li><li><strong>Verdict and decision owner:<\/strong> <strong>Pending review<\/strong> — <strong>Keep as a clean mathematical building block (three-fund shrinkage formula); reject the paper&#x27;s empirical backtest numbers<\/strong> due to confirmed R code bugs (12× unit mismatch in static prior and wrong weight matrix in Naive turnover).<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence<\/th><th>Reviewer/date<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>pass<\/td><td>Tagged by Bayesian shrinkage, TAA, CARA, three-fund separation, SPY/IEF.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>pass<\/td><td>L0–L4 capture full derivation (Eqs. 1–23), empirical setup, and exact code-level audit findings.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q3 Testability<\/td><td>pass<\/td><td>Bug-fixed constrained-QP MVP specified with unit-consistent priors, costs, and kill rules.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>pass<\/td><td>All 10 pages read in full; every equation, Sharpe ratio, autocorrelation, and R code bug verified with page locators.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source Drive ID / version:<\/strong> <code>1OStxYmbiWpLbafGs3ErJkRC2aoRaDryx<\/code> — <a href=\"https://drive.google.com/file/d/1OStxYmbiWpLbafGs3ErJkRC2aoRaDryx/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Simaan (2021) - Bayesian Portfolio Selection - Application to Tactical Asset Allocation.pdf<\/a> (<code>SSRN:3882211<\/code>, July 7, 2021, archived in <code>03_Raw<\/code>)<\/li><li><strong>Schema version:<\/strong> 0.1.1<\/li><li><strong>Changes / reviewer:<\/strong> v0.1 initial full-text L0–L7 draft created 2026-11-26; pending human review.<\/li><\/ul>"}], "searchText": "bayesian portfolio selection: application to tactical asset allocation majeed simaan portfolio construction & bayesian shrinkage tactical asset allocation parameter uncertainty mean-variance optimization bayesian shrinkage cara utility three-fund separation logit weight transform # bayesian portfolio selection: application to tactical asset allocation ## l0 — research in one minute **question:** how can a bayesian decision-maker incorporate prior beliefs about expected returns into mean-variance (mv) tactical asset allocation under parameter uncertainty, and how does the resulting three-fund rule perform on a two-etf (`spy` / `ief`) allocation problem? *(pp. 1–4)* **author-reported claim and findings (`author_reported`):** under cara utility, gaussian returns, and a known covariance matrix $\\sigma = \\sigma_0$, the bayesian optimal portfolio decomposes analytically into three funds: the global minimum variance (gmv) portfolio plus two zero-cost arbitrage portfolios driven by the prior mean $\\mu_0$ and the sample mean $\\bar{y}$, with shrinkage weight $\\alpha = \\frac{1}{1+t}$ *(pp. 3–4, eqs. 14–22)*. in a monthly `spy`/`ief` backtest (feb 2005 – dec 2020, rolling $t=24$ months), setting the prior to the prior month's return ($\\mu_0 = y_t$) achieves an oos sharpe ratio of **1.06** vs. **0.98** for a static 60/40 benchmark *(p. 8)*, while a pessimistic spy prior ($\\mu_0 = (-0.11, 0.06)$) yields a sharpe of **0.95** vs. **0.98** *(pp. 7–8)*. **caveat (`analyst_inference`):** code inspection reveals **two material implementation bugs** in the author's r scripts: (1) the static prior `mu_0 <- c(0.11, 0.06)` injects **annualized** returns directly into **monthly** sample means and monthly covariance (a $12\\times$ unit mismatch, *p. 5*), and (2) the naive 60/40 turnover calculation on *p. 9* erroneously subtracts drifted 60/40 weights from bayes weights `w_in` instead of `w_naive`, falsely reporting naive monthly turnover as **66.26%** vs. bayes **20.16%**. treat the paper as a clean pedagogical derivation of three-fund bayesian shrinkage, not as validated oos alpha. ## l1 — economic intuition **author's explanation (`author_reported`):** plug-in mean-variance optimization replaces unknown $(\\mu, \\sigma)$ with noisy sample estimates, causing severe estimation error and unstable out-of-sample weights *(pp. 1–2)*. bayesian updating introduces a bias–variance trade-off: shrinking sample means toward an informative prior $\\mu_0$ imposes weight bias but reduces estimation variance, while simultaneously inflating perceived portfolio variance by $(1+\\alpha)$ to penalize finite-sample ambiguity *(pp. 1, 3)*. for the lagged-return prior ($\\mu_0 = y_t$), outperformance is conjectured to stem from modest positive monthly return autocorrelation in", "sortRank": 1}, {"id": "nouvellon_zhou_2026_em_country_timing", "filename": "Nouvellon_Zhou_2026_EM_Country_Timing_v0.1.1.md", "title": "Beyond Stock Selection: A Systematic Approach to EM Country Timing", "authors": "Mickael Nouvellon, Dawei Zhou", "year": "2026", "pubDate": "2026-10", "version": "Man Group Insights (October 2026, MKT021208/NS/GL/W)", "primaryTopic": "Macro & Country Allocation", "category": "ML & Portfolio", "isTopicWiki": false, "tags": ["Emerging Markets", "Systematic Equities", "Machine Learning", "Tactical Asset Allocation", "Time-Series Macro Signals", "Cross-Sectional Country Ranking"], "rawUrl": "https://drive.google.com/file/d/1Y2YZA0hXrLDt9Cbi-GxlnlKhV-1SCG8M/view", "rawId": "1Y2YZA0hXrLDt9Cbi-GxlnlKhV-1SCG8M", "status": "carded", "reviewStatus": "pending_review", "qcPass": 3, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Can a systematic macro-driven Emerging Markets (EM) country-timing overlay—combining point-in-time macroeconomic data, machine learning, and a dual Time-Series (<code>TS<\/code>) + Cross-Sectional (<code>XS<\/code>) lens—outperform a traditional Value + 12-month Momentum country model and provide uncorrelated alpha alongside bottom-up EM stock selection? <em>(pp. 1–2, 6)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Yes. Across all MSCI EM countries from Jan 2008 to Jun 2026 (daily rebalancing, conviction-sized positions capped at $\\pm 5\\%$ per country, <strong>gross of transaction costs<\/strong>), the combined <code>TS+XS<\/code> macro timing model achieves a <strong>gross Sharpe ratio of 0.85<\/strong>, <strong>maximum drawdown of 4.6%<\/strong>, and <strong>28% lower turnover<\/strong> than a standard cross-sectional Value + 12m Momentum baseline (which delivers <strong>gross Sharpe &lt; 0.5<\/strong>, <strong>MaxDD 8.7%<\/strong>, and static multi-year tilts such as staying long South Korea for nearly two decades) <em>(pp. 4, 8–9)<\/em>. Daily returns of the macro model have a correlation of just <strong>0.08<\/strong> with the fundamental Value + Momentum country model, confirming strong diversification <em>(p. 9)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> This is an institutional thought-leadership article from Man Group rather than an academic specification: <strong>exact ML model architecture, feature list, TS/XS blending weights, and net-of-cost Sharpe are undisclosed<\/strong>. Both models rebalance daily <em>gross of costs<\/em>, and the authors explicitly warn that live execution requires turnover control (smoothing or lower rebalancing frequency) <em>(p. 9)<\/em>—crucial in EM where country-level ETF/futures/cash trading costs, FX, and market-access frictions are material.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> Country-level risk contributes a structurally larger share of total equity risk in EM than in Developed Markets (DM), and rolling 12-month cross-country return dispersion is persistently wider in EM due to divergent monetary cycles, terms of trade, external demand, and policy regimes <em>(Figs. 1–2, pp. 2–3)<\/em>. Simple Value + Momentum country models fail because valuation and 12m momentum move slowly—locking portfolios into chronic structural biases (e.g., perpetually long &quot;cheap&quot; Korea regardless of macro stress) and remaining highly correlated with bottom-up stock-picking signals <em>(pp. 4–5)<\/em>. Combining a <strong>Time-Series (TS)<\/strong> lens (is Country $i$&#x27;s macro cycle improving vs. its own history?) with a <strong>Cross-Sectional (XS)<\/strong> lens (is Country $i$ more attractive than peers?) plus trade-linkage spillovers (oil importer vs. exporter; U.S. rates and China industrial output) captures regime rotations without static bias <em>(p. 6)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> The core practitioner insight is sound and actionable even without Man&#x27;s proprietary ML stack: <strong>standardizing macro momentum within each country (<code>TS<\/code> z-score) removes chronic country-level fixed effects<\/strong> (like Korea&#x27;s governance valuation discount or Brazil&#x27;s high nominal yields), while <strong>cross-sectional ranking (<code>XS<\/code>) enforces relative-value discipline<\/strong> across investable EM markets. The South Korea 2021–2026 case study <em>(pp. 6–8)<\/em> reveals what actually drives the signal in practice: merchandise trade balances, terms of trade (energy/commodity prices vs. export mix), sovereign CDS carry, defensive-vs.-cyclical domestic sector rotations, and U.S./global macro spillovers.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>**Universe &amp; Sample <em>(pp. 3–4, 8–9)<\/em>:** All MSCI EM countries, Jan 2008 – Jun 2026, evaluated on each country&#x27;s total net USD return (MSCI, Bloomberg, Man Numeric).<\/li><li>**Baseline Fundamental Comparator <em>(p. 4)<\/em>:** Cross-sectional blend of relative valuation + 12-month price momentum, standardized across EM countries into long/short positions.<\/li><li>**Macro Dual-Lens Model <em>(pp. 6–8)<\/em>:**<\/li><li class=\"sub-li\">Inputs: Point-in-time macroeconomic datasets (financial conditions, labor markets, inflation, real GDP, merchandise trade balance, terms of trade, commodity prices, sovereign CDS carry, defensive/cyclical sector rotations, plus external U.S. rates and Chinese industrial output spillovers).<\/li><li class=\"sub-li\">Two lenses blended into a combined score: (1) <strong>Time-Series (<code>TS<\/code>)<\/strong> comparing each country to its own historical norm; (2) <strong>Cross-Sectional (<code>XS<\/code>)<\/strong> ranking countries relative to EM peers.<\/li><li class=\"sub-li\">Modeling: Combines fundamental economic logic with machine learning, periodically retrained strictly on point-in-time data (no look-ahead) <em>(pp. 6, 8)<\/em>.<\/li><li>**Portfolio Construction &amp; Execution <em>(pp. 4, 8–9)<\/em>:<strong> Standardized score mapped proportionally to country-level long/short weights capped at <\/strong>$\\pm 5\\%$<strong> per country; <\/strong>daily rebalancing<strong>, evaluated <\/strong>gross of transaction costs**.<\/li><li><strong>Unresolved extraction details:<\/strong> Exact list of macro variables, ML algorithm family (e.g., GBDT/ridge/neural net), retraining cadence, <code>TS<\/code>/<code>XS<\/code> combination weights, annualized volatility, CAGR, exact turnover level, and net-of-cost Sharpe are <strong>not disclosed<\/strong>.<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>Fundamental Baseline (Value + 12m Mom)<\/td><td>Gross Sharpe <strong>&lt; 0.5<\/strong>; MaxDD <strong>8.7%<\/strong>; &gt;40% of 2008–2026 value-add came from past 12 months (Korea rally); vulnerable to 2022 Russia shock<\/td><td>All MSCI EM countries, Jan 2008 – Jun 2026, daily rebal, ±5% cap, gross of TC<\/td><td>Sec. &quot;A simple fundamental...&quot;, Figs. 3–4, pp. 4–5, 8<\/td><\/tr><tr><td>Macro Timing Model (<code>TS+XS<\/code> Combined)<\/td><td>Gross Sharpe <strong>0.85<\/strong>; MaxDD <strong>4.6%<\/strong>; <strong>28% lower turnover<\/strong> than fundamental baseline<\/td><td>All MSCI EM countries, Jan 2008 – Jun 2026, daily rebal, ±5% cap, gross of TC<\/td><td>Sec. &quot;Evaluating the model&quot;, Fig. 7, pp. 8–9<\/td><\/tr><tr><td>Diversification vs. Fundamental Model<\/td><td>Daily return correlation = <strong>0.08<\/strong> between Macro (<code>TS+XS<\/code>) and Fundamental (Value + Mom)<\/td><td>Jan 2008 – Jun 2026<\/td><td>p. 9<\/td><\/tr><tr><td>South Korea Case Study (2021–2026)<\/td><td>Macro <code>TS<\/code> score rotated dynamically across 2022 trade/energy shock (bearish), 2023 domestic momentum/trade recovery (bullish), Sep 2024 cycle low, and early-2026 semiconductor/trade rebound (bullish)—vs. static multi-year long tilt in Fundamental model<\/td><td>South Korea, Jul 2021 – Jun 2026 (and 2008–2026 position plot)<\/td><td>Figs. 3, 5, 6, pp. 4, 6–8<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Results are <strong>gross of transaction costs<\/strong>, and daily rebalancing implies substantial annualized turnover that must be smoothed or slowed for live trading <em>(p. 9)<\/em>.<\/li><li>The South Korea deep-dive is illustrative only and should not be generalized across all EM markets <em>(p. 6)<\/em>.<\/li><li>Designed as a complementary overlay to bottom-up stock selection, not a standalone replacement <em>(pp. 2, 10)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li><strong>Black-Box Institutional White Paper:<\/strong> No equations, feature definitions, ML hyperparameters, or exact CAGR/vol/turnover numbers are disclosed; independent audit of overfitting or data-vintage cleanliness (especially early EM 2008–2012 macro revisions) is impossible from the PDF alone.<\/li><li><strong>Gross-of-Cost Daily Rebalancing in EM:<\/strong> Achieving 0.85 gross Sharpe with daily rebalancing across ~20–25 EM markets can erode heavily after EM trading spreads, FX conversion, short-borrow fees (many EM markets restrict shorting or lack liquid country futures), and stamp taxes. Monthly or biweekly rebalancing via liquid U.S.-listed EM country ETFs is far more realistic for a desk MVP.<\/li><li><strong>Uninvestable Tail Events (e.g., Russia 2022):<\/strong> The authors note the fundamental model was vulnerable to Russia 2022 <em>(p. 4)<\/em>, but do not disclose whether the macro model exited Russia before sanctions or how uninvestable markets were priced at zero.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> A transparent, <strong>monthly-rebalanced<\/strong> EM country-timing overlay built from public macro &amp; market-implied macro observables—standardized via a <strong>50/50 Time-Series (<code>TS<\/code>, each country vs. its own 3-year history) + Cross-Sectional (<code>XS<\/code>, country vs. EM peers)<\/strong> lens—outperforms a standard cross-sectional Value + 12-month Momentum EM country model net of realistic ETF costs and exhibits low return correlation ($&lt; 0.30$) with Value + Momentum.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> Liquid U.S.-listed single-country EM ETFs (<code>EWY<\/code> Korea, <code>EWT<\/code> Taiwan, <code>EWZ<\/code> Brazil, <code>INDA<\/code> India, <code>MCHI<\/code>/<code>FXI<\/code> China, <code>EWW<\/code> Mexico, <code>EZA<\/code> South Africa, <code>EIDO<\/code> Indonesia, <code>EPOL<\/code> Poland, <code>THD<\/code> Thailand, <code>ECH<\/code> Chile, <code>KSA<\/code> Saudi Arabia, <code>TUR<\/code> Turkey), benchmarked against <code>EEM<\/code>. Observable macro proxies: country FX vs. USD (3m/6m change), 2Y/10Y local-vs.-US yield spread changes, terms-of-trade / commodity-exporter sensitivity (oil/copper/semis), OECD/PMI/trade-balance releases (with strict 1-month publication lag), and sovereign 5Y CDS or EMBI spreads.<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> Compute <code>TS<\/code> z-scores (expanding/36m rolling per country) and <code>XS<\/code> rank-z-scores across countries at month-end close $t$ using strictly released macro data (minimum 30-day lag on macro prints, 0-day lag on market-implied FX/rates/commodities); execute at $t+1$ close.<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Dollar-neutral long/short country ETF overlay (each country weight capped at $\\pm 5\\%$ or scaled to 5% annualized vol), or long-only active tilt over <code>EEM<\/code> ($\\pm 5\\%$ active weight vs. benchmark); charge 15–25 bps one-way trading cost + 100 bps/yr short borrow (for L/S).<\/li><li><strong>Deviations from paper:<\/strong> Monthly (not daily) rebalancing; transparent linear/ridge composite of 5–8 public macro/market-implied indicators instead of proprietary Man ML stack; investable ETF universe instead of uninvestable cash EM indices.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Question and null:<\/strong> Does a transparent monthly <code>TS+XS<\/code> macro-proxy EM country overlay beat a monthly Value + 12m Momentum EM country baseline net of 20 bps costs over 2012–2026 with correlation $&lt; 0.30$? ($H_0: \\text{Sharpe}_{\\text{Macro, net}} \\le \\text{Sharpe}_{\\text{ValMom, net}}$).<\/li><li><strong>Market-data proxy and sample:<\/strong> 10–12 liquid EM country ETFs (<code>EWY<\/code>, <code>EWT<\/code>, <code>EWZ<\/code>, <code>INDA<\/code>, <code>MCHI<\/code>, <code>EWW<\/code>, <code>EZA<\/code>, <code>EIDO<\/code>, <code>EPOL<\/code>, <code>THD<\/code>, <code>ECH<\/code>), monthly 2012–2026 (strict point-in-time lags; 2012–2018 train, 2019–2026 OOS).<\/li><li><strong>Signal and parameter specification:<\/strong> For each country $i$, construct 4 transparent macro-cycle proxies: (1) 3m FX carry/trend vs. USD, (2) 6m local-vs.-US rate differential change, (3) lagged PMI / trade-balance 3m momentum, (4) terms-of-trade proxy (commodity/semi basket $\\times$ net export sign). Standardize each feature via <code>TS<\/code> (36m rolling z-score per country) and <code>XS<\/code> (cross-country rank z-score), average 50/50, map linearly to weights capped at $\\pm 5\\%$.<\/li><li><strong>Benchmark and position rule:<\/strong> Compare against (a) cross-sectional country Valuation (ETF P/E or P/B) + 12m Momentum (same $\\pm 5\\%$ cap) and (b) <code>EEM<\/code> buy-and-hold (for active-tilt version).<\/li><li><strong>OOS / look-ahead controls / execution:<\/strong> Strict 30-day lag on all macro releases; freeze feature weights prior to 2019–2026 OOS; $t+1$ execution.<\/li><li><strong>Costs and primary metrics:<\/strong> Net Sharpe (after 20 bps one-way TC + 100 bps/yr borrow for L/S), MaxDD, annual turnover, correlation with Value+Momentum baseline, and active IR vs. <code>EEM<\/code>.<\/li><li><strong>Robustness and predeclared continuation/failure criteria:<\/strong><\/li><li class=\"sub-li\"><em>Continue:<\/em> Net OOS Sharpe $\\ge 0.50$, beats Value+Momentum baseline by $\\ge +0.20$ Sharpe with lower MaxDD and correlation $&lt; 0.35$.<\/li><li class=\"sub-li\"><em>Stop / Kill:<\/em> If net OOS Sharpe $&lt; 0.25$ after realistic 20 bps EM ETF costs, or if alpha vanishes once daily rebalancing is slowed to monthly.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Not pursued<\/strong> — exact replication is impossible because Man Numeric&#x27;s macro feature set, ML architecture, and point-in-time institutional macro database are proprietary.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Evidence:<\/strong> Builds on EM country-risk vs. stock-selection decomposition literature and practitioner macro country-allocation models <em>(pp. 2–5)<\/em>.<\/li><li><strong>Proposal:<\/strong> Directly cross-referenced in <code>Bai___Pukthuanthong__2026__Paper_Wiki__L0-L7_<\/code> (applying multiclass cross-entropy classification to cross-sectional EM country ranking as a potential upgrade over linear scoring) and complements <strong>Jungle Rock (2026)<\/strong> (<em>Macro Regimes Quadrant<\/em>) by showing how to operationalize macro direction (<code>TS<\/code>) alongside relative cross-country positioning (<code>XS<\/code>).<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source-backed claim (<code>author_reported<\/code>):<\/strong> Combining point-in-time macro data and ML through a dual <code>TS+XS<\/code> lens across MSCI EM countries (Jan 2008 – Jun 2026, ±5% cap, gross of costs) delivers <strong>0.85 Sharpe<\/strong>, <strong>4.6% MaxDD<\/strong>, <strong>28% lower turnover<\/strong>, and <strong>0.08 correlation<\/strong> vs. a Value + 12m Momentum country baseline (Sharpe &lt; 0.5, MaxDD 8.7%) <em>(pp. 4, 8–9)<\/em>.<\/li><li><strong>Proposed falsifiable next test (<code>proposed_test<\/code>):<\/strong> Build a monthly-rebalanced, 10–12 EM country ETF MVP using 4 public macro/market-implied proxies standardized via <code>TS+XS<\/code> and test net of 20 bps costs on 2019–2026 OOS.<\/li><li><strong>Verdict and decision owner:<\/strong> <strong>Pending review<\/strong> — <strong>Strong architectural template (<code>TS + XS<\/code> dual lens to eliminate static country biases)<\/strong>; requires independent net-of-cost validation on liquid EM ETFs at monthly cadence.<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence<\/th><th>Reviewer/date<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>pass<\/td><td>Tagged by EM country timing, TS/XS dual lens, macro ML, MSCI EM, Man Group.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>pass<\/td><td>L0–L4 capture full comparison vs. Value+Mom, Korea case study, and gross-of-cost/black-box caveats.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Transparent monthly ETF proxy MVP specified, though exact Man Numeric ML features/architecture are proprietary.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>pass<\/td><td>All 11 pages read in full; all headline metrics (Sharpe 0.85, MaxDD 4.6% vs 8.7%, -28% turnover, 0.08 corr) verified with page locators.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source Drive ID / version:<\/strong> <code>1Y2YZA0hXrLDt9Cbi-GxlnlKhV-1SCG8M<\/code> — <a href=\"https://drive.google.com/file/d/1Y2YZA0hXrLDt9Cbi-GxlnlKhV-1SCG8M/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Nouvellon and Zhou (2026) - Beyond Stock Selection - A Systematic Approach to EM Country Timing.pdf<\/a> (<code>Man Group Insights, Oct 2026<\/code>, archived in <code>03_Raw<\/code>)<\/li><li><strong>Schema version:<\/strong> 0.1.1<\/li><li><strong>Changes / reviewer:<\/strong> v0.1 initial full-text L0–L7 draft created 2026-11-26; pending human review.<\/li><\/ul>"}], "searchText": "beyond stock selection: a systematic approach to em country timing mickael nouvellon, dawei zhou macro & country allocation emerging markets systematic equities machine learning tactical asset allocation time-series macro signals cross-sectional country ranking point-in-time macro data machine learning # beyond stock selection: a systematic approach to em country timing ## l0 — research in one minute **question:** can a systematic macro-driven emerging markets (em) country-timing overlay—combining point-in-time macroeconomic data, machine learning, and a dual time-series (`ts`) + cross-sectional (`xs`) lens—outperform a traditional value + 12-month momentum country model and provide uncorrelated alpha alongside bottom-up em stock selection? *(pp. 1–2, 6)* **author-reported claim and findings (`author_reported`):** yes. across all msci em countries from jan 2008 to jun 2026 (daily rebalancing, conviction-sized positions capped at $\\pm 5\\%$ per country, **gross of transaction costs**), the combined `ts+xs` macro timing model achieves a **gross sharpe ratio of 0.85**, **maximum drawdown of 4.6%**, and **28% lower turnover** than a standard cross-sectional value + 12m momentum baseline (which delivers **gross sharpe < 0.5**, **maxdd 8.7%**, and static multi-year tilts such as staying long south korea for nearly two decades) *(pp. 4, 8–9)*. daily returns of the macro model have a correlation of just **0.08** with the fundamental value + momentum country model, confirming strong diversification *(p. 9)*. **caveat (`analyst_inference`):** this is an institutional thought-leadership article from man group rather than an academic specification: **exact ml model architecture, feature list, ts/xs blending weights, and net-of-cost sharpe are undisclosed**. both models rebalance daily *gross of costs*, and the authors explicitly warn that live execution requires turnover control (smoothing or lower rebalancing frequency) *(p. 9)*—crucial in em where country-level etf/futures/cash trading costs, fx, and market-access frictions are material. ## l1 — economic intuition **author's explanation (`author_reported`):** country-level risk contributes a structurally larger share of total equity risk in em than in developed markets (dm), and rolling 12-month cross-country return dispersion is persistently wider in em due to divergent monetary cycles, terms of trade, external demand, and policy regimes *(figs. 1–2, pp. 2–3)*. simple value + momentum country models fail because valuation and 12m momentum move slowly—locking portfolios into chronic structural biases (e.g., perpetually long \"cheap\" korea regardless of macro stress) and remaining highly correlated with bottom-up stock-picking signals *(pp. 4–5)*. combining a **time-series (ts)** lens (is country $i$'s macro cy", "sortRank": 1}, {"id": "brown-spitzer-2006", "filename": "Brown_Spitzer_2006_v0.1.1.md", "title": "Caught by the Tail: Tail Risk Neutrality and Hedge Fund Returns", "authors": "Stephen J. Brown; Jonathan F. Spitzer", "year": "2006", "pubDate": "2006", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Hedge fund downside beta"], "rawUrl": "https://drive.google.com/file/d/1JEyTJzopbvJ-AzbKtyUJI8eJtC3wb92Y/view", "rawId": "1JEyTJzopbvJ-AzbKtyUJI8eJtC3wb92Y", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1JEyTJzopbvJ-AzbKtyUJI8eJtC3wb92Y/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a>. <strong>Authors:<\/strong> Stephen J. Brown; Jonathan F. Spitzer. <strong>Year:<\/strong> 2006. Draft pending human review; not independently replicated.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Research question:<\/strong> Can the paper&#x27;s identified downside-tail mechanism matter to risk management? <strong>Source-reported finding:<\/strong> Authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (Abstract). <strong>Caution:<\/strong> The source results are not trading signals or OOS validation.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">The core mechanism is that adverse outcomes can behave differently from average market conditions. <strong>Analyst inference:<\/strong> A simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> The authors develop a measure of tail neutrality and inspect hedge-fund styles and funds-of-funds. This is the authors&#x27; method, distinct from the proxy proposed under L5. Exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-based evidence<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (Abstract).<\/td><td>Abstract; introductory discussion<\/td><\/tr><tr><td>Independently verified experiment<\/td><td>None<\/td><td>Not run<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Value:<\/strong> Offers a testable downside-risk question. <strong>Concerns:<\/strong> Tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. Confirm exact sample and empirical figure details from the source before approving Q4.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Reduced-form question:<\/strong> Does the core downside-risk relationship survive a simpler point-in-time market-data test? Preserve the timing and conditional downside feature, but not necessarily all original equations.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Available inputs and trading/observation proxy:<\/strong> Compare ordinary market beta with beta conditional on bottom-decile monthly S&amp;P returns using hedge-fund index data, held-out years and sample-count controls. <strong>Execution:<\/strong> Use only observations known as of decision time t; trade no earlier than a feasible next opportunity if a strategy is tested. Account for spreads, commissions, turnover, funding and missing market data. A forecasting-only test must not be presented as trading P&amp;L.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Hypothesis:<\/strong> The simplified downside indicator improves a tail outcome versus its predeclared simple baseline. <strong>Frozen baseline experiment:<\/strong> Compare ordinary market beta with beta conditional on bottom-decile monthly S&amp;P returns using hedge-fund index data, held-out years and sample-count controls. <strong>Comparator:<\/strong> An unconditional historical rate, ordinary market beta, rolling volatility or unhedged benchmark, as appropriate to the specific dependent variable. Select before testing. <strong>Evaluation:<\/strong> Expanding/rolling training windows, strict chronological holdout, no future-informed thresholds, downside hit rates or expected shortfall, MaxDD, and if tradable after-cost results. <strong>Decision rule:<\/strong> Continue only if improvements persist out of sample, survive realistic trading frictions and at least one reasonable parameter perturbation; otherwise revise or stop this proxy (not the original theory). <strong>Status:<\/strong> Experiment specified but <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Not pursued in this batch; exact estimation requires full figure/equation inspection and source-specific data contracts.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\">Conceptually related to <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">AQR&#x27;s Tail Risk Hedging<\/a> as an additional dimension of tail-risk measurement, forecasting or hedging. This is a suggested connection, not a conclusion jointly established by authors.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported claim:<\/strong> Authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (Abstract). <strong>Next falsifiable test:<\/strong> Run the frozen L5.C proxy using point-in-time data and transparent OOS accounting. <strong>Verdict:<\/strong> Research draft worth triage; pending review, no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Live retrieval not tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Abstract-level card, reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Dataset and precise timing assumptions require a second analyst&#x27;s check<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract/introduction locator; exhibits and equations still unverified<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Source Drive file ID: <code>1JEyTJzopbvJ-AzbKtyUJI8eJtC3wb92Y<\/code>; PDF content never altered.<\/li><li>First-pass Schema v0.1.1 card, processed with Skill v0.1.2 on 2026-10-25.<\/li><\/ul>"}], "searchText": "caught by the tail: tail risk neutrality and hedge fund returns stephen j. brown; jonathan f. spitzer tail risk hedge fund downside beta # caught by the tail: tail risk neutrality and hedge fund returns **source:** [original pdf](https://drive.google.com/file/d/1jeytjzopbvj-azbktyuji8ejtc3wb92y/view). **authors:** stephen j. brown; jonathan f. spitzer. **year:** 2006. draft pending human review; not independently replicated. ## l0 — research in one minute **research question:** can the paper's identified downside-tail mechanism matter to risk management? **source-reported finding:** authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (abstract). **caution:** the source results are not trading signals or oos validation. ## l1 — economic intuition the core mechanism is that adverse outcomes can behave differently from average market conditions. **analyst inference:** a simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research. ## l2 — model construction **original method:** the authors develop a measure of tail neutrality and inspect hedge-fund styles and funds-of-funds. this is the authors' method, distinct from the proxy proposed under l5. exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim. ## l3 — empirical findings | source-based evidence | result | locator | |---|---|---| | main finding | authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (abstract). | abstract; introductory discussion | | independently verified experiment | none | not run | ## l4 — research evaluation **value:** offers a testable downside-risk question. **concerns:** tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. confirm exact sample and empirical figure details from the source before approving q4. ## l5 — practical research lab ### l5.a — core mechanism **reduced-form question:** does the core downside-risk relationship survive a simpler point-in-time market-data test? preserve the timing and conditional downside feature, but not necessarily all original equations. ### l5.b — practical implementation **available inputs and trading/observation proxy:** compare ordinary market beta with beta conditional on bottom-decile monthly s&p returns using hedge-fund index data, held-out years and sample-count controls. **execution:** use only observations kn", "sortRank": 1}, {"id": "wang-2023", "filename": "Wang_2023_v0.1.1.md", "title": "Commonality in Tail Risk Premia around the World", "authors": "Shu-Feng Wang", "year": "2023", "pubDate": "2023", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Measurement / pricing"], "rawUrl": "https://drive.google.com/file/d/1TYDPFLGAHsxdypsuMrlZaFMUbxFgCcpK/view", "rawId": "1TYDPFLGAHsxdypsuMrlZaFMUbxFgCcpK", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Shu-Feng Wang <strong>Date/version:<\/strong> 2023; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1TYDPFLGAHsxdypsuMrlZaFMUbxFgCcpK/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Measurement / pricing <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does country downside correlation jump during global risk-off episodes?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Commonality is stronger in developed and more open markets; U.S. economy and global volatility matter (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> Country tail-risk premia share global and regional components.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Examines tail-risk premium comovement for 44 countries, 1990–2015.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Commonality is stronger in developed and more open markets; U.S. economy and global volatility matter (Abstract).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does country downside correlation jump during global risk-off episodes?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> Country tail-risk premia share global and regional components.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Estimate rolling downside co-exceedances across liquid country ETFs, comparing high-VIX periods to normal regimes and a constant-correlation benchmark.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does country downside correlation jump during global risk-off episodes?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Estimate rolling downside co-exceedances across liquid country ETFs, comparing high-VIX periods to normal regimes and a constant-correlation benchmark.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Commonality is stronger in developed and more open markets; U.S. economy and global volatility matter (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1TYDPFLGAHsxdypsuMrlZaFMUbxFgCcpK<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "commonality in tail risk premia around the world shu-feng wang tail risk measurement / pricing # commonality in tail risk premia around the world **authors:** shu-feng wang measure (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> The inferred tail-risk premium changes with the definition of market-tail exposure.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Compares generalized tail dependence with a measure multiplying tail dependence by normalized tail severity.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Significant premium using tail dependence alone but no premium using the combined measure (Abstract).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does an asset&#x27;s conditional downside beta or its severity-weighted form better explain future returns?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> The inferred tail-risk premium changes with the d
