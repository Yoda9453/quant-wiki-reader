efinition of market-tail exposure.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Sort liquid equities monthly by lagged market-downside beta versus downside beta times stock loss severity, and compare subsequent factor-adjusted spreads.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does an asset&#x27;s conditional downside beta or its severity-weighted form better explain future returns?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Sort liquid equities monthly by lagged market-downside beta versus downside beta times stock loss severity, and compare subsequent factor-adjusted spreads.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Significant premium using tail dependence alone but no premium using the combined measure (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1BStw5dkyocgY4MslZKs1pGUcFKK5o3E1<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "does systematic tail risk matter? stoja, polanski, nguyen & pereverzin tail risk measurement / pricing # does systematic tail risk matter? **authors:** stoja, polanski, nguyen & pereverzin **date/version:** unverified; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1bstw5dkyocgy4mslzks1pgucfkk5o3e1/view) **track:** measurement / pricing **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does an asset's conditional downside beta or its severity-weighted form better explain future returns? **author-reported headline:** significant premium using tail dependence alone but no premium using the combined measure (abstract). **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** the inferred tail-risk premium changes with the definition of market-tail exposure. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** compares generalized tail dependence with a measure multiplying tail dependence by normalized tail severity. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | significant premium using tail dependence alone but no premium using the combined measure (abstract). | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the original authors, not to an executed vault strategy. ## l4 — research evaluation **st", "sortRank": 1}, {"id": "guo-loeper-2021-efficient-use-of-options", "filename": "Guo_Loeper_2021_Efficient_Use_of_Options_v0.1.1.md", "title": "Efficient Use of Options for Tail Risk Hedging", "authors": "{}", "year": "2021", "pubDate": "2021-03-24", "version": "0.1.1", "primaryTopic": "Tail Risk Hedging", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst/view", "rawId": "1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">Guo and Loeper examine long-equity portfolios that fund part of downside put insurance by selling out-of-the-money calls. They compare strikes, maturities and notionals using mostly 2007–2018 S&amp;P 500 options settlement data plus a 2020 episode. Their stated message is that protective puts reduce severe drawdowns but are expensive; partially financing them with call sales can improve the trade-off, though structure matters.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">Call selling collects option premium but caps some upside; put buying purchases convex loss protection. Strike, expiry and quantity jointly affect negative carry, participation in rebounds and crash behavior. Cheaper spreads/ratios may also lose protection in the very extreme tail.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">Representative portfolio: long S&amp;P 500 index, short OTM call and long OTM put; compare strike/maturity/notional choices on option settlement prices. The paper evaluates return-risk efficient frontiers, including variance and Value at Risk, explores put spreads/ratios, and separately examines 2020. Main 2007–2018 sample; 2010–2018 excluding GFC. Authors discuss option liquidity concerns but make no explicit trading-cost/market-impact assumption. Sources: Abstract, Key Takeaways, Sections 3–9.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Key takeaways: short-dated OTM call sales (example roughly 15 business days, 102–104% moneyness) were favorable in studied grids.<\/li><li>Downside puts were costly but strongly reduced drawdown in a sample including the GFC.<\/li><li>Authors report studied put-spread and put-ratio alternatives generally underperformed outright put protection in their chosen comparisons.<\/li><li>All strike recommendations are conditional on their sample and design, not universal or live-tradable prescriptions.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Main concerns: grid search/selection on a GFC-containing dataset, bid/ask and market impact omitted, OTC interpolated prices may not be executable, premium financed by selling upside, and possible dependence on cash settlement and exercise details. Stress test the tail payoff diagram before trusting Sharpe alone.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> A partially financed put hedge exchanges some upside participation for downside convexity, potentially reducing hedge carry while protecting the core portfolio.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Use current SPX option surface (or a comparable options dataset with reliable historical bid/ask) plus S&amp;P total-return exposure; first model expiry payoffs and financing, then a self-financing historical portfolio. Plan monthly put rolls, shorter-dated covered calls, collateral, commission/spread and assignment/settlement differences. Do not backtest using a mid quote that cannot be traded.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: a fixed-rule collar (long index, short 1-month 103%-strike call, long 3-month 95%-strike put) does not improve net downside protection per unit of annual premium/capped upside versus equal-premium protective puts and unhedged equity. These tenors/strikes are <strong>analyst-proposed<\/strong> starting proxies, not the paper optimum. Freeze structure before OOS test; choose historical option chain with matched contracts and next-day actual executable quotes. Track net premium flows, hedge mark-to-market, cash, total portfolio return, MaxDD, worst-5% weeks, forgone upside, gamma gaps and turnover. Costs sensitivity with full bid/ask versus mid, and 2008/2020/2022 type events if within available data. Continue only if hedge effectiveness survives realistic spreads and a range of event paths; otherwise stop or simplify to a payoff-only scenario study.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Exact surface/strike-grid replication deferred; requires original settlements, interpolation and period-specific option conventions.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Guo and Loeper examine long-equity portfolios that fund part of downside put insurance by selling out-of-the-money calls.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Metadata/tags exist; search-index retrieval not yet tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Core question and findings present; human reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form protocol proposed; second-analyst specification review pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source sections indicated; exhibit/page image confirmation pending for quantitative material<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst<\/code>.<\/li><li>Draft generated under Schema v0.1.1 on 2026-10-24.<\/li><li>Figures and parameter choices in L5 are <strong>researcher proposals<\/strong> unless clearly identified as paper content. No tests were executed.<\/li><\/ul>"}], "searchText": "efficient use of options for tail risk hedging {} tail risk hedging # efficient use of options for tail risk hedging **source:** [original pdf](https://drive.google.com/file/d/1oc3nbzfmoabnnul0xzqgz6n-buipnpst/view) · **research status:** draft, pending human review. this card is source-based but not a full academic replication. ## l0 — research in one minute guo and loeper examine long-equity portfolios that fund part of downside put insurance by selling out-of-the-money calls. they compare strikes, maturities and notionals using mostly 2007–2018 s&p 500 options settlement data plus a 2020 episode. their stated message is that protective puts reduce severe drawdowns but are expensive; partially financing them with call sales can improve the trade-off, though structure matters. ## l1 — economic intuition call selling collects option premium but caps some upside; put buying purchases convex loss protection. strike, expiry and quantity jointly affect negative carry, participation in rebounds and crash behavior. cheaper spreads/ratios may also lose protection in the very extreme tail. ## l2 — model construction representative portfolio: long s&p 500 index, short otm call and long otm put; compare strike/maturity/notional choices on option settlement prices. the paper evaluates return-risk efficient frontiers, including variance and value at risk, explores put spreads/ratios, and separately examines 2020. main 2007–2018 sample; 2010–2018 excluding gfc. authors discuss option liquidity concerns but make no explicit trading-cost/market-impact assumption. sources: abstract, key takeaways, sections 3–9. ## l3 — empirical findings **author-reported; not independently verified:** - key takeaways: short-dated otm call sales (example roughly 15 business days, 102–104% moneyness) were favorable in studied grids. - downside puts were costly but strongly reduced drawdown in a sample including the gfc. - authors report studied put-spread and put-ratio alternatives generally underperformed outright put protection in their chosen comparisons. - all strike recommendations are conditional on their sample and design, not universal or live-tradable prescriptions. ## l4 — research evaluation main concerns: grid search/selection on a gfc-containing dataset, bid/ask and market impact omitted, otc interpolated prices may not be executable, premium financed by selling upside, and possible dependence on cash settlement and exercise details. stress test the tail payoff diagram before trusting sharpe alone. ## l5 — practical research lab ### l5.", "sortRank": 1}, {"id": "jungle_rock_2026_macro_regimes_quadrant", "filename": "Jungle_Rock_2026_Macro_Regimes_Quadrant_v0.1.1.md", "title": "Macro Regimes: The New Jungle Rock Quadrant", "authors": "Jungle Rock Research", "year": "2026", "pubDate": "2026-10-06", "version": "Jungle Rock Research Blog (2026-10-06)", "primaryTopic": "Macro & Country Allocation", "category": "ML & Portfolio", "isTopicWiki": false, "tags": ["Macro Regimes", "Inflation Dynamics", "Fuzzy Logic", "Tactical Asset Allocation", "Fuzzy Logic Classifier", "Growth-Inflation Quadrant"], "rawUrl": "https://drive.google.com/file/d/1qN5fM2LnLV2H7sv-MhkFrT3_LfdB3X4X/view", "rawId": "1qN5fM2LnLV2H7sv-MhkFrT3_LfdB3X4X", "status": "carded", "reviewStatus": "pending_review", "qcPass": 3, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> How should a growth–inflation macro-regime framework for portfolio allocation be redesigned for a post-pandemic, supply-shock-driven economy where fixed business-cycle arrows and static inflation-level thresholds break down? <em>(pp. 1–5)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Jungle Rock upgrades its macro-regime quadrant in three ways <em>(pp. 1–2, 5–7)<\/em>: (1) drops the deterministic cycle sequence (<code>Expansion → Peak → Contraction → Trough<\/code>), allowing direct jumps between any growth–inflation states without imposing estimated historical Markov transition probabilities $p_{ij}$; (2) switches the inflation axis from <strong>level<\/strong> (high vs. low) to <strong>direction<\/strong> (rising vs. falling inflation impulse), reducing dependence on arbitrary sample thresholds; and (3) applies a <strong>fuzzy logic classifier<\/strong> producing normalized membership scores $\\mu_k(x_t) \\in [0, 1]$ (compatibility scores, <em>not<\/em> probabilities) to quantify regime confidence—e.g., high confidence on <code>2021-10-31<\/code> (rising inflation / high growth) vs. near-uniform low confidence on <code>2026-07-31<\/code> <em>(pp. 6–7)<\/em>. Jungle Rock macro portfolios migrated to this framework with <strong>monthly<\/strong> (previously quarterly) allocation updates <em>(p. 7)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> This is a <strong>purely conceptual methodology blog post with zero empirical backtest results<\/strong> and <strong>zero disclosed formulas<\/strong> for its proprietary U.S. growth/inflation signals or fuzzy membership functions. Additionally, even after computing continuous fuzzy membership scores $\\mu_k(x_t)$, the author still forces a single discrete <em>&quot;prevailing regime&quot;<\/em> decision in low-confidence states <em>(p. 7)<\/em> rather than blending portfolio allocations smoothly across regimes proportional to $\\mu_k(x_t)$—missing the biggest turnover-reduction benefit of fuzzy classification.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> Traditional clockwise business-cycle maps (<code>Expansion → Peak → Contraction → Trough<\/code>) rely on two Great Moderation assumptions: demand-driven fluctuations and gradual, predictable monetary policy <em>(p. 2)<\/em>. Supply shocks (energy spikes, pandemic shortages, trade/geopolitical disruptions; citing Blanchard &amp; Bernanke, 2023) move growth down and inflation up simultaneously—or reverse both simultaneously when supply chains normalize—breaking fixed cycle arrows <em>(pp. 3–4)<\/em>. Furthermore, forward-looking asset prices (especially bonds) reprice on <strong>inflation direction<\/strong> (strengthening vs. weakening impulse, citing Campbell &amp; Ammer, 1993 and Cieslak &amp; Pflueger, 2023) rather than raw level: falling 5% inflation can be bond-bullish while rising 2% inflation can be bond-bearish <em>(pp. 4–5)<\/em>. Finally, because real-time macro data are noisy with blurry regime boundaries, fuzzy membership scores $\\mu_k(x_t) \\in [0, 1]$ avoid mechanical cliff-edge regime flips <em>(pp. 5–6)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> The conceptual shift from <code>(Growth Level, Inflation Level)<\/code> to <code>(Growth Direction/State, Inflation Direction)<\/code> with <strong>soft/fuzzy regime weights<\/strong> is strongly aligned with institutional multi-asset practice (e.g., Bridgewater&#x27;s All Weather / 4-quadrant framework and Man Group&#x27;s inflation-regime work). The key desk opportunity is to take the author&#x27;s fuzzy membership idea one step further: use normalized scores $w_{\\text{regime}, k}(t) = \\mu_k(x_t) / \\sum_j \\mu_j(x_t)$ to <strong>continuously blend quadrant asset allocations<\/strong>, eliminating whipsaw turnover when the economy sits near a regime border (such as the <code>2026-07-31<\/code> low-confidence snapshot).<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>**Regime State Space <em>(pp. 5–6)<\/em>:** Four growth–inflation quadrants defined by U.S. growth state and U.S. inflation direction (rising vs. falling), treated as non-sequential states with no imposed Markov transition matrix $p_{ij} = P(R_t = j \\mid R_{t-1} = i)$ <em>(pp. 3, 5)<\/em>.<\/li><li>**Fuzzy Logic Classifier <em>(pp. 5–7)<\/em>:** Proprietary U.S. growth and inflation-direction signals are passed through a fuzzy classifier generating normalized membership scores $\\mu_k(x_t) \\in [0, 1]$ for each regime $k$, representing compatibility with each regime definition (explicitly distinguished from probabilities) <em>(pp. 6–7)<\/em>.<\/li><li>**Portfolio Integration <em>(p. 7)<\/em>:<strong> Asset-class mappings per quadrant remain unchanged from Jungle Rock&#x27;s prior blog post; portfolios update <\/strong>monthly** (increased from quarterly) using the prevailing regime.<\/li><li><strong>Unresolved extraction details:<\/strong> Exact underlying U.S. growth and inflation indicators, look-back/differencing windows, fuzzy membership functions (e.g., triangular/trapezoidal/sigmoid), quadrant asset-class weight matrices, and historical performance statistics are <strong>not disclosed<\/strong>.<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>High-Confidence Fuzzy Reading<\/td><td><code>2021-10-31<\/code>: Membership concentrated in rising-inflation / high-growth; essentially no support for low-growth states<\/td><td>Single-date illustrative chart<\/td><td>pp. 6–7<\/td><\/tr><tr><td>Low-Confidence Fuzzy Reading<\/td><td><code>2026-07-31<\/code>: Nearly equal membership support across all four regimes (ambiguous macro state)<\/td><td>Single-date illustrative chart<\/td><td>p. 7<\/td><\/tr><tr><td>Empirical Backtest Performance<\/td><td><strong>None reported<\/strong> (no CAGR, Sharpe, MaxDD, or turnover figures)<\/td><td>N/A<\/td><td>pp. 1–8<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Explicitly notes that fuzzy membership scores are compatibility measures, not calibrated probabilities <em>(pp. 6–7)<\/em>.<\/li><li>Notes that real-time macro data are noisy and often conflicting, and that even in low-confidence states (e.g., <code>2026-07-31<\/code>) a portfolio decision still has to be made <em>(pp. 6–7)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li><strong>Zero Empirical Evidence:<\/strong> Without historical backtests or out-of-sample asset-return attribution across quadrants, the claim that inflation <em>direction<\/em> + fuzzy scoring improves portfolio risk-adjusted returns remains an untested hypothesis in this document.<\/li><li><strong>Hard Prevailing-Regime Bottleneck:<\/strong> Assigning a single &quot;prevailing regime&quot; when all four scores are nearly tied (<code>2026-07-31<\/code>, <em>p. 7<\/em>) throws away the primary practical benefit of fuzzy logic (smooth weight interpolation) and reintroduces boundary whipsaw at monthly rebalancing.<\/li><li><strong>Macro Publication Lag &amp; Revisions:<\/strong> Switching from quarterly to monthly updates <em>(p. 7)<\/em> increases sensitivity to noisy monthly CPI/PCE/payroll revisions unless point-in-time vintage data (e.g., ALFRED) or market-implied proxies (breakeven inflation, yield curve, credit spreads) are used.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> A transparent, point-in-time <strong>fuzzy-blended 4-quadrant multi-asset allocator<\/strong> driven by <strong>(1) Growth Direction<\/strong> and <strong>(2) Inflation Direction<\/strong> (using smooth sigmoid/trapezoidal membership weights $\\tilde{\\mu}_k(x_t)$ to blend quadrant portfolios rather than hard-switching) outperforms both a static 60/40 benchmark and a hard-threshold level-based regime switcher on risk-adjusted return and drawdown control, particularly across inflation-shock periods (2021–2023).<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> Four liquid quadrant-proxy ETFs: <code>SPY<\/code> (growth/disinflation), <code>TLT<\/code> or <code>IEF<\/code> (slowing growth/disinflation), <code>DBC<\/code> / <code>GLD<\/code> (rising inflation / reflation &amp; stagflation), <code>SHY<\/code> (defensive cash/stagflation). Public point-in-time U.S. macro inputs (ALFRED vintage CPI YoY 3m/6m change for inflation direction; ISM Manufacturing PMI / CFNAI / initial claims 3m change for growth direction) OR zero-revision market-implied proxies (5Y5Y breakeven inflation 3m change + copper/gold ratio &amp; HY spread change).<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> Compute smoothed 3m/6m directional z-scores of Growth ($g_t$) and Inflation ($\\pi_t$) at month-end close $t$ using strictly released data (30-day lag on macro prints, 0-day lag on market proxies); execute at $t+1$ close.<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Long-only, fully invested ($\\sum w_i = 1$), 5–10 bps one-way ETF transaction cost.<\/li><li><strong>Deviations from paper:<\/strong> Replaces undisclosed proprietary Jungle Rock signals with public ALFRED/market-implied directional indicators; upgrades hard &quot;prevailing regime&quot; selection to <strong>continuous fuzzy-weighted portfolio blending<\/strong> $\\mathbf{w}_t = \\sum_{k=1}^4 \\tilde{\\mu}_k(x_t)\\mathbf{w}^{(k)}$.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Question and null:<\/strong> Does a point-in-time directional fuzzy-blended 4-quadrant allocator beat (a) static 60/40 <code>SPY<\/code>/<code>IEF<\/code>, (b) static Risk Parity (<code>SPY<\/code>/<code>IEF<\/code>/<code>GLD<\/code>/<code>DBC<\/code>), and (c) a hard-threshold level-based quadrant switcher net of 10 bps costs over 2007–2026? ($H_0: \\text{Sharpe}_{\\text{FuzzyDir}} \\le \\max(\\text{Sharpe}_{\\text{60/40}}, \\text{Sharpe}_{\\text{HardLevel}})$).<\/li><li><strong>Market-data proxy and sample:<\/strong> Monthly <code>SPY<\/code>, <code>IEF<\/code>, <code>GLD<\/code>, <code>DBC<\/code>, <code>SHY<\/code> (2006–2026; 2007–2026 OOS including 2008 GFC, 2020 COVID, and 2022 inflation shock).<\/li><li><strong>Signal and parameter specification:<\/strong> Standardize trailing 3-month change in U.S. growth proxy ($g_t$) and inflation proxy ($\\pi_t$) using expanding z-scores; define smooth fuzzy memberships $p_G = \\sigma(g_t)$, $p_I = \\sigma(\\pi_t)$ (logistic sigmoid), yielding 4 quadrant weights:<\/li><li class=\"sub-li\">Q1 (Growth↑, Infl↓): $p_G(1-p_I)$ → Equity-heavy (<code>70% SPY, 30% IEF<\/code>)<\/li><li class=\"sub-li\">Q2 (Growth↑, Infl↑): $p_G p_I$ → Reflation (<code>50% SPY, 25% DBC, 25% GLD<\/code>)<\/li><li class=\"sub-li\">Q3 (Growth↓, Infl↑): $(1-p_G)p_I$ → Stagflation (<code>40% GLD, 30% DBC, 30% SHY<\/code>)<\/li><li class=\"sub-li\">Q4 (Growth↓, Infl↓): $(1-p_G)(1-p_I)$ → Deflation/Recession (<code>70% IEF, 30% SHY<\/code>)<\/li><li><strong>Benchmark and position rule:<\/strong> Compare Fuzzy-Directional Blend vs. Hard-Directional Switch (argmax quadrant) vs. Hard-Level Switch (CPI &gt; 3% / PMI &gt; 50) vs. 60/40 and Equal-Weight 4-ETF.<\/li><li><strong>OOS / look-ahead controls / execution:<\/strong> Strictly vintage/lagged macro prints (30-day lag); expanding z-score normalization; zero parameter optimization on OOS; $t+1$ execution.<\/li><li><strong>Costs and primary metrics:<\/strong> Net Sharpe (excess of T-bills), MaxDD, Calmar ratio, 2022 drawdown, and annual two-way turnover.<\/li><li><strong>Robustness and predeclared continuation/failure criteria:<\/strong><\/li><li class=\"sub-li\"><em>Continue:<\/em> Fuzzy-Directional beats Hard-Level Switch by $\\ge +0.15$ net Sharpe with $\\ge 30\\%$ lower turnover than Hard-Directional Switch, and materially reduces 2022 drawdown vs. 60/40.<\/li><li class=\"sub-li\"><em>Stop / Kill:<\/em> If directional fuzzy blending fails to beat simple static Risk Parity / Equal-Weight <code>SPY<\/code>/<code>IEF<\/code>/<code>GLD<\/code>/<code>DBC<\/code> net of 10 bps costs.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Not pursued<\/strong> — proprietary signals and membership functions are not disclosed.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Evidence:<\/strong> Cites Hamilton (1989) Markov regime-switching, Campbell &amp; Ammer (1993) inflation news &amp; bond returns, Blanchard &amp; Bernanke (2023) pandemic supply-shock inflation, and Cieslak &amp; Pflueger (2023) demand- vs. supply-driven inflation <em>(pp. 2–5, 8)<\/em>.<\/li><li><strong>Proposal:<\/strong> Complements <strong>Nouvellon &amp; Zhou (2026)<\/strong> (<em>Man Group EM Country Timing<\/em>, same batch) on using directional macro impulses (<code>TS<\/code>) rather than static levels, and <strong>Beutel et al. (2022)<\/strong> (<em>Global Financial Cycle and Macroeconomic Tail Risks<\/em>, in <code>02_Wiki/Papers<\/code>) on macro-regime conditioning for tail-risk hedging.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source-backed claim (<code>author_reported<\/code>):<\/strong> Replacing fixed business-cycle arrows and static inflation-level cutoffs with non-sequential, inflation-direction quadrants scored via fuzzy logic ($\\mu_k(x_t) \\in [0, 1]$) better reflects shock-driven macro environments and reveals regime-classification confidence <em>(pp. 1–7)<\/em>.<\/li><li><strong>Proposed falsifiable next test (<code>proposed_test<\/code>):<\/strong> Backtest a point-in-time logistic-fuzzy 4-quadrant ETF blender (<code>SPY<\/code>/<code>IEF<\/code>/<code>GLD<\/code>/<code>DBC<\/code>/<code>SHY<\/code>, 2007–2026) comparing directional fuzzy blending against hard level-switching and static 60/40.<\/li><li><strong>Verdict and decision owner:<\/strong> <strong>Pending review<\/strong> — <strong>Useful conceptual design note (especially fuzzy weight blending &amp; inflation direction)<\/strong>, but carries zero empirical proof; validate via the L5.C MVP before adopting.<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence<\/th><th>Reviewer/date<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>pass<\/td><td>Tagged by macro regimes, inflation direction, fuzzy logic, growth-inflation quadrant, TAA.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>pass<\/td><td>L0–L4 capture all three design shifts, cited literature, and lack of empirical evidence.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Clean public logistic-fuzzy 4-quadrant ETF MVP specified; original Jungle Rock signals are proprietary.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>pass<\/td><td>All 8 pages read in full; citations, illustrative dates (<code>2021-10-31<\/code>, <code>2026-07-31<\/code>), and monthly update shift verified.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source Drive ID / version:<\/strong> <code>1qN5fM2LnLV2H7sv-MhkFrT3_LfdB3X4X<\/code> — <a href=\"https://drive.google.com/file/d/1qN5fM2LnLV2H7sv-MhkFrT3_LfdB3X4X/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Jungle Rock (2026) - Macro Regimes - The New Jungle Rock Quadrant.pdf<\/a> (<code>2026-10-06<\/code>, archived in <code>03_Raw<\/code>)<\/li><li><strong>Schema version:<\/strong> 0.1.1<\/li><li><strong>Changes / reviewer:<\/strong> v0.1 initial full-text L0–L7 draft created 2026-11-26; pending human review.<\/li><\/ul>"}], "searchText": "macro regimes: the new jungle rock quadrant jungle rock research macro & country allocation macro regimes inflation dynamics fuzzy logic tactical asset allocation fuzzy logic classifier growth-inflation quadrant inflation direction non-sequential regimes # macro regimes: the new jungle rock quadrant ## l0 — research in one minute **question:** how should a growth–inflation macro-regime framework for portfolio allocation be redesigned for a post-pandemic, supply-shock-driven economy where fixed business-cycle arrows and static inflation-level thresholds break down? *(pp. 1–5)* **author-reported claim and findings (`author_reported`):** jungle rock upgrades its macro-regime quadrant in three ways *(pp. 1–2, 5–7)*: (1) drops the deterministic cycle sequence (`expansion → peak → contraction → trough`), allowing direct jumps between any growth–inflation states without imposing estimated historical markov transition probabilities $p_{ij}$; (2) switches the inflation axis from **level** (high vs. low) to **direction** (rising vs. falling inflation impulse), reducing dependence on arbitrary sample thresholds; and (3) applies a **fuzzy logic classifier** producing normalized membership scores $\\mu_k(x_t) \\in [0, 1]$ (compatibility scores, *not* probabilities) to quantify regime confidence—e.g., high confidence on `2021-10-31` (rising inflation / high growth) vs. near-uniform low confidence on `2026-07-31` *(pp. 6–7)*. jungle rock macro portfolios migrated to this framework with **monthly** (previously quarterly) allocation updates *(p. 7)*. **caveat (`analyst_inference`):** this is a **purely conceptual methodology blog post with zero empirical backtest results** and **zero disclosed formulas** for its proprietary u.s. growth/inflation signals or fuzzy membership functions. additionally, even after computing continuous fuzzy membership scores $\\mu_k(x_t)$, the author still forces a single discrete *\"prevailing regime\"* decision in low-confidence states *(p. 7)* rather than blending portfolio allocations smoothly across regimes proportional to $\\mu_k(x_t)$—missing the biggest turnover-reduction benefit of fuzzy classification. ## l1 — economic intuition **author's explanation (`author_reported`):** traditional clockwise business-cycle maps (`expansion → peak → contraction → trough`) rely on two great moderation assumptions: demand-driven fluctuations and gradual, predictable monetary policy *(p. 2)*. supply shocks (energy spikes, pandemic shortages, trade/geopolitical disruptions; citing blanchard & bernanke, 2023) move growth down and inflation up simultaneously—or reverse both simultaneously when supply chains normalize—breaking fixed cycle arrows *(pp. 3–4)*. furthermore, forward-looking asset prices (espec", "sortRank": 1}, {"id": "bhansali-davis-2010", "filename": "Bhansali_Davis_2010_v0.1.1.md", "title": "Offensive Risk Management: Can Tail Risk Hedging Be Profitable?", "authors": "Vineer Bhansali & Joshua M. Davis", "year": "2010", "pubDate": "2010", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Hedging / redeployment"], "rawUrl": "https://drive.google.com/file/d/1DQtVg6af98ExzhyDzzia28N_rB6QbGa3/view", "rawId": "1DQtVg6af98ExzhyDzzia28N_rB6QbGa3", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Vineer Bhansali &amp; Joshua M. Davis <strong>Date/version:<\/strong> 2010; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1DQtVg6af98ExzhyDzzia28N_rB6QbGa3/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Hedging / redeployment <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> Insurance payouts can be more valuable when deployed into distressed investments.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Economic portfolio model links hedge premium and crisis-liquidity shadow value to the opportunity to add risk following drawdowns.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> Insurance payouts can be more valuable when deployed into distressed investments.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Compare fixed-budget synthetic crash payouts held as bills vs precommitted post-crash re-risking; include hedge premium and rebalance frictions.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Compare fixed-budget synthetic crash payouts held as bills vs precommitted post-crash re-risking; include hedge premium and rebalance frictions.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1DQtVg6af98ExzhyDzzia28N_rB6QbGa3<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "offensive risk management: can tail risk hedging be profitable? vineer bhansali & joshua m. davis tail risk hedging / redeployment # offensive risk management: can tail risk hedging be profitable? **authors:** vineer bhansali & joshua m. davis **date/version:** 2010; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1dqtvg6af98exzhydzzia28n_rb6qbga3/view) **track:** hedging / redeployment **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash? **author-reported headline:** authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections). **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** insurance payouts can be more valuable when deployed into distressed investments. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** economic portfolio model links hedge premium and crisis-liquidity shadow value to the opportunity to add risk following drawdowns. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections). | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the original authors, not to an ", "sortRank": 1}, {"id": "haase-neuenkirch-2021-bull-bear-markets", "filename": "Haase_Neuenkirch_2021_Bull_Bear_Markets_v0.1.1.md", "title": "Predictability of Bull and Bear Markets: A New Look at Forecasting Stock Market", "authors": "{}", "year": "2021", "pubDate": "2021-01", "version": "0.1.1", "primaryTopic": "Tail Risk Forecasting", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1IqYlO3KVfABFaVwNT8zbHM2YiSwsalT9/view", "rawId": "1IqYlO3KVfABFaVwNT8zbHM2YiSwsalT9", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1IqYlO3KVfABFaVwNT8zbHM2YiSwsalT9/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">This paper predicts weekly bull/bear regimes rather than simply next-period market returns. The authors combine diffusion indices from 115 macro-financial series, shrinkage/PCA, Markov switching with time-varying transition probabilities and forecast combinations. They report improved regime classification and investor utility, but <em>not<\/em> persistent superiority of return forecasts over the historical mean.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">Market regimes are persistent but uncertain; stable, low-dimensional predictors may improve state-transition estimates relative to fitting all macro variables directly. Forecasting the probability of a bear regime is different from forecasting the exact return, and may still support risk-budgeting rules.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">Weekly S&amp;P 500 and macro-financial observations covering Nov 24, 1989–Jul 3, 2020; real-time out-of-sample experiment spans last 820 weeks, initial training ending Oct 15, 2004. Construct PCA or sparse-PCA diffusion indices from 115 predictors, estimate Markov-switching model with time-varying transition probabilities, aggregate model forecasts. Paper discusses publication lags/revisions and transaction costs. Methods and data section, and conclusions.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Abstract: authors report statistically improved regime forecasts against multiple benchmarks, increased certainty-equivalent performance and reduced tail exposure in their trading exercise.<\/li><li>Abstract/conclusion: return predictions do <strong>not<\/strong> consistently outperform historical-average forecasts.<\/li><li>The introduction reports regime classification above 80% under their model and chosen dating conventions; event class imbalance and signal timing need checking.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Strong distinction between state prediction and return prediction. Risks: ex-post regime labels use future paths if carelessly reused; macro series vintage and publication lags, sample-dependent regime definitions, model proliferation and optimistic accuracy in imbalanced samples. Do not equate higher classification accuracy with a profitable strategy.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> A small set of lagged macro-financial variables can predict an increased probability of a sustained risk-off regime, potentially improving ex-ante portfolio exposure.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Use weekly S&amp;P 500 total-return data, lagged financial conditions proxies such as term spread, credit spread and realized equity volatility, all lagged to public availability. Test logistic probability of downside regime first; a full Markov-switching engine is optional. Positions SPY or Treasury bill at next eligible close; monitor rebalance and risk-on opportunity cost.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: simple lagged weekly predictors do not beat a trailing-market-state baseline for next-4-week drawdown warning. Freeze target as SPY next-4-week drawdown worse than -8% (overlapping outcomes acknowledged) and predictors as 4-week equity return, 13-week realized volatility and credit spread level/change. Fit expanding-window regularized logistic from training history; purge/embargo overlapping labels and evaluate a chronological holdout using Brier score, precision/recall at predeclared alert rates and drawdown-sensitive utility, versus volatility-only baseline. Act on the signal no earlier than next weekly close, assuming economic data vintages genuinely known at the decision time. Continue only if improvement holds across crises without excessive false alarms/turnover.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Full replication would require historical real-time vintages of all 115 variables, sparse PCA construction, full MS-TVTP model estimates and their regime-dating convention.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> This paper predicts weekly bull/bear regimes rather than simply next-period market returns.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Metadata/tags exist; search-index retrieval not yet tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Core question and findings present; human reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form protocol proposed; second-analyst specification review pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source sections indicated; exhibit/page image confirmation pending for quantitative material<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1IqYlO3KVfABFaVwNT8zbHM2YiSwsalT9<\/code>.<\/li><li>Draft generated under Schema v0.1.1 on 2026-10-24.<\/li><li>Figures and parameter choices in L5 are <strong>researcher proposals<\/strong> unless clearly identified as paper content. No tests were executed.<\/li><\/ul>"}], "searchText": "predictability of bull and bear markets: a new look at forecasting stock market {} tail risk forecasting # predictability of bull and bear markets: a new look at forecasting stock market regimes (and returns) in the us **source:** [original pdf](https://drive.google.com/file/d/1iqylo3kvfabfavwnt8zbhm2yiswsalt9/view) · **research status:** draft, pending human review. this card is source-based but not a full academic replication. ## l0 — research in one minute this paper predicts weekly bull/bear regimes rather than simply next-period market returns. the authors combine diffusion indices from 115 macro-financial series, shrinkage/pca, markov switching with time-varying transition probabilities and forecast combinations. they report improved regime classification and investor utility, but *not* persistent superiority of return forecasts over the historical mean. ## l1 — economic intuition market regimes are persistent but uncertain; stable, low-dimensional predictors may improve state-transition estimates relative to fitting all macro variables directly. forecasting the probability of a bear regime is different from forecasting the exact return, and may still support risk-budgeting rules. ## l2 — model construction weekly s&p 500 and macro-financial observations covering nov 24, 1989–jul 3, 2020; real-time out-of-sample experiment spans last 820 weeks, initial training ending oct 15, 2004. construct pca or sparse-pca diffusion indices from 115 predictors, estimate markov-switching model with time-varying transition probabilities, aggregate model forecasts. paper discusses publication lags/revisions and transaction costs. methods and data section, and conclusions. ## l3 — empirical findings **author-reported; not independently verified:** - abstract: authors report statistically improved regime forecasts against multiple benchmarks, increased certainty-equivalent performance and reduced tail exposure in their trading exercise. - abstract/conclusion: return predictions do **not** consistently outperform historical-average forecasts. - the introduction reports regime classification above 80% under their model and chosen dating conventions; event class imbalance and signal timing need checking. ## l4 — research evaluation strong distinction between state prediction and return prediction. risks: ex-post regime labels use future paths if carelessly reused; macro series vintage and publication lags, sample-dependent regime definitions, model proliferation and optimistic accuracy in imbalanced samples. do not equate higher classification accuracy with a profitabl", "sortRank": 1}, {"id": "dean_2026_scale_invariant_momentum", "filename": "Dean_2026_Scale_Invariant_Momentum_v0.1.1.md", "title": "Scale Invariant Dynamics in Market Price Momentum", "authors": "Bruce H. Dean", "year": "2026", "pubDate": "2026-03", "version": "Working Paper v1.2.3 (Dec 2025, Revised Mar 2026)", "primaryTopic": "Trend Following & Momentum", "category": "Trend & Momentum", "isTopicWiki": false, "tags": ["Econophysics", "Market Microstructure", "Mean Reversion", "Futures Markets", "SINDy", "Phase Space"], "rawUrl": "https://drive.google.com/file/d/1u2tKciNWiMDS1pKnyXOd-tT9_IJd_ThH/view", "rawId": "1u2tKciNWiMDS1pKnyXOd-tT9_IJd_ThH", "status": "carded", "reviewStatus": "pending_review", "qcPass": 4, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> If we plot futures price momentum ($n$-bar log return $x_t$) against its rate of change ($y_t = \\Delta x_t$) in a 2D kinematic phase space and apply Sparse Identification of Nonlinear Dynamics (SINDy), what governing equations emerge across timescales (1-min to weekly) and across six major futures markets? <em>(pp. 1–3, 6)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Across 15 years of 1-minute E-mini S&amp;P 500 (<code>ES<\/code>, 5.36M bars, Jun 2010 – Dec 2025) and five other futures (<code>NQ<\/code>, <code>CL<\/code>, <code>GC<\/code>, <code>ZB<\/code>, <code>6E<\/code>), phase portraits show a dissipative spiral attractor. SINDy discovers a linear Stochastic Damped Harmonic Oscillator (SDHO): $\\frac{dy}{dt} \\approx -0.24x - 1.15y$ (hourly <code>ES<\/code>, $R^2 = 0.570$, <em>Table 4, p. 12<\/em>). Two dimensionless quantities are universal across all six markets (CV $&lt; 4\\%$): dissipation rate $\\Omega = 1.15 \\pm 0.04$ and deterministic fraction $R^2 = 0.58 \\pm 0.01$, while the scaled restoring force $\\Phi = k \\cdot \\text{Var}(x)$ varies across asset classes from <code>0.016<\/code> (<code>6E<\/code> FX) to <code>0.292<\/code> (<code>CL<\/code> crude oil) <em>(Table 2, p. 7)<\/em>. Eigenvalue analysis at hourly aggregation places <code>ES<\/code> near critical damping with a slow-mode half-life of $\\approx 2.5$ hours <em>(pp. 15–17)<\/em>. The author explicitly notes $R^2$ measures conditional acceleration variance, not tradable return predictability <em>(pp. 1, 13)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> <strong>CRITICAL MATHEMATICAL AUDIT FLAG:<\/strong> The paper&#x27;s headline &quot;universal physics&quot; ($\\Omega \\approx 1.15$, $R^2 \\approx 0.57$, $k \\propto 1/n$, and lookback-invariant $\\Phi$) is <strong>predominantly a mechanical artifact of overlapping $n$-bar return differences<\/strong>! For a pure i.i.d. random walk ($r_t \\sim \\mathcal{N}(0, \\sigma_r^2)$) with $x_t = \\sum_{j=0}^{n-1} r_{t-j}$ and $y_t = x_t - x_{t-1} = r_t - r_{t-n}$, regressing $\\Delta y_t = y_{t+1} - y_t = r_{t+1} - r_{t+1-n} - y_t$ on $(x_t, y_t)$ mechanically recovers $k \\approx 1/n$, $\\Omega \\approx 1 + 1/n$, $R^2 \\approx 0.50\\text{--}0.58$, and $\\Phi = k\\cdot\\text{Var}(x) \\approx \\frac{1}{n}(n\\sigma_r^2) = \\sigma_r^2$ (literally just each market&#x27;s single-bar return variance!). No random-walk Monte Carlo null benchmark is ever reported in the paper.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> The author interprets $-kx$ as a mean-reverting restoring force (value investors, stat-arb, market makers) and $-\\Omega y$ as a universal damping force reflecting order-flow exhaustion and information absorption <em>(pp. 9–10, 19)<\/em>. Near-critical damping is interpreted as an Adaptive Markets equilibrium between mean-reversion and trend-following traders <em>(pp. 17, 20)<\/em>, while cross-asset ordering $\\Phi_{\\text{CL}} &gt; \\Phi_{\\text{GC}} &gt; \\Phi_{\\text{NQ}} &gt; \\Phi_{\\text{ES}} &gt; \\Phi_{\\text{ZB}} &gt; \\Phi_{\\text{6E}}$ is attributed to fundamental price anchors (physical storage in oil vs. uncovered interest parity in FX) <em>(pp. 8–9)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> Because $x_t$ is an $n$-bar rolling sum of log returns and $y_t = r_t - r_{t-n}$, the next change $\\Delta y_t = r_{t+1} - r_{t+1-n} - y_t$ contains $-y_t$ identically (explaining $R^2 \\ge 0.50$ and $\\Omega \\approx 1$) plus $-r_{t+1-n}$, which is one of the $n$ summands inside $x_t$ (mechanically creating a negative correlation with $x_t$ of slope $k \\approx 1/n$). Consequently, $\\Phi = k \\cdot \\text{Var}(x) \\approx \\sigma_r^2$ simply ranks the six futures by their <strong>1-hour squared volatility<\/strong> (<code>CL<\/code> most volatile, <code>6E<\/code> least volatile), not by fundamental mean-reversion strength! Any genuine market microstructure deviation can only be measured as the <strong>residual excess over an i.i.d. random walk null<\/strong> on the exact same $(x_t, y_t)$ transformation.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>**Dataset <em>(Table 1, p. 5; Sec. 2.4, p. 6)<\/em>:** 1-minute bars of CME <code>ES<\/code> futures from June 2010 to December 2025 (<code>5,360,793<\/code> bars; ~3,880 trading sessions), aggregated to 1m, 5m, 15m, 1h (~91,897 obs), 4h, daily (4,803 obs), and weekly (1,128 obs). Cross-market comparison at 1-hour aggregation on <code>ES<\/code>, <code>NQ<\/code>, <code>CL<\/code>, <code>GC<\/code>, <code>ZB<\/code>, <code>6E<\/code>.<\/li><li>**Kinematic Phase Space Coordinates <em>(Sec. 2.2, p. 6)<\/em>:** $$x_t = \\ln\\!\\left(\\frac{P_t}{P_{t-n}}\\right) \\times 100 \\quad (\\text{baseline } n = 5), \\qquad y_t = x_t - x_{t-1} = \\Delta x_t$$<\/li><li>**SINDy Discovery Library <em>(Sec. 4.1–4.2, p. 12)<\/em>:** Polynomial candidate library up to 3rd order $\\Theta(z) = [1, x, y, x^2, xy, y^2, x^3, x^2y, xy^2, y^3]$ with sparsity-promoting regularization. Returns linear SDHO: $$\\frac{dx}{dt} = y, \\qquad \\frac{dy}{dt} = -k x - \\Omega y + \\sigma \\xi(t)$$<\/li><li>**Dimensionless Invariants &amp; Fisher Metric <em>(Sec. 5 &amp; 6.2, pp. 14–18)<\/em>:**<\/li><li class=\"sub-li\">Dissipation $\\Omega$, acceleration variance ratio $R^2$, and scaled restoring force $\\Phi = k \\cdot \\text{Var}(x) = \\sigma^2/(2\\Omega) = \\text{Var}(y)$.<\/li><li class=\"sub-li\">Stationary Lyapunov covariance yields diagonal Fisher metric $ds^2 = \\frac{dk^2}{2k\\Omega} + \\frac{d\\Omega^2}{2\\Omega} + \\frac{2d\\sigma^2}{\\sigma^2}$ <em>(p. 17)<\/em>.<\/li><li class=\"sub-li\">System eigenvalues $\\lambda_{1,2} = \\frac{-\\Omega \\pm \\sqrt{\\Omega^2 - 4k}}{2}$ with discriminant $\\Delta = \\Omega^2 - 4k$ <em>(p. 15)<\/em>.<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>SINDy Hourly <code>ES<\/code> Equations<\/td><td>$dx/dt = y$ ($R^2 = 1.000$); $dy/dt = -0.24x - 1.15y$ ($R^2 = 0.570$); all nonlinear terms zeroed<\/td><td>1-hour <code>ES<\/code> (~91,897 obs), $n=5$<\/td><td>Table 4, p. 12<\/td><\/tr><tr><td>Cross-Market Universality (6 Futures)<\/td><td>$\\Omega$: <code>1.12–1.21<\/code> (mean <code>1.15<\/code>, CV <code>3.0%<\/code>)&lt;br&gt;$R^2$: <code>0.56–0.59<\/code> (mean <code>0.58<\/code>, CV <code>2.0%<\/code>)&lt;br&gt;$\\Phi$: <code>CL 0.292<\/code>, <code>GC 0.106<\/code>, <code>NQ 0.069<\/code>, <code>ES 0.046<\/code>, <code>ZB 0.021<\/code>, <code>6E 0.016<\/code> (CV <code>103%<\/code>)<\/td><td>1-hour aggregation, $n=5$ (<code>ES<\/code>, <code>NQ<\/code>, <code>CL<\/code>, <code>GC<\/code>, <code>ZB<\/code>, <code>6E<\/code>)<\/td><td>Table 2, p. 7<\/td><\/tr><tr><td>Timescale Stability (<code>ES<\/code>)<\/td><td>$R^2$: 1-Hour <code>0.570<\/code> ($n=91,897$), Daily <code>0.571<\/code> ($n=4,803$), Weekly <code>0.591<\/code> ($n=1,128$)<\/td><td><code>ES<\/code> Jun 2010 – Dec 2025<\/td><td>Table 5, p. 14<\/td><\/tr><tr><td>Look-Back Sweep (<code>ES<\/code> 1-Hour)<\/td><td>$n=3$: $k=0.427, \\Omega=1.23, R^2=0.61, \\Phi=0.048$&lt;br&gt;$n=5$: $k=0.241, \\Omega=1.15, R^2=0.57, \\Phi=0.046$&lt;br&gt;$n=10$: $k=0.116, \\Omega=1.08, R^2=0.54, \\Phi=0.046$&lt;br&gt;$n=20$: $k=0.056, \\Omega=1.04, R^2=0.52, \\Phi=0.046$<\/td><td><code>ES<\/code> 1-hour<\/td><td>Table 6, p. 14<\/td><\/tr><tr><td>Critical Damping Transition<\/td><td>$n=3$: $\\Delta = -0.19$ (Underdamped); $n=5$: $\\Delta = +0.35$ (Overdamped, $\\lambda_1 \\approx -0.28, \\lambda_2 \\approx -0.87$, $\\tau_{\\text{slow}} \\approx 3.6$h, $t_{1/2} \\approx 2.5$h)<\/td><td><code>ES<\/code> 1-hour<\/td><td>Table 7, pp. 16–17<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Explicitly warns that $R^2 \\approx 0.57$ is an in-sample conditional variance decomposition of momentum acceleration $\\Delta x$, <strong>not<\/strong> return predictability or tradable alpha <em>(pp. 1, 13, 20)<\/em>.<\/li><li>Linear SDHO breaks down at monthly and longer horizons where nonlinear terms appear (deferred to companion paper Dean, 2026) <em>(pp. 14, 20)<\/em>.<\/li><li>Treated invariants as static across the 15-year sample (though first-half vs. second-half subsamples were consistent) <em>(p. 20)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li><strong>No Random-Walk Null Benchmark (Fatal Confound):<\/strong> The paper asserts on <em>p. 3<\/em> that <em>&quot;random walks produce diffuse, directionless flow fields&quot;<\/em>, which is <strong>false<\/strong> for overlapping $n$-bar returns $(x_t, \\Delta x_t)$! Under a pure i.i.d. random walk, $x_t$ and $y_t = r_t - r_{t-n}$ mechanically generate an inward spiral flow field, $k \\approx 1/n$, $\\Omega \\approx 1 + 1/n$, $R^2 \\approx 0.55\\text{--}0.58$, and $\\Phi \\approx \\sigma_r^2$—matching Tables 2, 4, 5, and 6 almost to the second decimal place!<\/li><li><strong>Misinterpretation of $\\Phi$:<\/strong> Because $\\Phi = k \\cdot \\text{Var}(x) \\approx \\sigma_r^2$ under a random walk, the cross-asset ranking (<code>CL &gt; GC &gt; NQ &gt; ES &gt; ZB &gt; 6E<\/code>) simply reflects raw hourly return variance of each futures contract, not fundamental mean-reversion intensity.<\/li><li><strong>No Direct Return-Forecasting Test:<\/strong> Predicting $\\Delta y_t$ includes known past return drops ($-r_{t+1-n} - y_t$); the only unknown term is $r_{t+1}$, which should be regressed directly on $(x_t, y_t)$ to test whether any genuine anti-persistence exists beyond mechanical overlap.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> Test whether <strong>real futures returns<\/strong> produce statistically different $(k, \\Omega, R^2, \\Phi)$—or nonzero direct next-bar return predictability $r_{t+1} = a + b_1 x_t + b_2 y_t + \\varepsilon_{t+1}$—compared to a <strong>shuffled / i.i.d. Gaussian random-walk surrogate<\/strong> with the exact same marginal return distribution and lookback $n \\in \\{3, 5, 10, 20\\}$.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> Hourly or daily continuous futures (<code>ES<\/code>, <code>CL<\/code>, <code>GC<\/code>, <code>ZB<\/code>, <code>6E<\/code>) or liquid ETF proxies (<code>SPY<\/code>, <code>USO<\/code>, <code>GLD<\/code>, <code>TLT<\/code>, <code>FXE<\/code>), plus synthetic i.i.d. Gaussian / block-permuted random-walk series of identical length and variance.<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> Purely observational / diagnostic test first (not a live trading strategy); if direct $r_{t+1}$ predictability survives surrogate testing, evaluate strictly causal $t \\to t+1$ execution net of futures bid-ask spread (1–2 bps).<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Observational study first (<code>Not applicable<\/code> for live sizing until random-walk null is rejected).<\/li><li><strong>Deviations from paper:<\/strong> Adds the missing <strong>i.i.d. random-walk / return-permutation null test<\/strong> and separates mechanical lag-drop terms from true future return $r_{t
