eading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-based evidence<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors find intraday jump clustering and jump relationships with U.S. macro news, notably FOMC announcements (Abstract and Introduction).<\/td><td>Abstract; introductory discussion<\/td><\/tr><tr><td>Independently verified experiment<\/td><td>None<\/td><td>Not run<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Value:<\/strong> Offers a testable downside-risk question. <strong>Concerns:<\/strong> Tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. Confirm exact sample and empirical figure details from the source before approving Q4.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Reduced-form question:<\/strong> Does the core downside-risk relationship survive a simpler point-in-time market-data test? Preserve the timing and conditional downside feature, but not necessarily all original equations.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Available inputs and trading/observation proxy:<\/strong> Estimate whether prior-day large FX moves and a preannounced FOMC indicator predict next-day large FX moves and whether a fixed carry-risk reduction rule lowers drawdowns. <strong>Execution:<\/strong> Use only observations known as of decision time t; trade no earlier than a feasible next opportunity if a strategy is tested. Account for spreads, commissions, turnover, funding and missing market data. A forecasting-only test must not be presented as trading P&amp;L.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Hypothesis:<\/strong> The simplified downside indicator improves a tail outcome versus its predeclared simple baseline. <strong>Frozen baseline experiment:<\/strong> Estimate whether prior-day large FX moves and a preannounced FOMC indicator predict next-day large FX moves and whether a fixed carry-risk reduction rule lowers drawdowns. <strong>Comparator:<\/strong> An unconditional historical rate, ordinary market beta, rolling volatility or unhedged benchmark, as appropriate to the specific dependent variable. Select before testing. <strong>Evaluation:<\/strong> Expanding/rolling training windows, strict chronological holdout, no future-informed thresholds, downside hit rates or expected shortfall, MaxDD, and if tradable after-cost results. <strong>Decision rule:<\/strong> Continue only if improvements persist out of sample, survive realistic trading frictions and at least one reasonable parameter perturbation; otherwise revise or stop this proxy (not the original theory). <strong>Status:<\/strong> Experiment specified but <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Not pursued in this batch; exact estimation requires full figure/equation inspection and source-specific data contracts.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\">Conceptually related to <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">AQR&#x27;s Tail Risk Hedging<\/a> as an additional dimension of tail-risk measurement, forecasting or hedging. This is a suggested connection, not a conclusion jointly established by authors.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported claim:<\/strong> Authors find intraday jump clustering and jump relationships with U.S. macro news, notably FOMC announcements (Abstract and Introduction). <strong>Next falsifiable test:<\/strong> Run the frozen L5.C proxy using point-in-time data and transparent OOS accounting. <strong>Verdict:<\/strong> Research draft worth triage; pending review, no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Live retrieval not tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Abstract-level card, reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Dataset and precise timing assumptions require a second analyst&#x27;s check<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract/introduction locator; exhibits and equations still unverified<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Source Drive file ID: <code>1St_W_bAkHG5l3gppdvPMlKokQSL2mHbT<\/code>; PDF content never altered.<\/li><li>First-pass Schema v0.1.1 card, processed with Skill v0.1.2 on 2026-10-25.<\/li><\/ul>"}], "searchText": "tales of tails: jumps in currency markets suzanne s. lee; minho wang tail risk fx jumps # tales of tails: jumps in currency markets **source:** [original pdf](https://drive.google.com/file/d/1st_w_bakhg5l3gppdvpmlkokqsl2mhbt/view). **authors:** suzanne s. lee; minho wang. **year:** 2016. draft pending human review; not independently replicated. ## l0 — research in one minute **research question:** can the paper's identified downside-tail mechanism matter to risk management? **source-reported finding:** authors find intraday jump clustering and jump relationships with u.s. macro news, notably fomc announcements (abstract and introduction). **caution:** the source results are not trading signals or oos validation. ## l1 — economic intuition the core mechanism is that adverse outcomes can behave differently from average market conditions. **analyst inference:** a simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research. ## l2 — model construction **original method:** a 16-currency panel of 15-minute exchange rates is analyzed using general jump regression, event timing, and jump clustering. this is the authors' method, distinct from the proxy proposed under l5. exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim. ## l3 — empirical findings | source-based evidence | result | locator | |---|---|---| | main finding | authors find intraday jump clustering and jump relationships with u.s. macro news, notably fomc announcements (abstract and introduction). | abstract; introductory discussion | | independently verified experiment | none | not run | ## l4 — research evaluation **value:** offers a testable downside-risk question. **concerns:** tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. confirm exact sample and empirical figure details from the source before approving q4. ## l5 — practical research lab ### l5.a — core mechanism **reduced-form question:** does the core downside-risk relationship survive a simpler point-in-time market-data test? preserve the timing and conditional downside feature, but not necessarily all original equations. ### l5.b — practical implementation **available inputs and trading/observation proxy:** estimate whether prior-day large fx moves and a preannounced fomc indicator predict next-day large fx moves and whether a fixed carry-risk reduction rule lowers drawdowns. **execution:** use only ", "sortRank": 1}, {"id": "micaletti_2022_tf_relative_sentiment", "filename": "Micaletti_2022_Trend_Following_Relative_Sentiment_v0.1.1.md", "title": "The Complementarity of Trend Following and Relative Sentiment", "authors": "Raymond C. Micaletti", "year": "2022", "pubDate": "2022-09", "version": "SSRN Working Paper (abstract=4235609, Sep 2022)", "primaryTopic": "Trend Following & Momentum", "category": "Trend & Momentum", "isTopicWiki": false, "tags": ["Relative Sentiment", "Tactical Asset Allocation", "Drawdown Mitigation", "Behavioral Finance", "10-Month SMA", "COT Positioning"], "rawUrl": "https://drive.google.com/file/d/1qcdEjcFNdAx9NQbWdPOjE0Lon5t59INH/view", "rawId": "1qcdEjcFNdAx9NQbWdPOjE0Lon5t59INH", "status": "carded", "reviewStatus": "pending_review", "qcPass": 3, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Even though long-only equity Trend Following (TF) and institutional-vs.-retail Relative Sentiment (RS) have a moderately high unconditional return correlation (0.69), do they complement each other across market drawdowns and strong uptrends so that a 50/50 blend (<code>TFRS<\/code>) improves tail behavior and investor regret? <em>(pp. 1, 5, 8)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Yes. Across Nov 1994 – Sep 2022 (333 months; 9 U.S. equity drawdowns $\\ge 10\\%$), a 50/50 blend (<code>TFRS<\/code>) of 10-month SMA trend following and a 3-indicator Relative Sentiment composite delivers <strong>12.0% CAGR<\/strong> and <strong>0.90 Sharpe<\/strong> (vs. <strong>11.4% / 0.73<\/strong> for TF, <strong>12.3% / 0.95<\/strong> for RS, and <strong>9.8% / 0.47<\/strong> for the market) with <strong>thinner return tails<\/strong> (excess kurtosis <strong>5.71<\/strong> vs. 6.72 for TF and 6.75 for RS) <em>(Table I, p. 9)<\/em>. RS strongly outperforms TF during peak-to-recovery drawdowns (<strong>10.6% vs. 3.6% CAGR<\/strong>, especially <strong>27.9% vs. 16.2%<\/strong> from trough to recovery), while TF strongly outperforms RS outside drawdowns (<strong>24.5% vs. 16.9% CAGR<\/strong>) <em>(Tables III–V, pp. 12–15)<\/em>. <code>TFRS<\/code> achieves the lowest tracking error (<strong>2.7%<\/strong>) to a hypothetical perfect-foresight switcher <em>(Table VIII, p. 21)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> Two major caveats apply before desk adoption: (1) <strong>Commercial conflict &amp; non-transparent RS signal<\/strong>—the author is CIO of Relative Sentiment Technologies, LLC, and the exact formulas/ML models behind the three RS indicators (including paid Sentix data) are omitted from this paper; (2) <strong>Selection bias &amp; secular bond tailwind<\/strong>—the 10-month SMA was chosen <em>ex post<\/em> from 6 TF rules because it performed best on this sample <em>(p. 6)<\/em>, and parking out-of-equity cash in the U.S. Aggregate Bond Index enjoyed a 27-year falling-rate tailwind that broke down in 2022 <em>(Table XXI, p. 36)<\/em>.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> Long-only trend following guarantees full participation in sustained bull trends and prevents riding assets to zero, but suffers from two structural lags: staying 100% invested too long after peaks (giving back gains before crossing the moving average) and staying 0% invested too long after troughs (missing sharp V-shaped rebound rallies) <em>(pp. 2–5)<\/em>. Relative sentiment compares institutional (&quot;smart money&quot;) positioning/surveys against retail investors; because institutions enjoy superior information networks, capital, and narrative influence, RS tends to reduce equity weight <em>before<\/em> peaks (averaging 49.9% at peaks vs. TF&#x27;s 100%) and increase equity weight <em>at<\/em> troughs (57.9% at troughs vs. TF&#x27;s 11.1%) <em>(pp. 4, 16–18)<\/em>. Conversely, because RS is continuous rather than binary, it averages only 59.3% equity in calm uptrends, where TF&#x27;s 98.6% exposure compensates <em>(p. 13)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> Structurally, this is a classic <strong>momentum vs. contrarian/positioning-reversion<\/strong> pairing: TF is a <em>reactive<\/em> binary filter (convexity in prolonged trends, whipsaw/lag at turning points), whereas RS acts as a <em>mean-reverting / sentiment-contrarian<\/em> continuous allocator (better around turning points, chronic under-exposure in grinding bull markets). Even if one replaces proprietary Sentix/ML with public CFTC COT positioning + AAII/NAAIM retail-vs.-institutional spreads, the regime-complementarity mechanism (low correlation of <strong>0.45<\/strong> during peak-to-trough selloffs vs. <strong>0.93<\/strong> in calm bull markets) is economically plausible and directly testable.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>**Sample &amp; Assets <em>(pp. 5–7)<\/em>:** Nov 1994 – Sep 2022 (333 months; 9 U.S. equity drawdowns $\\ge 10\\%$ from ATH, with the Nov 2021 – Sep 2022 drawdown still ongoing at writing). Equity returns &amp; T-bills from Ken French&#x27;s daily data library; defensive sleeve (non-equity allocation) invested in Bloomberg Barclays U.S. Aggregate Bond Total Return Index.<\/li><li>**Trend Following (<code>TF<\/code>) Baseline <em>(pp. 6–7)<\/em>:<strong> 10-month SMA (selected from 6 tested rules: 200d SMA, 40w SMA, 10m SMA, 84/200d dual momentum, 17/40w dual momentum, 4/10m dual momentum). Binary 100% equities vs. 100% bonds. Signal evaluated on the <\/strong>second-to-last trading day<strong> of each month; executed at the <\/strong>close of the last trading day** of the month.<\/li><li>**Relative Sentiment (<code>RS<\/code>) Composite <em>(pp. 5–7)<\/em>:** Equal-weighted average of up to 3 continuous (0%–100% equity) indicators as data become available:<\/li><\/ul>\n<ol class=\"wiki-ol\"><li><em>Cross-asset RS<\/em> (starts Nov 1994): Composite of 5 non-equity COT positioning signals (crude oil, natural gas, GBP, EUR, 2-year Treasury) per Micaletti (2018).<\/li><li><em>Positions-based RS<\/em> (starts Nov 1998): TAA COT strategy per Micaletti (2018), adjusted for secular equity-bond correlation shifts per Micaletti (2022d).<\/li><li><em>Sentix-based RS with ML<\/em> (starts Sep 2002): Institutional vs. retail Sentix monthly survey with machine learning per Micaletti (2019, 2022b,c).<\/li><\/ol>\n<ul class=\"wiki-ul\"><li class=\"sub-li\">Refreshed weekly (COT lagged 1 week; Sentix lagged $\\ge 2$ weeks), executed at week-end close <strong>only if desired equity weight deviates by $&gt; 10$ percentage points<\/strong> from current weight <em>(pp. 6–7)<\/em>.<\/li><li>**Blend (<code>TFRS<\/code>) &amp; Costs <em>(p. 7)<\/em>:<strong> Static 50% <code>TF<\/code> + 50% <code>RS<\/code>. Slippage: <\/strong>4 bps** adverse slippage on entry and exit for both equities and bonds.<\/li><li><strong>Unresolved extraction details:<\/strong> Exact COT commercial/non-commercial formulas, cross-asset aggregation weights, ML model architecture/training windows for Sentix RS, and secular correlation adjustment rules are cited to external blog posts/papers rather than written out in this PDF.<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>Full-Period Performance<\/td><td><strong>RS:<\/strong> 12.3% CAGR, 10.6% Vol, <strong>0.95<\/strong> Sharpe, -18.7% MaxDD, Kurt 6.75&lt;br&gt;<strong>TF:<\/strong> 11.4% CAGR, 13.0% Vol, <strong>0.73<\/strong> Sharpe, -24.5% MaxDD, Kurt 6.72&lt;br&gt;<strong>TFRS:<\/strong> 12.0% CAGR, 10.9% Vol, <strong>0.90<\/strong> Sharpe, -21.0% MaxDD, Kurt <strong>5.71<\/strong>&lt;br&gt;<strong>MKT:<\/strong> 9.8% CAGR, 19.2% Vol, <strong>0.47<\/strong> Sharpe, -54.7% MaxDD, Kurt 9.18<\/td><td>Nov 1994 – Sep 2022 (333 mos); RS–TF corr = <strong>0.69<\/strong><\/td><td>Table I, p. 9<\/td><\/tr><tr><td>Peak-to-Trough (23.2% of time)<\/td><td>RS -13.0% (-59.4% DD) vs. TF -15.3% (-66.2% DD) vs. TFRS -14.0% (-62.3% DD) vs. MKT -37.9% (-95.4% DD)<\/td><td>9 drawdowns $\\ge 10\\%$; RS–TF corr drops to <strong>0.45<\/strong><\/td><td>Table II, p. 11<\/td><\/tr><tr><td>Trough-to-Recovery (31.3% of time)<\/td><td>RS <strong>27.9%<\/strong> (Sharpe 2.03, +856% cum.) vs. TF <strong>16.2%<\/strong> (Sharpe 1.12, +371% cum.) vs. TFRS <strong>22.1%<\/strong> (Sharpe 1.71)<\/td><td>8 completed recoveries; RS = 2.3× TF cumulative return<\/td><td>Sec. II.C &amp; Table III, pp. 10, 12<\/td><\/tr><tr><td>Peak-to-Recovery Combined (51.4% of time)<\/td><td>RS <strong>10.6%<\/strong> (Sharpe 0.74, -18.7% DD) vs. TF <strong>3.6%<\/strong> (Sharpe 0.19, -36.0% DD) vs. TFRS <strong>7.2%<\/strong> (Sharpe 0.51, -19.0% DD)<\/td><td>RS = 2.6× TF cumulative return (421% vs. 165%)<\/td><td>Sec. II.D &amp; Table IV, pp. 13–14<\/td><\/tr><tr><td>Outside Peak-to-Recovery (45.5% of time)<\/td><td>TF <strong>24.5%<\/strong> (Sharpe 1.59, 98.6% eq) vs. RS <strong>16.9%<\/strong> (Sharpe 1.58, 59.3% eq) vs. <strong>TFRS 20.8% (Sharpe 1.62)<\/strong><\/td><td>Calm uptrends; TF = 2.2× RS; TFRS has highest Sharpe<\/td><td>Sec. II.E &amp; Table V, pp. 13, 15<\/td><\/tr><tr><td>Equity Allocation Trajectory<\/td><td>Peak: TF <strong>100.0%<\/strong> vs. RS <strong>49.9%<\/strong>&lt;br&gt;Trough: TF <strong>11.1%<\/strong> vs. RS <strong>57.9%<\/strong>&lt;br&gt;+6w Post-Trough: TF <strong>25.0%<\/strong> vs. RS <strong>66.9%<\/strong>&lt;br&gt;+8w Post-Trough: TF <strong>50.0%<\/strong> vs. RS <strong>68.3%<\/strong><\/td><td>Average across 9 (peak-to-trough) / 8 (post-trough) drawdowns<\/td><td>Sec. II.F &amp; Tables VI–VII, pp. 16–18<\/td><\/tr><tr><td>Peak-to-TF-Exit &amp; Trough-to-TF-Reentry (5.5% time each)<\/td><td>Peak→Exit: RS -25.6% vs. TF -46.9%&lt;br&gt;Trough→Reentry: RS <strong>+77.4%<\/strong> (Sharpe 3.64) vs. TF <strong>+10.1%<\/strong> (0% eq) vs. TFRS <strong>+40.3%<\/strong> (Sharpe <strong>4.09<\/strong>)<\/td><td>Exact lag windows of TF<\/td><td>Tables IX–X, pp. 24–25<\/td><\/tr><tr><td>Perfect-Foresight Tracking Error (Regret)<\/td><td><strong>TFRS TE 2.7%<\/strong> (worst 12m: -16.1%) vs. RS TE 3.8% (-18.3%) vs. TF TE 5.3% (-24.2%); TF wins 206/333 mos (61.9%)<\/td><td>Monthly max(RS, TF) hypothetical switcher<\/td><td>Sec. II.G &amp; Table VIII, pp. 20–21<\/td><\/tr><tr><td>2021–2022 Inflation Drawdown<\/td><td>RS -11.9% (-13.7% DD), TF -25.2% (-22.1% DD), TFRS -18.8% (-17.9% DD), MKT -20.6% (-25.2% DD)<\/td><td>Nov 16, 2021 – Sep 13, 2022 (stocks &amp; bonds fell together)<\/td><td>Table XXI, p. 36<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Goal is baseline complementarity illustration, not finding the optimal TF or RS implementation; non-equity bond sleeve is not actively timed <em>(p. 6)<\/em>.<\/li><li>Perfect-foresight tracking-error benefit relies on TF and RS continuing to alternate leadership in future regimes <em>(pp. 20, 23)<\/em>.<\/li><li>The 2021–2022 drawdown had not yet completed as of Sep 2022 <em>(p. 7 fn. 2)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li><strong>Commercial Conflict &amp; Non-Reproducible Black Box:<\/strong> The author manages products based on Relative Sentiment (<code>Relative Sentiment Technologies, LLC<\/code>). Because the exact COT transformations, ML pipeline, and proprietary Sentix inputs are absent from this paper, the RS backtest cannot be independently audited for look-ahead or overfitting from this document alone.<\/li><li><strong>In-Sample Selection &amp; Progressive Indicator Phase-In:<\/strong> The 10-month SMA was chosen specifically because it beat 5 other TF rules over the test sample <em>(p. 6)<\/em>; similarly, adding a &quot;secular equity-bond correlation adjustment&quot; <em>(Micaletti 2022d)<\/em> to the 1998–2022 backtest risks hindsight bias.<\/li><li><strong>Secular Bond-Sleeve Tailwind (1994–2021):<\/strong> Parking flat-equity capital in the U.S. Aggregate Bond Index generated strong positive carry and crisis alpha during 1994–2021, which reversed sharply in 2022 (when TF lost -25.2% vs. MKT -20.6%, <em>Table XXI<\/em>). Testing a T-bill (<code>SHY<\/code>/<code>BIL<\/code>) defensive sleeve is essential to isolate pure equity-timing skill from bond duration beta.<\/li><li><strong>No Turnover / Tax Disclosure:<\/strong> Weekly RS rebalancing (even with a 10 pp deadband) incurs higher turnover than monthly 10-month SMA; annual turnover figures are not reported.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> Combining a slow binary equity trend filter (10-month SMA) 50/50 with a <strong>public, transparent institutional-vs.-retail positioning proxy<\/strong> (CFTC COT non-commercial/leveraged-funds vs. small-speculator net positioning z-score, plus optional NAAIM vs. AAII survey spread) reduces peak-to-recovery drawdown drag and trough-reentry lag compared to standalone TF, without materially sacrificing full-period Sharpe—<strong>tested with T-bills (<code>BIL<\/code>/<code>SHY<\/code>) as the defensive sleeve<\/strong> to strip out secular bond-duration luck.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> <code>SPY<\/code> (or <code>VTI<\/code>) for equities; <code>SHY<\/code> / 3-month T-bills (primary clean baseline) and <code>AGG<\/code> (secondary replication comparator) for the defensive sleeve. Public weekly CFTC Commitments of Traders (COT) reports (E-mini S&amp;P 500 + cross-asset crude/gold/FX/2Y Treasury) released Fridays (as-of Tuesday) + public weekly AAII Retail Sentiment &amp; NAAIM Institutional Exposure Index.<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> For TF: compute 10-month SMA on month-end close $t$, execute at $t+1$ close. For public RS proxy: use Friday-released CFTC COT / Thursday AAII-NAAIM data, execute at <strong>next Monday close<\/strong> (strictly causal, zero release-lag leakage), with a 10 percentage-point rebalance deadband.<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Long-only 0%–100% equity, remainder in <code>SHY<\/code> or <code>AGG<\/code>; 5 bps one-way transaction cost (<code>SPY<\/code>/<code>AGG<\/code>/<code>SHY<\/code>).<\/li><li><strong>Deviations from paper:<\/strong> Replaces proprietary Sentix + ML and undisclosed Micaletti (2018) formulas with transparent, public CFTC COT + NAAIM/AAII percentile ranks; evaluates both <code>SHY<\/code> (rate-neutral) and <code>AGG<\/code> defensive sleeves; extends OOS cleanly through 2022–2026.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Question and null:<\/strong> Does a 50/50 blend of 10-month SMA TF and a transparent public COT/NAAIM-AAII relative sentiment proxy outperform standalone 10-month SMA TF during peak-to-recovery drawdowns ($\\ge 10\\%$) and deliver equal or higher full-period net Sharpe with lower kurtosis over 2006–2026? ($H_0: \\text{Sharpe}_{\\text{TFRS}} \\le \\text{Sharpe}_{\\text{TF}}$ and $\\text{CAGR}_{\\text{TFRS, P2R}} \\le \\text{CAGR}_{\\text{TF, P2R}}$).<\/li><li><strong>Market-data proxy and sample:<\/strong> Daily <code>SPY<\/code>, <code>AGG<\/code>, <code>SHY<\/code> total returns + weekly public CFTC COT (S&amp;P 500 + 2Y/Oil/FX) and NAAIM/AAII, 2006–2026 (strict chronological OOS evaluation; 2022–2026 held out as true post-paper OOS).<\/li><li><strong>Signal and parameter specification:<\/strong> Public RS equity weight $w_{\\text{RS},t} = \\text{clip}(0.5 + 0.5 \\cdot \\tanh(z_{\\text{inst}-\\text{retail},t}/2),\\, 0,\\, 1)$ using expanding/rolling 3-year percentile/z-score of institutional minus retail positioning; 10 pp rebalance deadband. <code>TFRS<\/code> = $0.5 w_{\\text{TF}} + 0.5 w_{\\text{RS}}$.<\/li><li><strong>Benchmark and position rule:<\/strong> Compare <code>TFRS<\/code>, <code>TF<\/code>, <code>RS<\/code>, and <code>SPY<\/code> Buy-and-Hold under both <code>SHY<\/code> and <code>AGG<\/code> defensive sleeves.<\/li><li><strong>OOS / look-ahead controls / execution:<\/strong> Strictly respect CFTC Friday 3:30 PM ET release lag (trade Monday); no full-sample z-score normalization; freeze all hyperparameters prior to 2022–2026 holdout.<\/li><li><strong>Costs and primary metrics:<\/strong> Net CAGR, Sharpe (excess of T-bills), MaxDD, excess kurtosis, peak-to-recovery CAGR, trough-to-recovery CAGR, annual turnover, and perfect-foresight tracking error.<\/li><li><strong>Robustness and predeclared continuation/failure criteria:<\/strong><\/li><li class=\"sub-li\"><em>Continue:<\/em> Public <code>TFRS<\/code> beats standalone <code>TF<\/code> in peak-to-recovery CAGR by $\\ge +2.0\\%$/yr, reduces excess kurtosis, and holds positive Sharpe edge in 2022–2026 post-paper OOS under the <code>SHY<\/code> sleeve.<\/li><li class=\"sub-li\"><em>Stop / Kill:<\/em> If public COT/NAAIM-AAII shows no turning-point advantage over 10m SMA (indicating the paper&#x27;s edge relied on proprietary Sentix/ML or in-sample fitting), or if performance collapses once <code>AGG<\/code> is replaced by <code>SHY<\/code>.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Not pursued<\/strong> — exact replication is blocked by undisclosed formulas for the three proprietary RS indicators and paid Sentix institutional/retail survey data.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Evidence:<\/strong> Directly extends Faber (2007) 10-month SMA tactical asset allocation and Edelen, Marcus &amp; Tehranian (2010) / Schmeling (2007) institutional-vs.-retail sentiment literature <em>(pp. 2, 4, 37–38)<\/em>.<\/li><li><strong>Proposal:<\/strong> Directly cross-referenced in <code>Forecast-to-Fill_Paper_Wiki__L0-L7_.md<\/code> (Singha et al., 2025) and complementary to <strong>Clenow (2023)<\/strong> (<em>Following the Trend<\/em>) and <strong>Ilmanen et al. (2021)<\/strong> (<em>Tail Risk Hedging: Contrasting Put and Trend Strategies<\/em>)—testing whether a sentiment/positioning overlay mitigates CTA trend-following&#x27;s well-known post-trough re-entry lag.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source-backed claim (<code>author_reported<\/code>):<\/strong> Combining 10-month SMA trend following 50/50 with a 3-indicator Relative Sentiment composite (Nov 1994 – Sep 2022) achieves 12.0% CAGR, 0.90 Sharpe, thinner tails (kurtosis 5.71 vs. 6.72/6.75), and the lowest perfect-foresight tracking error (2.7%) by pairing RS&#x27;s drawdown/trough advantage with TF&#x27;s uptrend participation <em>(Tables I–V, VIII, pp. 9–21)<\/em>.<\/li><li><strong>Proposed falsifiable next test (<code>proposed_test<\/code>):<\/strong> Build a transparent, rate-neutral (<code>SHY<\/code> sleeve) public CFTC COT + NAAIM/AAII RS proxy paired 50/50 with 10-month SMA on <code>SPY<\/code> and test strictly out-of-sample on 2022–2026.<\/li><li><strong>Verdict and decision owner:<\/strong> <strong>Pending review<\/strong> — <strong>High conceptual value for trend-overlay design, but RS signal must be rebuilt from transparent public positioning data<\/strong> before trusting reported Sharpe/CAGR due to commercial conflict, black-box Sentix/ML inputs, and 1994–2021 bond tailwind.<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence<\/th><th>Reviewer/date<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>pass<\/td><td>Tagged by trend following, relative sentiment, COT, Sentix, drawdown partitioning, 50/50 blending.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>pass<\/td><td>L0–L4 capture full regime decomposition (Tables I–XXI), allocation trajectory, and key conflict/bond-regime caveats.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Public COT/NAAIM-AAII reduced-form MVP specified, though exact original RS/Sentix-ML formulas are proprietary/undisclosed.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>pass<\/td><td>All 38 pages read in full; every table statistic, allocation percentage, and drawdown partition verified with exact page/table locators.<\/td><td>AI Draft / 2026-11-26<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source Drive ID / version:<\/strong> <code>1qcdEjcFNdAx9NQbWdPOjE0Lon5t59INH<\/code> — <a href=\"https://drive.google.com/file/d/1qcdEjcFNdAx9NQbWdPOjE0Lon5t59INH/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Micaletti (2022) - The Complementarity of Trend Following and Relative Sentiment.pdf<\/a> (<code>SSRN:4235609<\/code>, Sep 2022, archived in <code>03_Raw<\/code>)<\/li><li><strong>Schema version:<\/strong> 0.1.1<\/li><li><strong>Changes / reviewer:<\/strong> v0.1 initial full-text L0–L7 draft created 2026-11-26; pending human review.<\/li><\/ul>"}], "searchText": "the complementarity of trend following and relative sentiment raymond c. micaletti trend following & momentum relative sentiment tactical asset allocation drawdown mitigation behavioral finance 10-month sma cot positioning sentix survey regime partitioning # the complementarity of trend following and relative sentiment ## l0 — research in one minute **question:** even though long-only equity trend following (tf) and institutional-vs.-retail relative sentiment (rs) have a moderately high unconditional return correlation (0.69), do they complement each other across market drawdowns and strong uptrends so that a 50/50 blend (`tfrs`) improves tail behavior and investor regret? *(pp. 1, 5, 8)* **author-reported claim and findings (`author_reported`):** yes. across nov 1994 – sep 2022 (333 months; 9 u.s. equity drawdowns $\\ge 10\\%$), a 50/50 blend (`tfrs`) of 10-month sma trend following and a 3-indicator relative sentiment composite delivers **12.0% cagr** and **0.90 sharpe** (vs. **11.4% / 0.73** for tf, **12.3% / 0.95** for rs, and **9.8% / 0.47** for the market) with **thinner return tails** (excess kurtosis **5.71** vs. 6.72 for tf and 6.75 for rs) *(table i, p. 9)*. rs strongly outperforms tf during peak-to-recovery drawdowns (**10.6% vs. 3.6% cagr**, especially **27.9% vs. 16.2%** from trough to recovery), while tf strongly outperforms rs outside drawdowns (**24.5% vs. 16.9% cagr**) *(tables iii–v, pp. 12–15)*. `tfrs` achieves the lowest tracking error (**2.7%**) to a hypothetical perfect-foresight switcher *(table viii, p. 21)*. **caveat (`analyst_inference`):** two major caveats apply before desk adoption: (1) **commercial conflict & non-transparent rs signal**—the author is cio of relative sentiment technologies, llc, and the exact formulas/ml models behind the three rs indicators (including paid sentix data) are omitted from this paper; (2) **selection bias & secular bond tailwind**—the 10-month sma was chosen *ex post* from 6 tf rules because it performed best on this sample *(p. 6)*, and parking out-of-equity cash in the u.s. aggregate bond index enjoyed a 27-year falling-rate tailwind that broke down in 2022 *(table xxi, p. 36)*. ## l1 — economic intuition **author's explanation (`author_reported`):** long-only trend following guarantees full participation in sustained bull trends and prevents riding assets to zero, but suffers from two structural lags: staying 100% invested too long after peaks (giving back gains before crossing the moving average) and staying 0% invested too long after troughs (missing sharp v-shaped rebound rallies) *(pp. 2–5)*. relative sentiment compares institutional (\"smart money\") positioning/surveys against retail investors; because institutions enjoy superior informat", "sortRank": 1}, {"id": "beutel-etal-2022", "filename": "Beutel_etal_2022_v0.1.1.md", "title": "The Global Financial Cycle and Macroeconomic Tail Risks", "authors": "Beutel, Metiu, Emter, Prieto & Schüler", "year": "2022", "pubDate": "2022", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Macro tail forecasting"], "rawUrl": "https://drive.google.com/file/d/1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX/view", "rawId": "1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Beutel, Metiu, Emter, Prieto &amp; Schüler <strong>Date/version:<\/strong> 2022; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Macro tail forecasting <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does lagged U.S. financial tightening forecast lower-tail foreign GDP growth more than median growth?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Left tail shifts more than median; fixed FX rates, FX exposures and private leverage worsen sensitivity (Abstract; Non-technical summary).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> U.S. financial tightening disproportionately worsens global downside growth outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Quantile VAR assesses growth-at-risk impacts from shocks to U.S. financial conditions and policy.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Left tail shifts more than median; fixed FX rates, FX exposures and private leverage worsen sensitivity (Abstract; Non-technical summary).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does lagged U.S. financial tightening forecast lower-tail foreign GDP growth more than median growth?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> U.S. financial tightening disproportionately worsens global downside growth outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Estimate expanding-window country quarterly 10% and 50% quantile regressions on lagged U.S. financial-conditions proxies; evaluate next-quarter quantile loss with publication-lag controls.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does lagged U.S. financial tightening forecast lower-tail foreign GDP growth more than median growth?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Estimate expanding-window country quarterly 10% and 50% quantile regressions on lagged U.S. financial-conditions proxies; evaluate next-quarter quantile loss with publication-lag controls.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Left tail shifts more than median; fixed FX rates, FX exposures and private leverage worsen sensitivity (Abstract; Non-technical summary).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "the global financial cycle and macroeconomic tail risks beutel, metiu, emter, prieto & schüler tail risk macro tail forecasting # the global financial cycle and macroeconomic tail risks **authors:** beutel, metiu, emter, prieto & schüler **date/version:** 2022; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1l2tppxlw2nhxusrx7uxkhfuineezo1jx/view) **track:** macro tail forecasting **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does lagged u.s. financial tightening forecast lower-tail foreign gdp growth more than median growth? **author-reported headline:** left tail shifts more than median; fixed fx rates, fx exposures and private leverage worsen sensitivity (abstract; non-technical summary). **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** u.s. financial tightening disproportionately worsens global downside growth outcomes. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** quantile var assesses growth-at-risk impacts from shocks to u.s. financial conditions and policy. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | left tail shifts more than median; fixed fx rates, fx exposures and private leverage worsen sensitivity (abstract; non-technical summary). | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the orig", "sortRank": 1}, {"id": "strub-trade-sizing-tail-risk-control", "filename": "Strub_Trade_Sizing_Tail_Risk_Control_v0.1.1.md", "title": "Trade Sizing Techniques for Drawdown and Tail Risk Control", "authors": "{}", "year": "unknown", "pubDate": "unknown", "version": "0.1.1", "primaryTopic": "Portfolio Construction & Tail Risk Control", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1DrQe-o2OoCj_BbI5vmcjuMBg7Ey--0nj/view", "rawId": "1DrQe-o2OoCj_BbI5vmcjuMBg7Ey--0nj", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1DrQe-o2OoCj_BbI5vmcjuMBg7Ey--0nj/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">The paper offers three risk-based trade-sizing approaches: historical volatility target, EVT-estimated conditional value at risk (CVaR), and EVT-estimated conditional drawdown at risk (CDaR). Historical examples include FX, the U.S. 10-year Treasury future and G10-currency basket strategies, with a roughly ten-year daily evaluation. Practical question: is tail-risk-aware sizing more useful than conventional volatility targeting?<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">Equal volatility need not imply equal exposure to catastrophic losses. Sizing on estimated loss tails or a drawdown distribution may reduce leverage ahead of riskier states, though sparse extremes make the forecasts noisy and can produce procyclical forced de-risking.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">The paper introduces a standard volatility-based scheme and EVT-based estimators for CVaR and CDaR, fitting Generalized Pareto tails to standardized returns. For CDaR it constructs a rolling drawdown distribution; it gives a 63-day-block example with a 95% drawdown-at-risk threshold and conditional tail mean. See Sections 2–4 and the CVaR / drawdown definitions. Exact risk target, filter specification and optimized windows require focused verification.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Abstract: three sizing algorithms and applications to approximately 10 years of daily strategy returns across named FX/Treasury instruments.<\/li><li>Paper formally distinguishes distribution of single-period losses (CVaR) from distribution of drawdowns (CDaR).<\/li><li>Precise relative performance statistics are <strong>pending exhibit verification<\/strong>; do not fabricate a winning method.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Directly relevant to asset-allocation overlays. EVT tail parameters are unstable with limited exceedances; overlapping drawdown blocks are dependent. Volatility shocks trigger deleveraging after rather than before losses. Compare equal ex-ante risk budgets, cap leverage, and account for turnover and funding.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> At equal typical volatility, strategies with fatter recent loss tails may benefit from smaller positions; a tail-risk scaler should improve realized tail loss more than a pure-vol scaler.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Apply overlay weights to an existing daily strategy return series. Estimate rolling 63-day volatility, 252-day historical 5% expected shortfall, and a 252-day 63-day drawdown statistic as reduced-form, <em>not exact EVT<\/em>, candidates. Set fixed target risk and maximum gross exposure 1.0 or 1.5, with cash earning a stated rate. Weights computed at close t apply no earlier than next feasible execution; costs on weight changes.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: historical-ES and drawdown-based risk scalers do not improve OOS max drawdown/ES over rolling vol targeting under matched average exposure. Freeze 63/252 windows, 5% tail cutoff, gross cap 1.0, one-way 5/10 bps costs. Use monthly rebalance and next-close execution, no look-ahead. Compare same raw strategy: unscaled, 10% vol target, 5% ES target and 63-day drawdown-risk target; equalize average gross or long-run volatility only on training data, not using future full-sample stats. Report CAGR, CVaR, MaxDD, realized exposure, turnover and crisis losses. Continue if robust OOS downside advantage survives cost and lookback sensitivity; stop proxy if extreme-estimate noise dominates. Then consider GPD/EVT as complexity step.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Exact paper replication of filtered EVT residuals and GPD extrapolation optional, after reduced-form benefit is evident.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> The paper offers three risk-based trade-sizing approaches: historical volatility target, EVT-estimated conditional value at risk (CVaR), and EVT-estimated conditional drawdown at risk (CDaR).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Metadata/tags exist; search-index retrieval not yet tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Core question and findings present; human reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form protocol proposed; second-analyst specification review pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source sections indicated; exhibit/page image confirmation pendi  and the cvar / drawdown definitions. exact risk target, filter specification and optimized windows require focused verification. ## l3 — empirical findings **author-reported; not independently verified:** - abstract: three sizing algorithms and applications to approximately 10 years of daily strategy returns across named fx/treasury instruments. - paper formally distinguishes distribution of single-period losses (cvar) from distribution of drawdowns (cdar). - precise relative performance statistics are **pending exhibit verification**; do not fabricate a winning method. ## l4 — research evaluation directly relevant to asset-allocation overlays. evt tail parameters are unstable with limited exceedances; overlapping drawdown blocks are dependent. volatility shocks trigger deleveraging after rather than before losses. compare equal ex-ante risk budgets, cap leverage, and account for turnover and funding. ## l5 — practical research lab ### l5.a — core mechanism **falsifiable analyst hypothesis:** at equal typical volatility, strategies with fatter recent loss tails may benefit from smaller ", "sortRank": 1}, {"id": "luo-2011", "filename": "Luo_2011_v0.1.1.md", "title": "VIX Futures and the Hedging of Bond Portfolios", "authors": "Frank Luo", "year": "2011", "pubDate": "2011", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Hedging / credit"], "rawUrl": "https://drive.google.com/file/d/1FT6NoPqna5vdC4UAHzX4hU7YSHk0f6R4/view", "rawId": "1FT6NoPqna5vdC4UAHzX4hU7YSHk0f6R4", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Frank Luo <strong>Date/version:<\/strong> 2011; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1FT6NoPqna5vdC4UAHzX4hU7YSHk0f6R4/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Hedging / credit <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Is VIX-futures exposure more useful against credit drawdowns than safe-government-bond drawdowns?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Strongest hedging case for EM bond losses; reported protection on 21 of 25 worst EM bond days; limited treasury/muni diversification (Executive summary).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> VIX futures are not equally useful for every bond sector.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Analyzes S&amp;P 500 VIX futures index strategies across government, municipal, investment-grade, HY and EM bonds.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Strongest hedging case for EM bond losses; reported protection on 21 of 25 worst EM bond days; limited treasury/muni diversification (Executive summary).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Is VIX-futures exposure more useful against credit drawdowns than safe-government-bond drawdowns?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> VIX futures are not equally useful for every bond sector.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Overlay fixed 5% VIX-futures total-return allocation on TLT, LQD, HYG and EMB; compare conditional worst-5%-day payoff, carry and whole-portfolio drawdowns.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Is VIX-futures exposure more useful against credit drawdowns than safe-government-bond drawdowns?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Overlay fixed 5% VIX-futures total-return allocation on TLT, LQD, HYG and EMB; compare conditional worst-5%-day payoff, carry and whole-portfolio drawdowns.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Strongest hedging case for EM bond losses; reported protection on 21 of 25 worst EM bond days; limited treasury/muni diversification (Executive summary).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "is
