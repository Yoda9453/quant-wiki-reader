 n^3 + 16\\sigma^2(\\mu - nk)}}{4\\sigma^2}$ for $\\mu &gt; nk$.<\/li><li class=\"sub-li\">Fractional Kelly $\\tilde{f} = \\lambda_{\\text{Kelly}} f^\\star$ with $\\lambda_{\\text{Kelly}} = 0.40$; final weight $w_t = \\tilde{f} \\cdot w_t^{(\\text{conf})}$ (capped at $W_{\\max}$), with a $0.25 \\cdot w_t^{(\\text{vol})}$ floor when $\\tilde{f} \\approx 0$.<\/li><li><strong>Unresolved extraction details:<\/strong> Exact numerical values of $\\lambda$ (EMA decay), $\\theta$ (EWMA decay), exact rule distinguishing &quot;halve&quot; vs. &quot;close&quot; on $p_{\\text{bear}} &gt; 0.50$, and how overlapping monthly-stepped 6-month OOS slices are stitched into a single 2,793-day return series are <strong>Not reported<\/strong>.<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>Net OOS Sharpe (FAST)<\/td><td>2.88 (95% block-bootstrap CI: $[2.49, 3.27]$)<\/td><td>2015–2025 (2,793 days), net of 0.7 bps + $\\gamma=0.02$<\/td><td>Sec. 8.1, p. 13<\/td><\/tr><tr><td>Realized Annual Return / CAGR<\/td><td>2.62% ann. ret / 2.65% CAGR<\/td><td>Realized vol 0.91%; MaxDD 0.52%; Calmar 5.11<\/td><td>Sec. 8.1, p. 13<\/td><\/tr><tr><td>Active-Day Expectancy<\/td><td>Hit rate 65.81%; $+6.00$ bps avg win / $-4.01$ bps avg loss<\/td><td>1,132 active days ($\\<\/td><td>w_t\\<\/td><td>&gt; 10^{-3}$); payoff ratio $1.49\\times$<\/td><td>Sec. 8.3, p. 14<\/td><\/tr><tr><td>Return Distribution<\/td><td>Skewness 3.90; Kurtosis 41.34<\/td><td>Worst month $-0.20\\%$; daily $\\text{VaR}_{95}$ 0.04%; $\\text{CVaR}_{95}$ 0.09%<\/td><td>Sec. 8.2, p. 14; Sec. 13.4, p. 22<\/td><\/tr><tr><td>CAPM Regression vs. Gold<\/td><td>Ann. $\\alpha = 2.25\\%$ ($t=9.53$); $\\beta = 0.03$ ($t=31.01$); $R^2=0.001$<\/td><td>$\\text{IR} = 2.09$; Newey-West HAC SEs<\/td><td>Sec. 9.1–9.3, pp. 15–16; p. 27<\/td><\/tr><tr><td>Implied 15% Vol-Scaled Performance<\/td><td>43.2% ann. return; 37.1% IR-alpha (42.2% CAPM alpha in Fig. 3)<\/td><td>Linear scaling $c = 15/0.91 \\approx 16.5\\times$<\/td><td>Sec. 10, pp. 17–18<\/td><\/tr><tr><td>Sub-Period Stability<\/td><td>Sharpe: 2.88 (2015–25), 2.93 (2019+), 2.91 (2022+)<\/td><td>MaxDD 0.47%–0.52% across all sub-periods<\/td><td>Table 1, p. 19<\/td><\/tr><tr><td>Latency Stress<\/td><td>Sharpe: 2.88 ($T+0$), 2.28 ($T+1$), 2.24 ($T+2$)<\/td><td>Full OOS sample<\/td><td>Table 4, p. 21<\/td><\/tr><tr><td>Signal Reversal &amp; SPA Test<\/td><td>Reversed $\\text{Sharpe} = -2.95$; SPA $p = 0.000$<\/td><td>64 grid configs, 800 stationary block bootstraps ($l=20$)<\/td><td>Sec. 13.2–13.3, pp. 21–22<\/td><\/tr><tr><td>Cost / Impact Stress <em>(conflicting)<\/em><\/td><td>Table 3: Sharpe 1.91 ($0.5\\times$), 0.94 ($1.0\\times$), $-0.03$ ($1.5\\times$), $-1.00$ ($2.0\\times$)<\/td><td>Text on p. 20 claims $&gt; 2.5$ at $1.0\\times$ and $\\approx 0$ at $2.0\\times$<\/td><td>Table 3 &amp; Sec. 12.1, p. 20<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Static friction parameters ($k=0.7$ bps, $\\gamma=0.02$) do not adapt to spread widening or liquidity stress <em>(p. 24)<\/em>.<\/li><li>Single-asset scope (gold only; long-only) <em>(pp. 11, 25)<\/em>.<\/li><li>Simple 20-day EWMA volatility forecast rather than HAR-RV or GARCH <em>(p. 25)<\/em>.<\/li><li>No modeling of micro-latency, partial fills, or overnight funding; no live paper-trading validation <em>(p. 25)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li><strong>Severe $T+0$ vs. $T+1$ &amp; Look-Ahead Red Flag:<\/strong> Table 4 shows $T+0$ $\\text{Sharpe} = 2.88$ dropping to $2.28$ at $T+1$ ($-0.60$ Sharpe in a single day). Meanwhile, p. 27 claims $T+1$ is the baseline. A 0.60 Sharpe cliff on a 50-day trend/EMA signal is a classic signature of same-bar execution leakage (e.g., computing EMA/ATR/stops using day-$t$ close and filling at day-$t$ close).<\/li><li><strong>Table 3 vs. Text Contradiction &amp; Truncated Copy:<\/strong> Table 3 shows baseline ($1.0\\times$) Sharpe of <strong>0.937<\/strong> and $1.5\\times$ cost turning negative (<strong>$-0.033$<\/strong>), directly contradicting both the headline 2.88 Sharpe and the prose immediately beneath Table 3. Page 21 also ends mid-word (<code>region of linear co<\/code>), and Appendix B references yearly tables that are missing.<\/li><li><strong>Capacity Arithmetic Error:<\/strong> Section 10 computes $A_{\\max} = L_{\\max} \\cdot \\text{ADV}_\\$ / |\\Delta w_t|$ using $L_{\\max} = 2.9 \\times 10^{-6}$, $\\text{ADV}_\\$ = \\$50\\text{B}$, $|\\Delta w_t| = 0.066$, which equals <strong>$\\approx \\$2.2\\text{M}$<\/strong>, not $7.6 \\times 10^8$ ($\\$760\\text{M}$).<\/li><li><strong>Misleading 15% Vol Scaling (&quot;43% CAGR&quot;):<\/strong> Because realized vol is 0.91% (mean $|w_t| = 0.0326$), scaling linearly by $16.5\\times$ to hit 15% vol implies breaching $W_{\\max} = 2.0$ during active trends and ignores nonlinear market-impact scaling.<\/li><li><strong>Overlapping OOS Stitching &amp; Long-Only Regime Bias:<\/strong> Stepping 6-month test windows monthly creates 5-month overlaps without specifying how weights are aggregated; additionally, 2015–2025 was a strong secular bull run for gold.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> A smoothed log-price EMA slope combined with a 50-day directional momentum filter, volatility-targeted and paired with ATR trailing/hard stops, generates positive risk-adjusted excess return (and positive skew) on gold futures <strong>strictly under $T+1$ execution<\/strong> (no same-day close fills). The proxy must preserve: (1) causal $T+1$ execution, (2) training-only z-score standardization, (3) blended slope + 50-day momentum gating, and (4) ATR stop/exit mechanics. We discard the overlapping monthly-stepped OOS stitching and the fragile friction-adjusted Kelly multiplier ($f^\\star \\approx 0.0029$) in the MVP to isolate whether the signal itself has edge.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> CME Gold continuous front-month futures (<code>GC<\/code>, back-adjusted total return) or liquid ETF proxy (<code>GLD<\/code> / <code>IAU<\/code>) for an initial sanity check.<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> Compute EMA slope, $z_t$, $m_t$, $p_{\\text{bull}}(t)$, and $\\text{ATR}_{14}(t)$ using close $t$; execute entries, sizing changes, and stop exits strictly at <strong>next-session open or close ($t+1$)<\/strong> (no intrabar close-of-signal-day fills).<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Long-only + cash (T-bill rate); cap leverage at $W_{\\max}=2.0$; charge 1.0–2.0 bps round-trip linear cost (GC futures) or 3–5 bps (GLD) plus sensitivity sweep up to 5 bps.<\/li><li><strong>Deviations from paper:<\/strong> Non-overlapping 6-month OOS slices; fixed $\\lambda$ (e.g., 20-day EMA equivalent, $\\lambda \\approx 0.905$) and 20-day EWMA vol ($\\theta = 0.94$) since exact values were omitted; unit volatility-targeted weight $w_t^{(\\text{conf})}$ tested first before adding fractional Kelly.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Question and null:<\/strong> Does the causal $T+1$ blended EMA-slope + 50-day momentum + ATR-stop rule outperform both zero excess return ($H_0: \\text{Sharpe}_{\\text{OOS}} \\le 0$) and a simple 50-day TSMOM baseline on gold futures net of costs?<\/li><li><strong>Market-data proxy and sample:<\/strong> Daily CME <code>GC<\/code> continuous futures (or <code>GLD<\/code> total return), 2005–2025 (first 10-year train: 2005–2014; strictly non-overlapping OOS: 2015–2025).<\/li><li><strong>Signal and parameter specification:<\/strong> $\\lambda = 0.905$ (20-day EMA), $K = 50$, $\\omega = 0.6$, entry $p_{\\text{bull}} \\ge 0.52$ and $\\Delta \\tilde{y}_t &gt; 0$; exits: $2\\times\\text{ATR}_{14}$ hard stop, $1.5\\times\\text{ATR}_{14}$ trailing stop, 30-day timeout, close if $p_{\\text{bear}} &gt; 0.50$.<\/li><li><strong>Benchmark and position rule:<\/strong> Compare against (a) buy-and-hold <code>GC<\/code>/<code>GLD<\/code> and (b) simple 50-day moving-average long-only vol-targeted trend.<\/li><li><strong>OOS / look-ahead controls / execution:<\/strong> Expanding or rolling 10-year training window for $(\\mu_{\\text{train}}, \\sigma_{\\text{train}})$; non-overlapping 6-month OOS evaluation; strictly $T+1$ execution (test both $T+1$ open and $T+1$ close).<\/li><li><strong>Costs and primary metrics:<\/strong> Net Sharpe, CAPM $\\alpha$ and $\\beta$ vs. gold, active-day hit rate and payoff ratio, MaxDD, turnover, and skew.<\/li><li><strong>Robustness and predeclared continuation/failure criteria:<\/strong><\/li><li class=\"sub-li\"><em>Continue:<\/em> $T+1$ net Sharpe $\\ge 0.70$, gold $\\beta &lt; 0.30$, and outperforms plain 50-day TSMOM net of 2 bps RT cost.<\/li><li class=\"sub-li\"><em>Stop / Kill:<\/em> If $T+1$ net Sharpe $&lt; 0.40$, or if edge disappears once $T+0$ same-bar fills are eliminated (confirming look-ahead artifact).<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Not pursued<\/strong> — exact replication is blocked by unreported $\\lambda$/$\\theta$ values, unspecified overlapping-window stitching, missing Appendix B tables, and internal contradictions in Table 3 and Section 10.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Related papers / projects:<\/strong><\/li><li class=\"sub-li\"><em>Evidence:<\/em> Directly comparable to <strong>Clenow (2023)<\/strong> (<em>Following the Trend<\/em>, already in <code>02_Wiki<\/code>) — both use EMA trend filtering, ATR risk normalization, and futures execution, though Clenow trades diversified multi-asset portfolios without Kelly scaling and emphasizes that single-market trend Sharpe is modest.<\/li><li class=\"sub-li\"><em>Proposal:<\/em> Cross-check against <strong>Micaletti<\/strong> (<em>The Complementarity of Trend Following and Relative Sentiment<\/em>, in <code>00_Inbox<\/code>) for whether a sentiment overlay improves late-entry/exit lag compared to ATR stops.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source-backed claim (<code>author_reported<\/code>):<\/strong> A transparent gold futures trend–momentum + vol-targeting + friction-adjusted Kelly + ATR-stop pipeline achieves OOS Sharpe 2.88 (2.28 at $T+1$) and near-zero gold beta over 2015–2025 <em>(pp. 13, 16, 21)<\/em>.<\/li><li><strong>Proposed falsifiable next test (<code>proposed_test<\/code>):<\/strong> Run the non-overlapping $T+1$ reduced-form MVP on <code>GC<\/code> / <code>GLD<\/code> (2015–2025) to test whether the reported Sharpe ~2.3–2.9 survives strict causal execution or collapses to standard single-market TSMOM (~0.5–0.8).<\/li><li><strong>Verdict and decision owner:<\/strong> <strong>Pending review<\/strong> — <strong>High skepticism / audit before trusting.<\/strong> Paper has notable red flags (Table 3 contradiction, capacity math error, $T+0$/$T+1$ cliff); worth a quick 1-hour Python sanity check on the ATR-stop + EMA-slope mechanism, not full replication.<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence<\/th><th>Reviewer/date<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>pass<\/td><td>Tagged by topic, universe (<code>GC<\/code>), methods (EMA, ATR, Kelly, SPA), and role (<code>alpha<\/code>).<\/td><td>AI Draft / 2026-11-24<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>pass<\/td><td>L0–L4 capture full pipeline, reported stats, and major analytical red flags without rereading PDF.<\/td><td>AI Draft / 2026-11-24<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>MVP specified cleanly, but paper omits exact $\\lambda$, $\\theta$, and OOS window-stitching rules.<\/td><td>AI Draft / 2026-11-24<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Page/table locators verified; source PDF itself has unresolved Table 3 and Sec. 10 contradictions.<\/td><td>AI Draft / 2026-11-24<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source Drive ID / version:<\/strong> <code>150LlbvcECZgsGBajzof2a7hYuCztW_N8<\/code> — <a href=\"https://drive.google.com/file/d/150LlbvcECZgsGBajzof2a7hYuCztW_N8/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Singha et al. (2025) - Forecast-to-Fill - Benchmark-Neutral Alpha and Billion-Dollar Capacity in Gold Futures (2015-2025).pdf<\/a> (<code>arXiv:2511.08571v1<\/code>, archived in <code>03_Raw<\/code>)<\/li><li><strong>Schema version:<\/strong> 0.1.1<\/li><li><strong>Changes / reviewer:<\/strong> v0.1 initial POC draft created 2026-11-24; pending human review.<\/li><\/ul>"}], "searchText": "forecast-to-fill: benchmark-neutral alpha and billion-dollar capacity in gold futures (2015-2025) mainak singha, jose aguilera-toste, vinayak lahiri trend following & momentum execution & capacity position sizing commodities / gold ema atr stops volatility targeting friction-adjusted kelly # forecast-to-fill: benchmark-neutral alpha and billion-dollar capacity in gold futures (2015–2025) ## l0 — research in one minute **question:** can a simple, interpretable trend–momentum signal in gold futures generate durable, benchmark-neutral, billion-dollar-scalable out-of-sample alpha once volatility targeting, transaction costs, square-root market impact, and atr exits are integrated end-to-end? *(pp. 1–2)* **author-reported claim and findings (`author_reported`):** across a rolling 10-year train / 6-month test walk-forward (2015–2025; 2,793 trading days), a long-only gold futures strategy achieves an out-of-sample sharpe of **2.88**, cagr of **2.65%** at **0.91%** realized volatility, maxdd of **0.52%**, and gold capm beta of **0.03** (annualized alpha **2.25%**, ir **2.09**), net of 0.7 bps round-trip cost and square-root impact ($\\gamma = 0.02$). scaling linearly to a 15% volatility target implies ~43% annualized return and ~37% alpha, with positive log-growth up to ~$0.8–1.0b aum. *(abstract, pp. 13–18)* **caveat (`analyst_inference`):** high skepticism is warranted before trusting headline numbers. the paper contains **material internal contradictions**: (1) $t+0$ vs. $t+1$ execution drops sharpe by 0.60 ($2.88 \\to 2.28$), raising same-bar look-ahead concerns; (2) table 3 reports $\\text{sharpe} = 0.937$ at $1.0\\times$ cost while the text directly below it claims $> 2.5$; (3) linear $16.5\\times$ scaling to 15% vol violates the strategy's own $w_{\\max}=2.0$ leverage cap; and (4) the capacity arithmetic in section 10 is off by ~2 orders of magnitude ($l_{\\max}\\cdot \\text{adv}/|\\delta w_t| \\approx \\$2.2\\text{m}$, not $\\$760\\text{m}$). ## l1 — economic intuition **author's explanation (`author_reported`):** gold is information-driven without cash flows or credit risk *(p. 2)*. institutional hedgers (producers, refiners, etf issuers) adjust positions gradually under funding or margin constraints, creating transient directional persistence *(pp. 2, 23)*. the strategy does not predict exact price levels; it harvests a state-dependent risk premium by selectively supplying liquidity in trending states, while volatility targeting, friction-aware kelly sizing, and atr stops shape returns into a positively skewed profile (capped downside, open-ended upside) *(pp. 22–24)*. **analyst inference (`analyst_inference`):** economically, time-series momentum in gold is well-documented (moskowitz et al., 2012), but a **65.8% daily hit rate with a $1.49\\times$ p", "sortRank": 0}, {"id": "bai_pukthuanthong_2026_ml_classification_loss", "filename": "Bai___Pukthuanthong__2026__Paper_Wiki__L0-L7_.md", "title": "Machine Learning Classification and Portfolio Construction: Does the Loss Function Matter?", "authors": "Yang Bai, Kuntara Pukthuanthong", "year": "2026", "pubDate": "2026-08-21", "version": "Financial Analysts Journal, Forthcoming (Aug 21, 2026; first draft May 31, 2020)", "primaryTopic": "Machine Learning & Cross-Sectional Alpha", "category": "ML & Portfolio", "isTopicWiki": false, "tags": ["Portfolio Construction", "Loss Functions", "Empirical Asset Pricing", "Cross-Entropy", "MSE", "GBT"], "rawUrl": "https://drive.google.com/file/d/1jNLDVrfRmoTST3UT4Ze-AW9eiX2wT6iA/view", "rawId": "1jNLDVrfRmoTST3UT4Ze-AW9eiX2wT6iA", "status": "carded", "reviewStatus": "pending_review", "qcPass": 3, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Holding data, features, and model architecture strictly constant, does training ML models as cross-sectional return-decile <strong>classifiers<\/strong> (cross-entropy loss) outperform standard <strong>regressors<\/strong> (mean squared error loss) for long-short portfolio construction? <em>(pp. 1–2)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Yes. Across 5 matched model pairs (GBT, RF, NN, Stacking Ensemble, and Linear/Logistic benchmarks) evaluated out-of-sample from July 1983 to December 2024 (498 months), classification outperforms regression in <strong>49 of 50<\/strong> paired Sharpe and factor-alpha comparisons <em>(pp. 8, 22)<\/em>. The value-weighted classification stacking ensemble achieves an annualized Sharpe of <strong>2.08<\/strong> (FF6F alpha <strong>4.1%/month<\/strong>) vs. <strong>1.39<\/strong> (FF6F alpha <strong>1.8%/month<\/strong>) for matched regression <em>(pp. 1, 8, 22)<\/em>. Even simple multinomial logistic regression (VW Sharpe <strong>1.57<\/strong>) beats the complex ML regression stacking ensemble (<strong>1.39<\/strong>) <em>(pp. 2, 10, 22)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> Classification loads noticeably heavier than regression on <strong>trading-friction characteristics<\/strong> (idiosyncratic volatility, bid-ask spread, return volatility, max daily return) <em>(Fig. 1, p. 19)<\/em>, and headline VW returns of 50.4%/yr (4.1%/mo FF6F alpha) still reflect CRSP all-stock deciles where micro/small-cap short legs and flat 30 bps + 50 bps/yr borrow assumptions can understate real-world institutional implementation drag.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> Long-short decile portfolio payoffs depend on <strong>which decile<\/strong> a stock lands in, not on predicting exact continuous return magnitudes. MSE regression spends model capacity fitting return levels <em>within<\/em> deciles (and gets pulled by noisy return outliers), leaving decision boundaries between deciles blurry. Categorical cross-entropy directly optimizes the probability distribution over return states (deciles) and is a strictly proper scoring rule <em>(pp. 2–4)<\/em>. Diagnostics confirm that regression&#x27;s confusion matrix for the 8 middle deciles sits near random chance (10.58%–11.37% vs. 10% baseline) <em>(p. 2)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> Cross-entropy on cross-sectional return deciles effectively acts as a built-in <strong>rank-order + outlier-robust objective<\/strong> (similar in spirit to Huber/rank losses) while preserving tail-probability calibration via &quot;soft&quot; probability ranking. However, because extreme deciles (D1 and D10) are naturally populated by high-volatility stocks, a classifier trained to predict $P(\\text{Decile } 10)$ or $P(\\text{Decile } 1)$ can implicitly learn to predict <strong>volatility / dispersion<\/strong> as much as directional drift—matching the authors&#x27; own Figure 1 observation that classification loads more heavily on IVOL and bid-ask spread.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li><strong>Data &amp; Sample:<\/strong> Monthly U.S. common stocks (CRSP share codes 10, 11, 12; exchange codes 1, 2, 3) + Compustat fundamentals, <strong>July 1962 – December 2024<\/strong>; OOS evaluation spans <strong>July 1983 – December 2024<\/strong> (498 months) <em>(pp. 3, 22)<\/em>.<\/li><li><strong>Features:<\/strong> 102 firm characteristics reconstructed per Green, Hand &amp; Zhang (2017) + 2-digit SIC industry dummies, cross-sectionally rank-normalized monthly to $[-1, 1]$ <em>(p. 3)<\/em>.<\/li><li><strong>Classification Objective (10-class baseline, plus 2-, 3-, 5-class tests):<\/strong> Categorical cross-entropy over realized monthly return deciles $D = \\{1, \\dots, 10\\}$: $$L_{\\text{cls}} = -\\sum_{i,t} \\sum_{d \\in D} y_{i,t}(d) \\ln q_{i,t}(d)$$ where $y_{i,t}(d) \\in \\{0,1\\}$ is the one-hot realized decile indicator and $q_{i,t}(d)$ is the predicted probability <em>(pp. 3–4, Eq. 1)<\/em>.<\/li><li><strong>Regression Objective (matched Gu, Kelly &amp; Xiu 2020 baseline):<\/strong> Mean squared error on excess returns: $$L_{\\text{reg}} = \\frac{1}{S} \\sum_{i,t} (r_{i,t} - \\hat{r}_{i,t})^2$$ <em>(p. 5, Eq. 2)<\/em>.<\/li><li><strong>Matched Models (5 pairs):<\/strong> (1) Gradient Boosted Trees (GBT, softmax vs. MSE); (2) Random Forest (RF, tree-vote probabilities vs. mean return); (3) Multilayer Perceptron Neural Network (NN, <code>tanh<\/code> hidden layers, Adam lr=0.01; softmax vs. linear output); (4) Stacking Ensemble (equal-weight average of GBT, RF, NN probability vectors or return forecasts); (5) Linear Benchmarks (multinomial/binary logistic regression vs. OLS) <em>(pp. 5–6)<\/em>.<\/li><li><strong>Training &amp; Tuning:<\/strong> Expanding window retrained annually every June (July 1962 through June $T$); next 12 months = validation/holdout for hyperparameter grid search; following 12 months = strict OOS <em>(p. 6)<\/em>.<\/li><li><strong>Portfolio Construction (Soft vs. Hard):<\/strong><\/li><li class=\"sub-li\"><em>Soft (main):<\/em> Rank all stocks independently by $q_{i,t}(10)$ (top 10% = Long leg) and by $q_{i,t}(1)$ (top 10% = Short leg), excluding stocks qualifying for both legs <em>(p. 4 &amp; fn. 6)<\/em>.<\/li><li class=\"sub-li\"><em>Hard (sensitivity):<\/em> Assign each stock to $\\arg\\max_d q_{i,t}(d)$ <em>(p. 4)<\/em>.<\/li><li><strong>Unresolved extraction details:<\/strong> Exact hyperparameter grids, exact turnover figures, and full large-cap Table 4 numerical values are in the Appendix / OSM or pages not retrieved (<code>Pending source verification<\/code>).<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>VW Long-Short Sharpe (Stacking)<\/td><td><strong>2.080<\/strong> (Cls) vs. <strong>1.392<\/strong> (Reg)<\/td><td>Jul 1983–Dec 2024 (498 mos); Market = 0.533<\/td><td>Table 1 Panel A, p. 22<\/td><\/tr><tr><td>VW Annualized Raw Return (Stacking)<\/td><td><strong>50.4%<\/strong> (Cls, vol 24.3%) vs. <strong>27.1%<\/strong> (Reg, vol 19.5%)<\/td><td>Jul 1983–Dec 2024; Market = 11.7%<\/td><td>Table 1 Panel A, p. 22<\/td><\/tr><tr><td>VW Monthly FF6F Alpha (Stacking)<\/td><td><strong>4.1%/mo<\/strong> (Cls) vs. <strong>1.8%/mo<\/strong> (Reg)<\/td><td>All significant at $p &lt; 0.01$ (NW 6 lags)<\/td><td>Table 1 Panel A, pp. 10, 22<\/td><\/tr><tr><td>Linear Benchmark Isolation (VW)<\/td><td>Logistic Sharpe <strong>1.569<\/strong> (FF6F $\\alpha$ 2.6%/mo) vs. OLS <strong>1.033<\/strong> ($\\alpha$ 1.1%/mo)<\/td><td>Identical linear form; isolates loss function<\/td><td>Table 1 Panel A, pp. 2, 10, 22<\/td><\/tr><tr><td>Individual ML Models (VW Sharpe / FF6F $\\alpha$)<\/td><td>Cls: GBT 1.82 / 3.4%, RF 1.12 / 3.0%, NN 1.88 / 3.5% vs. Reg: GBT 0.60 / 0.8%, RF 0.87 / 0.9%, NN 1.31 / 1.6%<\/td><td>Jul 1983–Dec 2024<\/td><td>Table 1 Panel A, pp. 10, 22<\/td><\/tr><tr><td>EW Long-Short Sharpe (Stacking)<\/td><td><strong>3.77<\/strong> (Cls) vs. <strong>3.12<\/strong> (Reg)<\/td><td>Cls FF6F $\\alpha$ 5.3–5.4%/mo vs. Reg 4.1–4.3%/mo<\/td><td>Sec. 3.1, pp. 8–10<\/td><\/tr><tr><td>Spanning Tests (<code>+Counterpart<\/code>, VW)<\/td><td>Cls $\\alpha$ stays <strong>3.4–3.5%/mo<\/strong> ($-15\\%$ to $-19\\%$ drop) controlling for Reg; Reg $\\alpha$ drops to <strong>1.0–1.4%/mo<\/strong> ($-39\\%$ to $-44\\%$ drop) controlling for Cls<\/td><td>CAPM, FF3F, FF5F, FF6F<\/td><td>Sec. 3.2, p. 10 (Table 2)<\/td><\/tr><tr><td>Net of Transaction &amp; Borrow Costs (VW)<\/td><td>Sharpe <strong>1.85<\/strong> (Cls) vs. <strong>1.09<\/strong> (Reg)<\/td><td>30 bps one-way on two-way turnover + 50 bps/yr short borrow<\/td><td>Sec. 4, pp. 13–14<\/td><\/tr><tr><td>Subperiod Stability (VW Sharpe, Cls vs. Reg)<\/td><td>1983–93: <strong>3.73<\/strong> vs 2.07; 1993–04: <strong>2.63<\/strong> vs 2.19; 2004–14: <strong>1.32<\/strong> vs 1.34; 2014–24: <strong>1.58<\/strong> vs 0.29<\/td><td>Cls leads 3 of 4 decades; tied in 2004–14<\/td><td>Sec. 4, p. 13<\/td><\/tr><tr><td>Class Granularity (VW Soft Sharpe)<\/td><td>2-class: <strong>1.33<\/strong> $\\to$ 3-class: <strong>1.76<\/strong> $\\to$ 5-class: <strong>2.33<\/strong> $\\to$ 10-class: <strong>2.08<\/strong><\/td><td>Soft beats Hard at every class count<\/td><td>Sec. 4, pp. 11–12 (Table 3)<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Classification loads more heavily than regression on trading-friction characteristics (IVOL, bid-ask spread, return volatility, max daily return) <em>(Fig. 1, p. 19)<\/em>.<\/li><li>In the 40 NBER recession months, classification slightly trails regression in VW Sharpe (1.87 vs. 2.15), though it dominates in the 458 expansion months (2.12 vs. 1.32) <em>(pp. 13–14)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li><strong>Volatility-Proxy / Short-Leg Squeeze Risk:<\/strong> Because soft construction ranks stocks by $q_{i,t}(10)$ and $q_{i,t}(1)$ separately, high-volatility stocks have fatter probabilities in <em>both<\/em> tails. Excluding stocks that land in both top-10% legs helps, but residual loading on IVOL and illiquidity means the short leg could face severe borrow scarcity and higher than 50 bps/yr borrow costs in practice.<\/li><li><strong>Comparison Against Rank/Huber Regression Missing:<\/strong> Standard MSE is notoriously sensitive to return outliers. Comparing cross-entropy only against raw-return MSE (rather than MSE on <em>cross-sectionally ranked<\/em> returns or Huber loss) leaves open how much of the gain comes from target rank-compression vs. probability calibration.<\/li><li><strong>2014–2024 Alpha Decay:<\/strong> While classification holds up far better than regression in the most recent decade (Sharpe 1.58 vs. 0.29), both decay substantially relative to 1983–2004 (3.73 / 2.63), consistent with post-2004 crowding and decimalization.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> Replacing MSE loss with <strong>multiclass cross-entropy (5- or 10-class return buckets) + soft probability ranking<\/strong> improves out-of-sample risk-adjusted performance in cross-sectional equity selection, <em>even for a simple linear model (multinomial logistic vs. OLS)<\/em>. The MVP must preserve: (1) identical feature set and rank normalization, (2) matched linear or GBT architecture differing <em>only<\/em> in loss function, (3) soft-probability long/short selection, and (4) strict expanding-window annual retraining.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> Liquid investable U.S. large/mid-cap universe (e.g., Russell 1000 / S&amp;P 500 point-in-time constituents) using 15–30 standard price/fundamental features (momentum, reversal, vol, size, value, profitability, investment).<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> Features observable at month-end $t$ (with 1-quarter reporting lag for accounting data); rebalance at $t+1$ open/VWAP.<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Dollar-neutral VW (and inverse-vol-weighted) top/bottom quintile or decile; exclude stocks with price $&lt; \\$5$ or bottom-decile ADV; test 10–30 bps one-way cost + 50–150 bps/yr short borrow; also test <strong>volatility-neutralized<\/strong> deciles to strip out the IVOL loading.<\/li><li><strong>Deviations from paper:<\/strong> Smaller feature set (20–30 vs. 102) and liquid large-cap universe; add a <strong>rank-MSE / Huber regression<\/strong> third arm to separate outlier-robustness from true cross-entropy benefit.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Question and null:<\/strong> On a liquid U.S. large-cap universe, does 5-class or 10-class multinomial logistic regression (soft ranking) beat matched OLS and rank-MSE regression out-of-sample net of costs? ($H_0: \\text{Sharpe}_{\\text{cls}} \\le \\text{Sharpe}_{\\text{reg}}$).<\/li><li><strong>Market-data proxy and sample:<\/strong> Point-in-time Russell 1000 (or S&amp;P 500) monthly panel, 2000–2025 (train from 2000; expanding OOS from 2010–2025).<\/li><li><strong>Signal and parameter specification:<\/strong> Cross-sectionally ranked features in $[-1,1]$; compare (A) 5-class Multinomial Logistic (L2-regularized), (B) 5-class LightGBM Classifier, (C) matched OLS / Ridge, (D) matched LightGBM MSE Regressor, (E) LightGBM Huber/Rank-target Regressor.<\/li><li><strong>Benchmark and position rule:<\/strong> Long top decile of $q(K)$, short top decile of $q(1)$ (soft), excluding overlaps; VW and EW.<\/li><li><strong>OOS / look-ahead controls / execution:<\/strong> Expanding window retrained annually in June; 1-year validation slice for regularization/depth; 1-day execution lag after month-end.<\/li><li><strong>Costs and primary metrics:<\/strong> Net Sharpe (at 15 bps and 30 bps one-way + 50 bps/yr borrow), FF6F alpha, spanning-test alpha, monthly turnover, IVOL exposure, and max drawdown.<\/li><li><strong>Robustness and predeclared continuation/failure criteria:<\/strong><\/li><li class=\"sub-li\"><em>Continue:<\/em> Classification beats both raw-MSE and rank-MSE by $\\ge +0.25$ net Sharpe on large caps and retains significant spanning alpha after controlling for IVOL.<\/li><li class=\"sub-li\"><em>Stop / Kill:<\/em> If rank-MSE or Huber regression closes $&gt; 80\\%$ of the gap, or if advantage vanishes once IVOL/liquidity-neutralized.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Not pursued<\/strong> — exact 102-feature CRSP/Compustat replication since 1962 is unnecessary before testing the core loss-function hypothesis on a liquid institutional universe.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Related papers / projects:<\/strong><\/li><li class=\"sub-li\"><em>Evidence:<\/em> Directly challenges the regression-default paradigm of Gu, Kelly &amp; Xiu (2020) and Green, Hand &amp; Zhang (2017) <em>(pp. 1–3)<\/em>.<\/li><li class=\"sub-li\"><em>Proposal:<\/em> Highly actionable for any cross-sectional ML alpha pipeline (equity factor models, EM country timing as in the Man Group paper in <code>00_Inbox<\/code>, or multi-asset ranking): switching the loss function from MSE to 5-class cross-entropy + soft ranking is a low-complexity, high-leverage upgrade to test.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source-backed claim (<code>author_reported<\/code>):<\/strong> Training matched ML and linear models with multiclass cross-entropy loss and soft probability ranking beats MSE regression in 49/50 comparisons (VW Sharpe 2.08 vs. 1.39; net of costs 1.85 vs. 1.09) <em>(pp. 8, 13, 22)<\/em>.<\/li><li><strong>Proposed falsifiable next test (<code>proposed_test<\/code>):<\/strong> Run a 3-way controlled horse race (5-class cross-entropy soft vs. raw-MSE vs. rank-MSE/Huber) on a liquid large-cap universe with IVOL-neutralization diagnostics.<\/li><li><strong>Verdict and decision owner:<\/strong> <strong>Pending review<\/strong> — <strong>High-priority method candidate.<\/strong> Clean controlled design, forthcoming in <em>FAJ<\/em>, and immediately testable in Python/R; just audit the IVOL/friction loading before deploying.<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence<\/th><th>Reviewer/date<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>pass<\/td><td>Tagged by ML, loss functions, cross-entropy, GBT/RF/NN, US equities.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>pass<\/td><td>L0–L4 capture mechanism, exact loss equations, headline &amp; robustness results, and IVOL caveat.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><tr><td>Q3 Testability<\/td><td>pass<\/td><td>Reduced-form 3-way horse race specified with clear controls and kill criteria.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Main text &amp; Table 1 Panel A verified; Table 4 (large-cap) and OSM turnover numbers pending full-PDF verification.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source Drive ID / version:<\/strong> <code>1jNLDVrfRmoTST3UT4Ze-AW9eiX2wT6iA<\/code> — <a href=\"https://drive.google.com/file/d/1jNLDVrfRmoTST3UT4Ze-AW9eiX2wT6iA/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Bai and Pukthuanthong (2026) - Machine Learning Classification and Portfolio Construction - Does the Loss Function Matter.pdf<\/a> (Aug 21, 2026, archived in <code>03_Raw<\/code>)<\/li><li><strong>Schema version:<\/strong> 0.1.1<\/li><li><strong>Changes / reviewer:<\/strong> v0.1 initial draft created 2026-11-25; pending human review.<\/li><\/ul>"}], "searchText": "machine learning classification and portfolio construction: does the loss function matter? yang bai, kuntara pukthuanthong machine learning & cross-sectional alpha portfolio construction loss functions empirical asset pricing cross-entropy mse gbt random forest # machine learning classification and portfolio construction: does the loss function matter? ## l0 — research in one minute **question:** holding data, features, and model architecture strictly constant, does training ml models as cross-sectional return-decile **classifiers** (cross-entropy loss) outperform standard **regressors** (mean squared error loss) for long-short portfolio construction? *(pp. 1–2)* **author-reported claim and findings (`author_reported`):** yes. across 5 matched model pairs (gbt, rf, nn, stacking ensemble, and linear/logistic benchmarks) evaluated out-of-sample from july 1983 to december 2024 (498 months), classification outperforms regression in **49 of 50** paired sharpe and factor-alpha comparisons *(pp. 8, 22)*. the value-weighted classification stacking ensemble achieves an annualized sharpe of **2.08** (ff6f alpha **4.1%/month**) vs. **1.39** (ff6f alpha **1.8%/month**) for matched regression *(pp. 1, 8, 22)*. even simple multinomial logistic regression (vw sharpe **1.57**) beats the complex ml regression stacking ensemble (**1.39**) *(pp. 2, 10, 22)*. **caveat (`analyst_inference`):** classification loads noticeably heavier than regression on **trading-friction characteristics** (idiosyncratic volatility, bid-ask spread, return volatility, max daily return) *(fig. 1, p. 19)*, and headline vw returns of 50.4%/yr (4.1%/mo ff6f alpha) still reflect crsp all-stock deciles where micro/small-cap short legs and flat 30 bps + 50 bps/yr borrow assumptions can understate real-world institutional implementation drag. ## l1 — economic intuition **author's explanation (`author_reported`):** long-short decile portfolio payoffs depend on **which decile** a stock lands in, not on predicting exact continuous return magnitudes. mse regression spends model capacity fitting return levels *within* deciles (and gets pulled by noisy return outliers), leaving decision boundaries between deciles blurry. categorical cross-entropy directly optimizes the probability distribution over return states (deciles) and is a strictly proper scoring rule *(pp. 2–4)*. diagnostics confirm that regression's confusion matrix for the 8 middle deciles sits near random chance (10.58%–11.37% vs. 10% baseline) *(p. 2)*. **analyst inference (`analyst_inference`):** cross-entropy on cross-sectional return deciles effectively acts as a built-in **rank-order + outlier-robust objective** (similar in spirit to huber/rank losses) while preserving tail-probability calibrati", "sortRank": 0}, {"id": "ilmanen-2021-tail-risk-hedging-put-trend", "filename": "Ilmanen_2021_Tail_Risk_Hedging_v0.1.1.md", "title": "Tail Risk Hedging: Contrasting Put and Trend Strategies", "authors": "Antti Ilmanen, Ashwin Thapar, Harsha Tummala, Dan Villalon", "year": "2021", "pubDate": "2021-02", "version": "Journal of Systematic Investing, Vol. I, Issue 1", "primaryTopic": "Tail Risk Hedging", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Time-Series Momentum", "Portfolio Insurance", "Crisis Alpha", "Long OTM Put", "Multi-Asset Trend", "Fast vs Slow Drawdown"], "rawUrl": "https://drive.google.com/file/d/19tKxkZ7LGq1VHc2u05fQ3scnnjnJaqv9/view", "rawId": "19tKxkZ7LGq1VHc2u05fQ3scnnjnJaqv9", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Ilmanen, Thapar, Tummala and Villalon (2021) · AQR <strong>Original source:<\/strong> <a href=\"https://drive.google.com/file/d/19tKxkZ7LGq1VHc2u05fQ3scnnjnJaqv9/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Google Drive PDF<\/a> <strong>Previous Wiki draft:<\/strong> <a href=\"https://drive.google.com/file/d/14kJWW-vyl9oSrL-ibIGJz8KfHMmZPNq4/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">v0.1<\/a> <strong>Reading status:<\/strong> Draft, not investment approval. All empirical claims below are <strong>author-reported<\/strong>, unless clearly identified otherwise.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Should investors buy index puts continuously, or pursue multi-asset trend following to mitigate equity tail risk?<\/p>\n<p class=\"wiki-p\">The paper evaluates (i) long-run cost/return and (ii) protection in fast and slow equity drawdowns. In its historical backtest, rolling puts had negative long-term returns whereas multi-asset trend earned positive long-term returns. Put protection was more reliable in abrupt/gapping crashes; trend performed well in most, especially prolonged, equity declines.<\/p>\n<p class=\"wiki-p\"><strong>Key distinction:<\/strong> An inexpensive hedge on average is not necessarily the best hedge for a sudden overnight gap. Comparisons are hypothetical and conditional on strategy definitions.<\/p>\n<p class=\"wiki-p\"><strong>Source:<\/strong> Abstract; Introduction; Figures 1 and 3; Conclusions.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Authors&#x27; mechanism:<\/strong> Put buyers repeatedly pay an insurance premium for nonlinear downside protection. Trend strategies position long in rising and short in falling markets, potentially profiting from persistent price moves across equities, bonds, currencies and commodities. Trend can be whipsawed and respond too late to abrupt crashes; puts provide contractual convexity conditional on strike/maturity.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference:<\/strong> Treat <em>crash speed<\/em> and <em>hedge carry<\/em> as separate portfolio dimensions. A diversified trend signal is a conditional adaptation mechanism, not an options substitute.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction — What AQR Actually Tested", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Component<\/th><th>AQR hypothetical construction<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>Put<\/td><td>Long one-month, 5%-OTM S&amp;P 500 index put (S&amp;P 100 pre-1996), buy mid-month and roll at expiry<\/td><td>Figure 1 notes<\/td><\/tr><tr><td>Put return<\/td><td>Underlying-index-NAV denominator, gross of trading costs and fees; excess of cash<\/td><td>Figure 1 notes<\/td><\/tr><tr><td>Risk scaling<\/td><td>Unlevered Put vol about 6%, scaled by ~1.67 to compare at 10%; <strong>full-sample risk estimate is retrospective<\/strong><\/td><td>Figure 1 notes<\/td><\/tr><tr><td>Trend signals<\/td><td>Equal blend of 1-, 3-, 12-month trend strategies<\/td><td>Appendix<\/td><\/tr><tr><td>Trend universe<\/td><td>67 markets: 29 commodities, 11 equity indices, 15 bond markets, 12 currency pairs<\/td><td>Appendix<\/td><\/tr><tr><td>Trend sizing<\/td><td>Equal-volatility weights using rolling 36-month volatility; 10% long-term target, not hard realized-vol cap<\/td><td>Appendix<\/td><\/tr><tr><td>Returns &amp; costs<\/td><td>Futures if available, financed cash indices otherwise; estimated transactions costs but gross of fees<\/td><td>Appendix; Figure 1<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\">The precise source-data treatment, signal equations, execution prices, rebalancing and market-roll rules are not fully specified for exact reproduction. Do not substitute the reduced-form experiment below for these original specifications.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>AQR comparison window:<\/strong> January 1985–March 2020 (Figure 1).<\/p>\n<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Author-reported evidence<\/th><th>Source<\/th><\/tr><\/thead><tbody><tr><td>Long-term economics<\/td><td>Persistently negative compounded Put series versus positive Trend series<\/td><td>Figure 1 and discussion<\/td><\/tr><tr><td>Selected slow drawdowns<\/td><td>Put positive in 7/8; Trend positive in 6/8<\/td><td>Figure 3 and text<\/td><\/tr><tr><td>Selected fast drawdowns<\/td><td>Put positive in 10/10; Trend positive in 9/10<\/td><td>Figure 3 and text<\/td><\/tr><tr><td>Relative fast-crash magnitude<\/td><td>Put earned higher average return during selected fast events<\/td><td>Figure 3 and text<\/td><\/tr><tr><td>Counterexample<\/td><td>October 1987 was a failed protection episode for Trend<\/td><td>Figure 3 discussion<\/td><\/tr><tr><td>First-quarter 2020<\/td><td>Trend&#x27;s equity component lost money, while other markets contributed gains<\/td><td>Appendix-related discussion / note 4<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Do not interpret event hit rates as forward probabilities.<\/strong> The events are historically selected. Figure values beyond the enumerated counts have not been digitized and cross-checked against images.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strengths:<\/strong> Clear separation of hedging cost versus protection; fast versus slow loss paths; multi-asset versus equity-specific protection; extensive economic discussion.<\/p>\n<p class=\"wiki-p\"><strong>Authors&#x27; caveats:<\/strong> Option history is limited; puts of other maturities/strikes differ; trend can be caught by sudden gaps, sharp reversals and whipsaws; active manager outcomes may vary.<\/p>\n<p class=\"wiki-p\"><strong>Analyst concerns:<\/strong> Put figures are gross of costs while trend includes estimates of costs. Volatility matching may not match capital/margin, financing or portfolio insurance notional. Full-sample volatility scaling introduces a backtest construction choice inappropriate for a live walk-forward comparator. The 1985–2020 sample and selected crises cannot guarantee future protection.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab (Schema v0.1.1)", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Hypothesis to test (analyst-proposed):<\/strong> A slow-moving trend filter may mitigate <em>prolonged<\/em> equity drawdowns, but its lag makes it less dependable than pre-positioned convex insurance during <em>fast<\/em> selloffs.<\/p>\n<p class=\"wiki-p\"><strong>What must survive simplification:<\/strong> Decision lag, realized drawdown speed, cash/hedging carry, and wealth preservation. <strong>What may initially be dropped:<\/strong> AQR&#x27;s 67 futures markets, options surface estimation, cross-asset short books, and exact historic portfolio construction.<\/p>\n<p class=\"wiki-p\">The reduced-form proxy will test a narrower mechanism: <strong>conditional equity de-risking<\/strong>, not AQR&#x27;s multi-asset crisis-alpha strategy.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Instrument/data proposal (not AQR method):<\/strong> Daily adjusted total-return SPY prices for equity exposure, and BIL or a daily Treasury-bill proxy for defensive exposure. Compare with a continuously invested SPY benchmark; use a short-duration rate proxy when SPY or BIL was not yet available only in a separate, clearly marked extension. Start with an overlap-only study to avoid synthetic inception assumptions.<\/p>\n<p class=\"wiki-p\"><strong>Signal observed at close t:<\/strong> 200-trading-day simple moving average of SPY total-return price, based exclusively on historical data through t.<\/p>\n<p class=\"wiki-p\"><strong>Earliest allowed execution:<\/strong> Next session&#x27;s close (t+1); the resulting position earns return beginning <strong>after<\/strong> that execution. For daily-close backtests, apply position decided at t to return from close(t+1) to close(t+2), unless the execution model explicitly defines and supports a different convention. No same-close execution.<\/p>\n<p class=\"wiki-p\"><strong>Position rule:<\/strong> If price &gt; MA200, target SPY 100%, defensive asset 0%; otherwise target SPY 0%, defensive asset 100%. No leverage. Record cash returns and all rebalances.<\/p>\n<p class=\"wiki-p\"><strong>Trading frictions:<\/strong> Test a base case at 5 bps one-way on traded notional and stress at 10–20 bps, documenting that these are <em>analyst assumptions<\/em> and not historical estimates. Model turnover, trading spread/commissions, and differences between price data and actual ETF fills. Portfolio costs and benchmark costs must be comparable.<\/p>\n<p class=\"wiki-p\"><strong>Limitations:<\/strong> Unlike AQR Trend, this rule is long/cash only, uses one market, and cannot go short or benefit from trends in bonds, commodities and currencies. It also omits direct puts and thus cannot compare contractual convexity.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test ID:<\/strong> <code>TAIL_AQR_RF_001<\/code> (proposed; not run).<\/p>\n<p class=\"wiki-p\"><strong>Primary question:<\/strong> Relative to 100% SPY buy-and-hold, does a precommitted SPY MA200/BIL switch lower portfolio drawdown depth and expected shortfall in <em>prolonged<\/em> equity declines, net of costs?<\/p>\n<p class=\"wiki-p\"><strong>Null:<\/strong> Any improvement in downside risk is absent or insufficient to compensate for foregone equity participation, after costs.<\/p>\n<p class=\"wiki-p\"><strong>Fixed baseline setup:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Daily total-return data, SPY and BIL, from <strong>the first date with sufficient 200-day SPY history and available BIL history through the latest point-in-time dataset<\/strong>. Record downloaded data vintage and corporate-action adjustments; do not assume any particular live sample length.<\/li><li>200-day SMA, signal formed after close t, next-close trades; no look-ahead.<\/li><li>Binary portfolio SPY/BIL; buy-and-hold SPY comparator; one-way trade-cost cases 0/5/10/20 bps.<\/li><li>Prespecified primary risk metric: <strong>maximum peak-to-trough portfolio drawdown<\/strong>; report compound growth, Sharpe, volatility, 5% historical expected shortfall, turnover, and time invested as complements.<\/li><li>Do not optimize the 200-day threshold or any parameter on evaluation data.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Out-of-sample protocol:<\/strong> Because this fixed rule is selected before testing, reserve a contiguous later holdout (for example, final 30% of available overlapping dates) and report earlier/holdout results separately. Once inspected, the holdout is not to be reused for parameter tuning. If the rule changes after examining results, define a new prospective holdout or walk-forward design.<\/p>\n<p class=\"wiki-p\"><strong>Fast/slow descriptive comparison:<\/strong> Predefine equity drawdown events and their duration from SPY (e.g., falls of at least 15%; <em>fast<\/em> reaches trough within 20 trading days from the prior peak, <em>slow<\/em> takes longer). Label these thresholds <strong>proposed<\/strong>, not paper parameters; assess sensitivity at 10% and 20% drawdown thresholds separately. Report both per-event hedge outcomes and small-sample counts; avoid treating event hit rates as statistical certainty.<\/p>\n<p class=\"wiki-p\"><strong>Provisional go / revise / stop:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li><strong>Continue<\/strong> only if holdout maximum drawdown improves meaningfully (proposed threshold ≥20% relative reduction in drawdown <em>magnitude<\/em>) after 5-bp one-way costs <strong>without<\/strong> an economically unacceptable CAGR sacrifice (proposed threshold ≤2 percentage points/year). These thresholds are decision heuristics, not source-derived.<\/li><li><strong>Revise<\/strong> if improvement depends on one event, the parameter boundary, financing assumptions, or disappears at 10-bp costs.<\/li><li><strong>Stop this proxy<\/strong> if net holdout risk protection is absent, execution/turnover makes it uneconomic, or results depend on a look-ahead artifact. Do <strong>not<\/strong> interpret this as falsifying AQR&#x27;s full trend strategy.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Next complexity, only if justified:<\/strong> Add a minimal multi-asset time-series trend basket using futures or liquid ETFs; later evaluate constant-budget put protection and a blend, with comparable funding/collateral and cash-flow accounting.<\/p>\n<p class=\"wiki-p\"><strong>Experiment status:<\/strong> Specified, <strong>not executed<\/strong>. There are no backtest findings in this Wiki.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued at v0.1.1. To attempt later: historical index-option chain; put settlement and expiry; 67-market futures/cash history; 1/3/12-month signals; precise rolls/rebalancing; financing/volatility normalization and transaction costs. This is not needed to run <code>TAIL_AQR_RF_001<\/code>.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Chang, Holdom &amp; Bhansali (2021), _Tail Risk Hedging Performance: Measuring What Counts_<\/strong>: <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">source PDF<\/a>. Their cash-flow-aware performance framework is a <em>proposed<\/em> complementary evaluation, particularly when comparing option-premium outlays and capital withdrawals. It was not jointly tested in this card.<\/li><li><strong>Portfolio overlay systems:<\/strong> A possible follow-up is to evaluate whether de-risking complements an existing multi-asset trend allocation. This is an analyst research idea, not an AQR conclusion.<\/li><li><strong>Topic areas:<\/strong> Tail Risk Hedging, Crisis Alpha, Trend Following, Volatility Risk Premium.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported claim:<\/strong> Multi-asset Trend offers historically favorable cost economics in many equity market tail events, while long Put provides more direct, reliable fast-crash convexity.<\/p>\n<p class=\"wiki-p\"><strong>Next research action:<\/strong> Run <code>TAIL_AQR_RF_001<\/code>, preserving the frozen trading clock, metrics, transaction costs and holdout. If promising, explicitly assess its <em>incremental<\/em> whole-portfolio benefit and only then consider options or a broader trend universe.<\/p>\n<p class=\"wiki-p\"><strong>Provisional verdict:<\/strong> <strong>Worth a low-cost reduced-form test. Not replicated, not validated, and not investment-approved.<\/strong> Decision owner: human research reviewer.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Assessment<\/th><th>Basis / remaining work<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Tags present; live catalog query not yet run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Source comparison and distinctions recorded; awaits reader review<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Full rule/cost/OOS and go/no-go specified; requires independent check and executable convention reconciliation<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Claims linked to Figure 1, Figure 3, Appendix; image-level numerical verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Raw Drive ID:<\/strong> <code>19tKxkZ7LGq1VHc2u05fQ3scnnjnJaqv9<\/code>, source dated February 2021; read 2026-10-24.<\/li><li><strong>Previous Wiki:<\/strong> <code>Ilmanen_2021_Tail_Risk_Hedging.md<\/code>, card v0.1, remains unchanged.<\/li><li><strong>New Wiki:<\/strong> v0.1.1 draft, 2026-10-24; L5 replaced by Practical Research Lab, Q3 revised to Testability.<\/li><li><strong>Source separation:<\/strong> Original AQR findings in L0–L4; new SPY/BIL reduced-form experiment is analyst-proposed and has not been executed.<\/li><\/ul>"}], "searchText": "tail risk hedging: contrasting put and trend strategies antti ilmanen, ashwin thapar, harsha tummala, dan villalon tail risk hedging time-series momentum portfolio insurance crisis alpha long otm put multi-asset trend fast vs slow drawdown reduced-form experiment # tail risk hedging: contrasting put and trend strategies **authors:** ilmanen, thapar, tummala and villalon (2021) · aqr **original source:** [google drive pdf](https://drive.google.com/file/d/19tkxkz7lgq1vhc2u05fq3scnnjnjaqv9/view) **previous wiki draft:** [v0.1](https://drive.google.com/file/d/14kjww-vyl9osrl-ibigjz8kfhmmzpnq4/view) **reading status:** draft, not investment approval. all empirical claims below are **author-reported**, unless clearly identified otherwise. ## l0 — research in one minute **question:** should investors buy index puts continuously, or pursue multi-asset trend following to mitigate equity tail risk? the paper evaluates (i) long-run cost/return and (ii) protection in fast and slow equity drawdowns. in its historical backtest, rolling puts had negative long-term returns whereas multi-asset trend earned positive long-term returns. put protection was more reliable in abrupt/gapping crashes; trend performed well in most, especially prolonged, equity declines. **key distinction:** an inexpensive hedge on average is not necessarily the best hedge for a sudden overnight gap. comparisons are hypothetical and conditional on strategy definitions. **source:** abstract; introduction; figures 1 and 3; conclusions. ## l1 — economic intuition **authors' mechanism:** put buyers repeatedly pay an insurance premium for nonlinear downside protection. trend strategies position long in rising and short in falling markets, potentially profiting from persistent price moves across equities, bonds, currencies and commodities. trend can be whipsawed and respond too late to abrupt crashes; puts provide contractual convexity conditional on strike/maturity. **analyst inference:** treat *crash speed* and *hedge carry* as separate portfolio dimensions. a diversified trend signal is a conditional adaptation mechanism, not an options substitute. ## l2 — model construction — what aqr actually tested | component | aqr hypothetical construction | source | |---|---|---| | put | long one-month, 5%-otm s&p 500 index put (s&p 100 pre-1996), buy mid-month and roll at expiry | figure 1 notes | | put return | underlying-index-nav denominator, gross of trading costs and fees; excess of cash | figure 1 notes | | risk scaling | unlevered put vol about 6%, scaled by ~1.67 to compare at 10%; **full-sample risk estimate is retrospective** | figure 1 notes | | trend signals | equal blend of 1-, 3-, 12-month trend strategies | appendix | | trend universe | 67 ", "sortRank": 0}, {"id": "montana-etal-2022", "filename": "Montana_etal_2022_v0.1.1.md", "title": "An Alarm System for Market Crashes Using Quantum Majorization", "authors": "Montana, Souto Arias, Cirillo & Oosterlee", "year": "2022", "pubDate": "2022", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Crash forecasting"], "rawUrl": "https://drive.google.com/file/d/1deYcyKsO4eTeHSyQWGhTNsTTtF7oCHqV/view", "rawId": "1deYcyKsO4eTeHSyQWGhTNsTTtF7oCHqV", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Montana, Souto Arias, Cirillo &amp; Oosterlee <strong>Date/version:<\/strong> 2022; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1deYcyKsO4eTeHSyQWGhTNsTTtF7oCHqV/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Crash forecasting <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does a simpler stock downside co-exceedance alarm add information beyond market volatility?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Authors report all selected crashes signaled within 12 months, with 3.8% false alarms (Abstract), not independently verified.<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> Cross-sectional extreme-loss dependence may warn before market crashes.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Quantum majorization of tail pseudo-correlation matrices and reinforced urn forecasting, using DJIA 30 daily data, March 1986–December 2020.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors report all selected crashes signaled within 12 months, with 3.8% false alarms (Abstract), not independently verified.<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does a simpler stock downside co-exceedance alarm add information beyond market volatility?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> Cross-sectional extreme-loss dependence may warn before market crashes.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Build rolling 126-day pairwise tail-loss clustering score; use expanding-window probability threshold to forecast 63-day &gt;15% index drawdown; compare precision/false-alarm days versus VIX.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does a simpler stock downside co-exceedance alarm add information beyond market volatility?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Build rolling 126-day pairwise tail-loss clustering score; use expanding-window probability threshold to forecast 63-day &gt;15% index drawdown; compare precision/false-alarm days versus VIX.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Authors report all selected crashes signaled within 12 months, with 3.8% false alarms (Abstract), not independently verified.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1deYcyKsO4eTeHSyQWGhTNsTTtF7oCHqV<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "an alarm system for market crashes using quantum majorization montana, souto arias, cirillo & oosterlee tail risk crash forecasting # an alarm system for market crashes using quantum majorization **authors:** montana, souto arias, cirillo & oosterlee **date/version:** 2022; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1deycykso4etehsyqwghtnstttf7ochqv/view) **track:** crash forecasting **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does a simpler stock downside co-exceedance alarm add information beyond market volatility? **author-reported headline:** authors report all selected crashes signaled within 12 months, with 3.8% false alarms (abstract), not independently verified. **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** cross-sectional extreme-loss dependence may warn before market crashes. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** quantum majorization of tail pseudo-correlation matrices and reinforced urn forecasting, using djia 30 daily data, march 1986–december 2020. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | authors report all selected crashes signaled within 12 months, with 3.8% false alarms (abstract), not independently verified. | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the origina", "sortRank": 1}, {"id": "alankar-depalma-scholes", "filename": "Alankar_DePalma_Scholes_v0.1.1.md", "title": "An Introduction to Tail Risk Parity", "authors": "Alankar, DePalma & Scholes", "year": "Not verified", "pubDate": "Not verified", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Portfolio construction"], "rawUrl": "https://drive.google.com/file/d/1KSXXHGBpcJP0jx0g44g00xbzv8tXuyQ1/view", "rawId": "1KSXXHGBpcJP0jx0g44g00xbzv8tXuyQ1", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Alankar, DePalma &amp; Scholes <strong>Date/version:<\/strong> Unverified; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1KSXXHGBpcJP0jx0g44g00xbzv8tXuyQ1/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Portfolio construction <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does historical expected-shortfall parity improve portfolio tails compared with inverse-volatility allocation?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Executive summary claims improved downside protection and estimated ~50% historical cost savings versus options; needs detailed review.<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> Allocating by tail-loss exposure may be more relevant than volatility parity.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Proprietary option-implied expected tail loss (ETL) drives tail-risk parity weights instead of conventional volatility weights.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Executive summary claims improved downside protection and estimated ~50% historical cost savings versus options; needs detailed review.<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does historical expected-shortfall parity improve portfolio tails compared with inverse-volatility allocation?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> Allocating by tail-loss exposure may be more relevant than volatility parity.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather th
