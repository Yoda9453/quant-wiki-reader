plication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | executive summary claims improved downside protection and estimated ~50% historical cost savings versus options; needs detailed review. | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the origi", "sortRank": 1}, {"id": "brown-spitzer-2006", "filename": "Brown_Spitzer_2006_v0.1.1.md", "title": "Caught by the Tail: Tail Risk Neutrality and Hedge Fund Returns", "authors": "Stephen J. Brown; Jonathan F. Spitzer", "year": "2006", "pubDate": "2006", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Hedge fund downside beta"], "rawUrl": "https://drive.google.com/file/d/1JEyTJzopbvJ-AzbKtyUJI8eJtC3wb92Y/view", "rawId": "1JEyTJzopbvJ-AzbKtyUJI8eJtC3wb92Y", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1JEyTJzopbvJ-AzbKtyUJI8eJtC3wb92Y/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a>. <strong>Authors:<\/strong> Stephen J. Brown; Jonathan F. Spitzer. <strong>Year:<\/strong> 2006. Draft pending human review; not independently replicated.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Research question:<\/strong> Can the paper&#x27;s identified downside-tail mechanism matter to risk management? <strong>Source-reported finding:<\/strong> Authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (Abstract). <strong>Caution:<\/strong> The source results are not trading signals or OOS validation.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">The core mechanism is that adverse outcomes can behave differently from average market conditions. <strong>Analyst inference:<\/strong> A simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> The authors develop a measure of tail neutrality and inspect hedge-fund styles and funds-of-funds. This is the authors&#x27; method, distinct from the proxy proposed under L5. Exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-based evidence<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (Abstract).<\/td><td>Abstract; introductory discussion<\/td><\/tr><tr><td>Independently verified experiment<\/td><td>None<\/td><td>Not run<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Value:<\/strong> Offers a testable downside-risk question. <strong>Concerns:<\/strong> Tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. Confirm exact sample and empirical figure details from the source before approving Q4.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Reduced-form question:<\/strong> Does the core downside-risk relationship survive a simpler point-in-time market-data test? Preserve the timing and conditional downside feature, but not necessarily all original equations.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Available inputs and trading/observation proxy:<\/strong> Compare ordinary market beta with beta conditional on bottom-decile monthly S&amp;P returns using hedge-fund index data, held-out years and sample-count controls. <strong>Execution:<\/strong> Use only observations known as of decision time t; trade no earlier than a feasible next opportunity if a strategy is tested. Account for spreads, commissions, turnover, funding and missing market data. A forecasting-only test must not be presented as trading P&amp;L.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Hypothesis:<\/strong> The simplified downside indicator improves a tail outcome versus its predeclared simple baseline. <strong>Frozen baseline experiment:<\/strong> Compare ordinary market beta with beta conditional on bottom-decile monthly S&amp;P returns using hedge-fund index data, held-out years and sample-count controls. <strong>Comparator:<\/strong> An unconditional historical rate, ordinary market beta, rolling volatility or unhedged benchmark, as appropriate to the specific dependent variable. Select before testing. <strong>Evaluation:<\/strong> Expanding/rolling training windows, strict chronological holdout, no future-informed thresholds, downside hit rates or expected shortfall, MaxDD, and if tradable after-cost results. <strong>Decision rule:<\/strong> Continue only if improvements persist out of sample, survive realistic trading frictions and at least one reasonable parameter perturbation; otherwise revise or stop this proxy (not the original theory). <strong>Status:<\/strong> Experiment specified but <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Not pursued in this batch; exact estimation requires full figure/equation inspection and source-specific data contracts.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\">Conceptually related to <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">AQR&#x27;s Tail Risk Hedging<\/a> as an additional dimension of tail-risk measurement, forecasting or hedging. This is a suggested connection, not a conclusion jointly established by authors.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported claim:<\/strong> Authors report hedge funds can become more sensitive to market risk in substantial declines, including some funds-of-funds (Abstract). <strong>Next falsifiable test:<\/strong> Run the frozen L5.C proxy using point-in-time data and transparent OOS accounting. <strong>Verdict:<\/strong> Research draft worth triage; pending review, no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Live retrieval not tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td 3; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1TYDPFLGAHsxdypsuMrlZaFMUbxFgCcpK/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Measurement / pricing <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does country downside correlation jump during global risk-off episodes?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Commonality is stronger in developed and more open markets; U.S. economy and global volatility matter (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> Country tail-risk premia share global and regional components.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Examines tail-risk premium comovement for 44 countries, 1990–2015.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Commonality is stronger in developed and more open markets; U.S. economy and global volatility matter (Abstract).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does country downside correlation jump during global risk-off episodes?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> Country tail-risk premia share global and regional components.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Estimate rolling downside co-exceedances across liquid country ETFs, comparing high-VIX periods to normal regimes and a constant-correlation benchmark.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does country downside correlation jump during global risk-off episodes?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Estimate rolling downside co-exceedances across liquid country ETFs, comparing high-VIX periods to normal regimes and a constant-correlation benchmark.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class= all / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Significant premium using tail dependence alone but no premium using the combined measure (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1BStw5dkyocgY4MslZKs1pGUcFKK5o3E1<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "does systematic tail risk matter? stoja, polanski, nguyen & pereverzin tail risk measurement / pricing # does systematic tail risk matter? **authors:** stoja, polanski, nguyen & pereverzin **date/version:** unverified; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1bstw5dkyocgy4mslzks1pgucfkk5o3e1/view) **track:** measurement / pricing **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does an asset's conditional downside beta or its severity-weighted form better explain future returns? **author-reported headline:** significant premium using tail dependence alone but no premium using the combined measure (abstract). **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** the inferred tail-risk premium changes with the definition of market-tail exposure. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** compares generalized tail dependence with a measure multiplying tail dependence by normalized tail severity. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | significant premium using tail dependence alone but no premium using the combined measure (abstract). | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the original authors, not to an executed vault strategy. ## l4 — research evaluation **st", "sortRank": 1}, {"id": "guo-loeper-2021-efficient-use-of-options", "filename": "Guo_Loeper_2021_Efficient_Use_of_Options_v0.1.1.md", "title": "Efficient Use of Options for Tail Risk Hedging", "authors": "{}", "year": "2021", "pubDate": "2021-03-24", "version": "0.1.1", "primaryTopic": "Tail Risk Hedging", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst/view", "rawId": "1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">Guo and Loeper examine long-equity portfolios that fund part of downside put insurance by selling out-of-the-money calls. They compare strikes, maturities and notionals using mostly 2007–2018 S&amp;P 500 options settlement data plus a 2020 episode. Their stated message is that protective puts reduce severe drawdowns but are expensive; partially financing them with call sales can improve the trade-off, though structure matters.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">Call selling collects option premium but caps some upside; put buying purchases convex loss protection. Strike, expiry and quantity jointly affect negative carry, participation in rebounds and crash behavior. Cheaper spreads/ratios may also lose protection in the very extreme tail.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">Representative portfolio: long S&amp;P 500 index, short OTM call and long OTM put; compare strike/maturity/notional choices on option settlement prices. The paper evaluates return-risk efficient frontiers, including variance and Value at Risk, explores put spreads/ratios, and separately examines 2020. Main 2007–2018 sample; 2010–2018 excluding GFC. Authors discuss option liquidity concerns but make no explicit trading-cost/market-impact assumption. Sources: Abstract, Key Takeaways, Sections 3–9.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Key takeaways: short-dated OTM call sales (example roughly 15 business days, 102–104% moneyness) were favorable in studied grids.<\/li><li>Downside puts were costly but strongly reduced drawdown in a sample including the GFC.<\/li><li>Authors report studied put-spread and put-ratio alternatives generally underperformed outright put protection in their chosen comparisons.<\/li><li>All strike recommendations are conditional on their sample and design, not universal or live-tradable prescriptions.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Main concerns: grid search/selection on a GFC-containing dataset, bid/ask and market impact omitted, OTC interpolated prices may not be executable, premium financed by selling upside, and possible dependence on cash settlement and exercise details. Stress test the tail payoff diagram before trusting Sharpe alone.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> A partially financed put hedge exchanges some upside participation for downside convexity, potentially reducing hedge carry while protecting the core portfolio.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Use current SPX option surface (or a comparable options dataset with reliable historical bid/ask) plus S&amp;P total-return exposure; first model expiry payoffs and financing, then a self-financing historical portfolio. Plan monthly put rolls, shorter-dated covered calls, collateral, commission/spread and assignment/settlement differences. Do not backtest using a mid quote that cannot be traded.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: a fixed-rule collar (long index, short 1-month 103%-strike call, long 3-month 95%-strike put) does not improve net downside protection per unit of annual premium/capped upside versus equal-premium protective puts and unhedged equity. These tenors/strikes are <strong>analyst-proposed<\/strong> starting proxies, not the paper optimum. Freeze structure before OOS test; choose historical option chain with matched contracts and next-day actual executable quotes. Track net premium flows, hedge mark-to-market, cash, total portfolio return, MaxDD, worst-5% weeks, forgone upside, gamma gaps and turnover. Costs sensitivity with full bid/ask versus mid, and 2008/2020/2022 type events if within available data. Continue only if hedge effectiveness survives realistic spreads and a range of event paths; otherwise stop or simplify to a payoff-only scenario study.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Exact surface/strike-grid replication deferred; requires original settlements, interpolation and period-specific option conventions.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Guo and Loeper examine long-equity portfolios that fund part of downside put insurance by selling out-of-the-money calls.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Metadata/tags exist; search-index retrieval not yet tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Core question and findings present; human reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form protocol proposed; second-analyst specification review pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source sections indicated; exhibit/page image confirmation pending for quantitative material<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1Oc3nBZfMOAbnnul0xZqgZ6N-buiPNPst<\/code>.<\/li><li>Draft generated under Schema v0.1.1 on 2026-10-24.<\/li><li>Figures and parameter choices in L5 are <strong>researcher proposals<\/strong> unless clearly identified as paper content. No tests were executed.<\/li><\/ul>"}], "searchText": "efficient use of options for tail risk hedging {} tail risk hedging # efficient use of options for tail risk hedging **source:** [original pdf](https://drive.google.com/file/d/1oc3nbzfmoabnnul0xzqgz6n-buipnpst/view) · **research status:** draft, pending human review. this card is source-based but not a full academic replication. ## l0 — research in one minute guo and loeper examine long-equity portfolios that fund part of downside put insurance by selling out-of-the-money calls. they compare strikes, maturities and notionals using mostly 2007–2018 s&p 500 options settlement data plus a 2020 episode. their stated message is that protective puts reduce severe drawdowns but are expensive; partially financing them with call sales can improve the trade-off, though structure matters. ## l1 — economic intuition call selling collects option premium but caps some upside; put buying purchases convex loss protection. strike, expiry and quantity jointly affect negative carry, participation in rebounds and crash behavior. cheaper spreads/ratios may also lose protection in the very extreme tail. ## l2 — model construction representative portfolio: long s&p 500 index, short otm call and long otm put; compare strike/maturity/notional choices on option settlement prices. the paper evaluates return-risk efficient frontiers, including variance and value at risk, explores put spreads/ratios, and separately examines 2020. main 2007–2018 sample; 2010–2018 excluding gfc. authors discuss option liquidity concerns but make no explicit trading-cost/market-impact assumption. sources: abstract, key takeaways, sections 3–9. ## l3 — empirical findings **author-reported; not independently verified:** - key takeaways: short-dated otm call sales (example roughly 15 business days, 102–104% moneyness) were favorable in studied grids. - downside puts were costly but strongly reduced drawdown in a sample including the gfc. - authors report studied put-spread and put-ratio alternatives generally underperformed outright put protection in their chosen comparisons. - all strike recommendations are conditional on their sample and design, not universal or live-tradable prescriptions. ## l4 — research evaluation main concerns: grid search/selection on a gfc-containing dataset, bid/ask and market impact omitted, otc interpolated prices may not be executable, premium financed by selling upside, and possible dependence on cash settlement and exercise details. stress test the tail payoff diagram before trusting sharpe alone. ## l5 — practical research lab ### l5.", "sortRank": 1}, {"id": "bhansali-davis-2010", "filename": "Bhansali_Davis_2010_v0.1.1.md", "title": "Offensive Risk Management: Can Tail Risk Hedging Be Profitable?", "authors": "Vineer Bhansali & Joshua M. Davis", "year": "2010", "pubDate": "2010", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Hedging / redeployment"], "rawUrl": "https://drive.google.com/file/d/1DQtVg6af98ExzhyDzzia28N_rB6QbGa3/view", "rawId": "1DQtVg6af98ExzhyDzzia28N_rB6QbGa3", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Vineer Bhansali &amp; Joshua M. Davis <strong>Date/version:<\/strong> 2010; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1DQtVg6af98ExzhyDzzia28N_rB6QbGa3/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Hedging / redeployment <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> Insurance payouts can be more valuable when deployed into distressed investments.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Economic portfolio model links hedge premium and crisis-liquidity shadow value to the opportunity to add risk following drawdowns.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> Insurance payouts can be more valuable when deployed into distressed investments.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Compare fixed-budget synthetic crash payouts held as bills vs precommitted post-crash re-risking; include hedge premium and rebalance frictions.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Compare fixed-budget synthetic crash payouts held as bills vs precommitted post-crash re-risking; include hedge premium and rebalance frictions.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1DQtVg6af98ExzhyDzzia28N_rB6QbGa3<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "offensive risk management: can tail risk hedging be profitable? vineer bhansali & joshua m. davis tail risk hedging / redeployment # offensive risk management: can tail risk hedging be profitable? **authors:** vineer bhansali & joshua m. davis **date/version:** 2010; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1dqtvg6af98exzhydzzia28n_rb6qbga3/view) **track:** hedging / redeployment **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does reinvesting hedge proceeds after a large equity decline improve final wealth relative to merely holding payouts in cash? **author-reported headline:** authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections). **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** insurance payouts can be more valuable when deployed into distressed investments. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** economic portfolio model links hedge premium and crisis-liquidity shadow value to the opportunity to add risk following drawdowns. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | authors argue redeployment increases value of a hedge beyond standalone payoff (opening sections). | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the original authors, not to an ", "sortRank": 1}, {"id": "haase-neuenkirch-2021-bull-bear-markets", "filename": "Haase_Neuenkirch_2021_Bull_Bear_Markets_v0.1.1.md", "title": "Predictability of Bull and Bear Markets: A New Look at Forecasting Stock Market", "authors": "{}", "year": "2021", "pubDate": "2021-01", "version": "0.1.1", "primaryTopic": "Tail Risk Forecasting", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1IqYlO3KVfABFaVwNT8zbHM2YiSwsalT9/view", "rawId": "1IqYlO3KVfABFaVwNT8zbHM2YiSwsalT9", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1IqYlO3KVfABFaVwNT8zbHM2YiSwsalT9/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">This paper predicts weekly bull/bear regimes rather than simply next-period market returns. The authors combine diffusion indices from 115 macro-financial series, shrinkage/PCA, Markov switching with time-varying transition probabilities and forecast combinations. They report improved regime classification and investor utility, but <em>not<\/em> persistent superiority of return forecasts over the historical mean.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">Market regimes are persistent but uncertain; stable, low-dimensional predictors may improve state-transition estimates relative to fitting all macro variables directly. Forecasting the probability of a bear regime is different from forecasting the exact return, and may still support risk-budgeting rules.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">Weekly S&amp;P 500 and macro-financial observations covering Nov 24, 1989–Jul 3, 2020; real-time out-of-sample experiment spans last 820 weeks, initial training ending Oct 15, 2004. Construct PCA or sparse-PCA diffusion indices from 115 predictors, estimate Markov-switching model with time-varying transition probabilities, aggregate model forecasts. Paper discusses publication lags/revisions and transaction costs. Methods and data section, and conclusions.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Abstract: authors report statistically improved regime forecasts against multiple benchmarks, increased certainty-equivalent performance and reduced tail exposure in their trading exercise.<\/li><li>Abstract/conclusion: return predictions do <strong>not<\/strong> consistently outperform historical-average forecasts.<\/li><li>The introduction reports regime classification above 80% under their model and chosen dating conventions; event class imbalance and signal timing need checking.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Strong distinction between state prediction and return prediction. Risks: ex-post regime labels use future paths if carelessly reused; macro series vintage and publication lags, sample-dependent regime definitions, model proliferation and optimistic accuracy in imbalanced samples. Do not equate higher classification accuracy with a profitable strategy.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> A small set of lagged macro-financial variables can predict an increased probability of a sustained risk-off regime, potentially improving ex-ante portfolio exposure.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Use weekly S&amp;P 500 total-return data, lagged financial conditions proxies such as term spread, credit spread and realized equity volatility, all lagged to public availability. Test logistic probability of downside regime first; a full Markov-switching engine is optional. Positions SPY or Treasury bill at next eligible close; monitor rebalance and risk-on opportunity cost.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: simple lagged weekly predictors do not beat a trailing-market-state baseline for next-4-week drawdown warning. Freeze target as SPY next-4-week drawdown worse than -8% (overlapping outcomes acknowledged) and predictors as 4-week equity return, 13-week realized volatility and credit spread level/change. Fit expanding-window regularized logistic from training history; purge/embargo overlapping labels and evaluate a chronological holdout using Brier score, precision/recall at predeclared alert rates and drawdown-sensitive utility, versus volatility-only baseline. Act on the signal no earlier than next weekly close, assuming economic data vintages genuinely known at the decision time. Continue only if improvement holds across crises without excessive false alarms/turnover.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Full replication would require historical real-time vintages of all 115 variables, sparse PCA construction, full MS-TVTP model estimates and their regime-dating convention.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> This paper predicts weekly bull/bear regimes rather than simply next-period market returns.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Metadata/tags exist; search-index retrieval not yet tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Core question and findings present; human reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form protocol proposed; second-analyst specification review pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source sections indicated; exhibit/page image confirmation pending for quantitative material<\/td><\/tr><\/tbody><\/table><\/div>"}, e model forecasts. paper discusses publication lags/revisions and transaction costs. methods and data section, and conclusions. ## l3 — empirical findings **author-reported; not independently verified:** - abstract: authors report statistically improved regime forecasts against multiple benchmarks, increased certainty-equivalent performance and reduced tail exposure in their trading exercise. - abstract/conclusion: return predictions do **not** consistently outperform historical-average forecasts. - the introduction reports regime classification above 80% under their model and chosen dating conventions; event class imbalance and signal timing need checking. ## l4 — research evaluation strong distinction between state prediction and return prediction. risks: ex-post regime labels use future paths if carelessly reused; macro series vintage and publication lags, sample-dependent regime definitions, model proliferation and optimistic accuracy in imbalanced samples. do not equate higher classification accuracy with a profitabl", "sortRank": 1}, {"id": "cheng-liu-yao", "filename": "Cheng_Liu_Yao_v0.1.1.md", "title": "Tail Connectedness: Measuring the Network Connectedness of Equity Markets during Crises", "authors": "Tingting Cheng; Junli Liu; Wenying Yao", "year": "n.d.", "pubDate": "unverified", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["International connectedness"], "rawUrl": "https://drive.google.com/file/d/1QsZ0ADCTxOqf_R3HvgsMqtqYmkNXBSb9/view", "rawId": "1QsZ0ADCTxOqf_R3HvgsMqtqYmkNXBSb9", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1QsZ0ADCTxOqf_R3HvgsMqtqYmkNXBSb9/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a>. <strong>Authors:<\/strong> Tingting Cheng; Junli Liu; Wenying Yao. <strong>Year:<\/strong> n.d.. Draft pending human review; not independently replicated.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Research question:<\/strong> Can the paper&#x27;s identified downside-tail mechanism matter to risk management? <strong>Source-reported finding:<\/strong> Authors find crisis-state risk spillovers and changing U.S./China/Asia network roles (Abstract). <strong>Caution:<\/strong> The source results are not trading signals or OOS validation.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">The core mechanism is that adverse outcomes can behave differently from average market conditions. <strong>Analyst inference:<\/strong> A simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Uses quantile regression within a Diebold–Yilmaz network for 16 equity markets over 2005–2021. This is the authors&#x27; method, distinct from the proxy proposed under L5. Exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-based evidence<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors find crisis-state risk spillovers and changing U.S./China/Asia network roles (Abstract).<\/td><td>Abstract; introductory discussion<\/td><\/tr><tr><td>Independently verified experiment<\/td><td>None<\/td><td>Not run<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Value:<\/strong> Offers a testable downside-risk question. <strong>Concerns:<\/strong> Tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. Confirm exact sample and empirical figure details from the source before approving Q4.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Reduced-form question:<\/strong> Does the core downside-risk relationship survive a simpler point-in-time market-data test? Preserve the timing and conditional downside feature, but not necessarily all original equations.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Available inputs and trading/observation proxy:<\/strong> Construct rolling downside co-exceedance networks of synchronized country-index returns and compare connectivity during stress against a normal-regime baseline. <strong>Execution:<\/strong> Use only observations known as of decision time t; trade no earlier than a feasible next opportunity if a strategy is tested. Account for spreads, commissions, turnover, funding and missing market data. A forecasting-only test must not be presented as trading P&amp;L.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Hypothesis:<\/strong> The simplified downside indicator improves a tail outcome versus its predeclared simple baseline. <strong>Frozen baseline experiment:<\/strong> Construct rolling downside co-exceedance networks of synchronized country-index returns and compare connectivity during stress against a normal-regime baseline. <strong>Comparator:<\/strong> An unconditional historical rate, ordinary market beta, rolling volatility or unhedged benchmark, as appropriate to the specific dependent variable. Select before testing. <strong>Evaluation:<\/strong> Expanding/rolling training windows, strict chronological holdout, no future-informed thresholds, downside hit rates or expected shortfall, MaxDD, and if tradable after-cost results. <strong>Decision rule:<\/strong> Continue only if improvements persist out of sample, survive realistic trading frictions and at least one reasonable parameter perturbation; otherwise revise or stop this proxy (not the original theory). <strong>Status:<\/strong> Experiment specified but <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Not pursued in this batch; exact estimation requires full figure/equation inspection and source-specific data contracts.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\">Conceptually related to <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">AQR&#x27;s Tail Risk Hedging<\/a> as an additional dimension of tail-risk measurement, forecasting or hedging. This is a suggested connection, not a conclusion jointly established by authors.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported claim:<\/strong> Authors find crisis-state risk spillovers and changing U.S./China/Asia network roles (Abstract). <strong>Next falsifiable test:<\/strong> Run the frozen L5.C proxy using point-in-time data and transparent OOS accounting. <strong>Verdict:<\/strong> Research draft worth triage; pending review, no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/t
