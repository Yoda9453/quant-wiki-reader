ct sample and empirical figure details from the source before approving q4. ## l5 — practical research lab ### l5.a — core mechanism **reduced-form question:** does the core downside-risk relationship survive a simpler point-in-time market-data test? preserve the timing and conditional downside feature, but not necessarily all original equations. ### l5.b — practical implementation **available inputs and trading/observation proxy:** estimate whether prior-day large fx moves and a preannounced fomc indicator predict next-day large fx moves and whether a fixed carry-risk reduction rule lowers drawdowns. **execution:** use only ", "sortRank": 1}, {"id": "beutel-etal-2022", "filename": "Beutel_etal_2022_v0.1.1.md", "title": "The Global Financial Cycle and Macroeconomic Tail Risks", "authors": "Beutel, Metiu, Emter, Prieto & Schüler", "year": "2022", "pubDate": "2022", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Macro tail forecasting"], "rawUrl": "https://drive.google.com/file/d/1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX/view", "rawId": "1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Beutel, Metiu, Emter, Prieto &amp; Schüler <strong>Date/version:<\/strong> 2022; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Macro tail forecasting <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does lagged U.S. financial tightening forecast lower-tail foreign GDP growth more than median growth?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Left tail shifts more than median; fixed FX rates, FX exposures and private leverage worsen sensitivity (Abstract; Non-technical summary).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> U.S. financial tightening disproportionately worsens global downside growth outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Quantile VAR assesses growth-at-risk impacts from shocks to U.S. financial conditions and policy.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Left tail shifts more than median; fixed FX rates, FX exposures and private leverage worsen sensitivity (Abstract; Non-technical summary).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does lagged U.S. financial tightening forecast lower-tail foreign GDP growth more than median growth?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> U.S. financial tightening disproportionately worsens global downside growth outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Estimate expanding-window country quarterly 10% and 50% quantile regressions on lagged U.S. financial-conditions proxies; evaluate next-quarter quantile loss with publication-lag controls.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does lagged U.S. financial tightening forecast lower-tail foreign GDP growth more than median growth?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Estimate expanding-window country quarterly 10% and 50% quantile regressions on lagged U.S. financial-conditions proxies; evaluate next-quarter quantile loss with publication-lag controls.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Left tail shifts more than median; fixed FX rates, FX exposures and private leverage worsen sensitivity (Abstract; Non-technical summary).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1L2TPpXlw2NHXusrx7uxkHFuINEeZO1jX<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "the global financial cycle and macroeconomic tail risks beutel, metiu, emter, prieto & schüler tail risk macro tail forecasting # the global financial cycle and macroeconomic tail risks **authors:** beutel, metiu, emter, prieto & schüler **date/version:** 2022; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1l2tppxlw2nhxusrx7uxkhfuineezo1jx/view) **track:** macro tail forecasting **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** does lagged u.s. financial tightening forecast lower-tail foreign gdp growth more than median growth? **author-reported headline:** left tail shifts more than median; fixed fx rates, fx exposures and private leverage worsen sensitivity (abstract; non-technical summary). **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** u.s. financial tightening disproportionately worsens global downside growth outcomes. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** quantile var assesses growth-at-risk impacts from shocks to u.s. financial conditions and policy. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | left tail shifts more than median; fixed fx rates, fx exposures and private leverage worsen sensitivity (abstract; non-technical summary). | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the orig", "sortRank": 1}, {"id": "strub-trade-sizing-tail-risk-control", "filename": "Strub_Trade_Sizing_Tail_Risk_Control_v0.1.1.md", "title": "Trade Sizing Techniques for Drawdown and Tail Risk Control", "authors": "{}", "year": "unknown", "pubDate": "unknown", "version": "0.1.1", "primaryTopic": "Portfolio Construction & Tail Risk Control", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1DrQe-o2OoCj_BbI5vmcjuMBg7Ey--0nj/view", "rawId": "1DrQe-o2OoCj_BbI5vmcjuMBg7Ey--0nj", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1DrQe-o2OoCj_BbI5vmcjuMBg7Ey--0nj/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">The paper offers three risk-based trade-sizing approaches: historical volatility target, EVT-estimated conditional value at risk (CVaR), and EVT-estimated conditional drawdown at risk (CDaR). Historical examples include FX, the U.S. 10-year Treasury future and G10-currency basket strategies, with a roughly ten-year daily evaluation. Practical question: is tail-risk-aware sizing more useful than conventional volatility targeting?<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">Equal volatility need not imply equal exposure to catastrophic losses. Sizing on estimated loss tails or a drawdown distribution may reduce leverage ahead of riskier states, though sparse extremes make the forecasts noisy and can produce procyclical forced de-risking.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">The paper introduces a standard volatility-based scheme and EVT-based estimators for CVaR and CDaR, fitting Generalized Pareto tails to standardized returns. For CDaR it constructs a rolling drawdown distribution; it gives a 63-day-block example with a 95% drawdown-at-risk threshold and conditional tail mean. See Sections 2–4 and the CVaR / drawdown definitions. Exact risk target, filter specification and optimized windows require focused verification.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Abstract: three sizing algorithms and applications to approximately 10 years of daily strategy returns across named FX/Treasury instruments.<\/li><li>Paper formally distinguishes distribution of single-period losses (CVaR) from distribution of drawdowns (CDaR).<\/li><li>Precise relative performance statistics are <strong>pending exhibit verification<\/strong>; do not fabricate a winning method.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Directly relevant to asset-allocation overlays. EVT tail parameters are unstable with limited exceedances; overlapping drawdown blocks are dependent. Volatility shocks trigger deleveraging after rather than before losses. Compare equal ex-ante risk budgets, cap leverage, and account for turnover and funding.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> At equal typical volatility, strategies with fatter recent loss tails may benefit from smaller positions; a tail-risk scaler should improve realized tail loss more than a pure-vol scaler.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Apply overlay weights to an existing daily strategy return series. Estimate rolling 63-day volatility, 252-day historical 5% expected shortfall, and a 252-day 63-day drawdown statistic as reduced-form, <em>not exact EVT<\/em>, candidates. Set fixed target risk and maximum gross exposure 1.0 or 1.5, with cash earning a stated rate. Weights computed at close t apply no earlier than next feasible execution; costs on weight changes.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: historical-ES and drawdown-based risk scalers do not improve OOS max drawdown/ES over rolling vol targeting under matched average exposure. Freeze 63/252 windows, 5% tail cutoff, gross cap 1.0, one-way 5/10 bps costs. Use monthly rebalance and next-close execution, no look-ahead. Compare same raw strategy: unscaled, 10% vol target, 5% ES target and 63-day drawdown-risk target; equalize average gross or long-run volatility only on training data, not using future full-sample stats. Report CAGR, CVaR, MaxDD, realized exposure, turnover and crisis losses. Continue if robust OOS downside advantage survives cost and lookback sensitivity; stop proxy if extreme-estimate noise dominates. Then consider GPD/EVT as complexity step.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Exact paper replication of filtered EVT residuals and GPD extrapolation optional, after reduced-form benefit is evident.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> The paper offers three risk-based trade-sizing approaches: historical volatility target, EVT-estimated conditional value at risk (CVaR), and EVT-estimated conditional drawdown at risk (CDaR).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Metadata/tags exist; search-index retrieval not yet tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Core question and findings present; human reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form protocol proposed; second-analyst specification review pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source sections indicated; exhibit/page image confirmation pending for quantitative material<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1DrQe-o2OoCj_BbI5vmcjuMBg7Ey--0nj<\/code>.<\/li><li>Draft generated under Schema v0.1.1 on 2026-10-24.<\/li><li>Figures and parameter choices in L5 are <strong>researcher proposals<\/strong> unless clearly identified as paper content. No tests were executed.<\/li><\/ul>"}], "searchText": "trade sizing techniques for drawdown and tail risk control {} portfolio construction & tail risk control # trade sizing techniques for drawdown and tail risk control **source:** [original pdf](https://drive.google.com/file/d/1drqe-o2oocj_bbi5vmcjumbg7ey--0nj/view) · **research status:** draft, pending human review. this card is source-based but not a full academic replication. ## l0 — research in one minute the paper offers three risk-based trade-sizing approaches: historical volatility target, evt-estimated conditional value at risk (cvar), and evt-estimated conditional drawdown at risk (cdar). historical examples include fx, the u.s. 10-year treasury future and g10-currency basket strategies, with a roughly ten-year daily evaluation. practical question: is tail-risk-aware sizing more useful than conventional volatility targeting? ## l1 — economic intuition equal volatility need not imply equal exposure to catastrophic losses. sizing on estimated loss tails or a drawdown distribution may reduce leverage ahead of riskier states, though sparse extremes make the forecasts noisy and can produce procyclical forced de-risking. ## l2 — model construction the paper introduces a standard volatility-based scheme and evt-based estimators for cvar and cdar, fitting generalized pareto tails to standardized returns. for cdar it constructs a rolling drawdown distribution; it gives a 63-day-block example with a 95% drawdown-at-risk threshold and conditional tail mean. see sections 2–4 and the cvar / drawdown definitions. exact risk target, filter specification and optimized windows require focused verification. ## l3 — empirical findings **author-reported; not independently verified:** - abstract: three sizing algorithms and applications to approximately 10 years of daily strategy returns across named fx/treasury instruments. - paper formally distinguishes distribution of single-period losses (cvar) from distribution of drawdowns (cdar). - precise relative performance statistics are **pending exhibit verification**; do not fabricate a winning method. ## l4 — research evaluation directly relevant to asset-allocation overlays. evt tail parameters are unstable with limited exceedances; overlapping drawdown blocks are dependent. volatility shocks trigger deleveraging after rather than before losses. compare equal ex-ante risk budgets, cap leverage, and account for turnover and funding. ## l5 — practical research lab ### l5.a — core mechanism **falsifiable analyst hypothesis:** at equal typical volatility, strategies with fatter recent loss tails may benefit from smaller ", "sortRank": 1}, {"id": "luo-2011", "filename": "Luo_2011_v0.1.1.md", "title": "VIX Futures and the Hedging of Bond Portfolios", "authors": "Frank Luo", "year": "2011", "pubDate": "2011", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Hedging / credit"], "rawUrl": "https://drive.google.com/file/d/1FT6NoPqna5vdC4UAHzX4hU7YSHk0f6R4/view", "rawId": "1FT6NoPqna5vdC4UAHzX4hU7YSHk0f6R4", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Frank Luo <strong>Date/version:<\/strong> 2011; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1FT6NoPqna5vdC4UAHzX4hU7YSHk0f6R4/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Hedging / credit <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Is VIX-futures exposure more useful against credit drawdowns than safe-government-bond drawdowns?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Strongest hedging case for EM bond losses; reported protection on 21 of 25 worst EM bond days; limited treasury/muni diversification (Executive summary).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> VIX futures are not equally useful for every bond sector.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Analyzes S&amp;P 500 VIX futures index strategies across government, municipal, investment-grade, HY and EM bonds.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Strongest hedging case for EM bond losses; reported protection on 21 of 25 worst EM bond days; limited treasury/muni diversification (Executive summary).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Is VIX-futures exposure more useful against credit drawdowns than safe-government-bond drawdowns?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> VIX futures are not equally useful for every bond sector.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Overlay fixed 5% VIX-futures total-return allocation on TLT, LQD, HYG and EMB; compare conditional worst-5%-day payoff, carry and whole-portfolio drawdowns.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Is VIX-futures exposure more useful against credit drawdowns than safe-government-bond drawdowns?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Overlay fixed 5% VIX-futures total-return allocation on TLT, LQD, HYG and EMB; compare conditional worst-5%-day payoff, carry and whole-portfolio drawdowns.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Strongest hedging case for EM bond losses; reported protection on 21 of 25 worst EM bond days; limited treasury/muni diversification (Executive summary).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "h     const CATEGORIES = [
      { id: "ALL", label: "全部" },
      { id: "Tail Risk", label: "Tail Risk" },
      { id: "Trend & Momentum", label: "Trend & Momentum" },
      { id: "ML & Portfolio", label: "ML & Portfolio" },
      { id: "StatArb & Topics", label: "StatArb / Topic" },
      { id: "SAVED", label: "★ 收藏" }
    ];

    const THEMES = [
      { id: "light", label: "淺色" },
      { id: "sepia", label: "護眼" },
      { id: "dark", label: "深色" }
    ];

    const FONTS = [
      { id: "sm", label: "A 小" },
      { id: "md", label: "A 中" },
      { id: "lg", label: "A 大" }
    ];

    function safeLoad(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSave(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    const state = {
      activeId: WIKI_DOCS[0] ? WIKI_DOCS[0].id : "",
      category: "ALL",
      query: "",
      theme: safeLoad("qrv_theme", "light"),
      font: safeLoad("qrv_font", "md"),
      quickScan: safeLoad("qrv_quickscan", false),
      bookmarks: new Set(safeLoad("qrv_bookmarks", [])),
      readIds: new Set(safeLoad("qrv_read", []))
    };

    // DOM refs
    const els = {
      menuBtn: document.getElementById("menuBtn"),
      closeDrawerBtn: document.getElementById("closeDrawerBtn"),
      drawerBackdrop: document.getElementById("drawerBackdrop"),
      sidebar: document.getElementById("sidebar"),
      searchInput: document.getElementById("searchInput"),
      categoryPills: document.getElementById("categoryPills"),
      paperList: document.getElementById("paperList"),
      listCountText: document.getElementById("listCountText"),
      readProgressText: document.getElementById("readProgressText"),
      totalBadge: document.getElementById("totalBadge"),
      fontBtn: document.getElementById("fontBtn"),
      themeBtn: document.getElementById("themeBtn"),
      bookmarkBtn: document.getElementById("bookmarkBtn"),
      bookmarkIcon: document.getElementById("bookmarkIcon"),
      jumpPills: document.getElementById("jumpPills"),
      scanModeBtn: document.getElementById("scanModeBtn"),
      readerArticle: document.getElementById("readerArticle"),
      prevPaperBtn: document.getElementById("prevPaperBtn"),
      nextPaperBtn: document.getElementById("nextPaperBtn"),
      prevPaperTitle: document.getElementById("prevPaperTitle"),
      nextPaperTitle: document.getElementById("nextPaperTitle"),
      toast: document.getElementById("toast")
    };

    let toastTimer = null;
    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.remove("opacity-0");
      els.toast.classList.add("opacity-100");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.remove("opacity-100");
        els.toast.classList.add("opacity-0");
      }, 1700);
    }

    function openDrawer() {
      els.sidebar.classList.remove("-translate-x-full");
      els.drawerBackdrop.classList.remove("hidden");
    }

    function closeDrawer() {
      els.sidebar.classList.add("-translate-x-full");
      els.drawerBackdrop.classList.add("hidden");
    }

    function applyPrefs() {
      document.documentElement.setAttribute("data-theme", state.theme);
      document.documentElement.setAttribute("data-font", state.font);
      const tObj = THEMES.find((t) => t.id === state.theme) || THEMES[0];
      const fObj = FONTS.find((f) => f.id === state.font) || FONTS[1];
      els.themeBtn.textContent = tObj.label;
      els.fontBtn.textContent = fObj.label;
      els.scanModeBtn.textContent = state.quickScan ? "展開全文" : "通勤速讀";
    }

    function getFilteredDocs() {
      const q = state.query.trim().toLowerCase();
      return WIKI_DOCS.filter((doc) => {
        if (state.category === "SAVED" && !state.bookmarks.has(doc.id)) return false;
        if (state.category !== "ALL" && state.category !== "SAVED" && doc.category !== state.category) return false;
        if (q && !doc.searchText.includes(q)) return false;
        return true;
      });
    }

    function renderCategories() {
      els.categoryPills.innerHTML = CATEGORIES.map((cat) => {
        const isActive = state.category === cat.id;
        return `<button type="button" data-cat="${cat.id}" class="pill shrink-0 text-xs px-2.5 py-1 rounded-full transition ${isActive ? "active" : ""}">${cat.label}</button>`;
      }).join("");
    }

    function renderPaperList() {
      const filtered = getFilteredDocs();
      els.listCountText.textContent = `顯示 ${filtered.length} / ${WIKI_DOCS.length} 篇`;
      els.readProgressText.textContent = `已讀 ${state.readIds.size} / ${WIKI_DOCS.length}`;
      els.totalBadge.textContent = String(WIKI_DOCS.length);

      if (!filtered.length) {
        els.paperList.innerHTML = `<div class="p-6 text-center text-xs" style="color: var(--text-muted);">找不到符合條件的論文</div>`;
        return;
      }

      els.paperList.innerHTML = filtered.map((doc) => {
        const isActive = doc.id === state.activeId;
        const isStarred = state.bookmarks.has(doc.id);
        const isRead = state.readIds.has(doc.id);
        return `
          <button type="button" data-doc-id="${doc.id}"
            class="paper-item w-full text-left p-2.5 rounded-xl block ${isActive ? "active" : ""}">
            <div class="flex items-start justify-between gap-1.5">
              <span class="text-sm font-semibold leading-snug line-clamp-2">${escapeHtml(doc.title)}</span>
              ${isStarred ? '<span class="text-amber-500 text-xs shrink-0">★</span>' : ""}
            </div>
            <div class="mt-1 flex items-center gap-1.5 flex-wrap text-xs" style="color: var(--text-muted);">
              <span class="truncate max-w-[175px]">${escapeHtml(doc.authors)}</span>
              <span>·</span>
              <span>${escapeHtml(doc.year)}</span>
              ${isRead ? '<span class="ml-auto text-[10px] px-1.5 py-0.5 rounded" style="background: var(--surface-alt);">已讀</span>' : ""}
            </div>
          </button>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function updateBookmarkBtn() {
      const starred = state.bookmarks.has(state.activeId);
      els.bookmarkBtn.style.color = starred ? "#f59e0b" : "var(--text-muted)";
      els.bookmarkIcon.setAttribute("fill", starred ? "currentColor" : "none");
    }

    function renderMathSafe(container) {
      if (typeof renderMathInElement === "function") {
        try {
          renderMathInElement(container, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\[", right: "\]", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
        } catch (e) {}
      }
    }

    function renderActiveDoc(scrollToTop) {
      const doc = WIKI_DOCS.find((d) => d.id === state.activeId) || WIKI_DOCS[0];
      if (!doc) return;
      state.activeId = doc.id;
      state.readIds.add(doc.id);
      safeSave("qrv_read", Array.from(state.readIds));
      safeSave("qrv_last_id", doc.id);

      if (window.location.hash !== "#" + doc.id) {
        try {
          history.replaceState(null, "", "#" + doc.id);
        } catch (e) {}
      }

      updateBookmarkBtn();

      // Jump pills
      els.jumpPills.innerHTML = doc.sections.map((sec) => {
        return `<button type="button" data-jump="${sec.id}" class="pill shrink-0 text-xs px-2.5 py-1 rounded-lg transition hover:opacity-85">${escapeHtml(sec.label)}</button>`;
      }).join("");

      const tagsHtml = doc.tags.map((t) =>
        `<span class="text-[11px] px-2 py-0.5 rounded-full" style="background: var(--surface-alt); color: var(--text-muted);">${escapeHtml(t)}</span>`
      ).join("");

      const qcBadge = doc.qcTotal > 0
        ? `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium" style="background: var(--surface-alt); color: var(--text-muted);">QC ${doc.qcPass}/${doc.qcTotal}</span>`
        : "";

      const pdfBtn = doc.rawUrl
        ? `<a href="${escapeHtml(doc.rawUrl)}" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-xl transition active:scale-95"
             style="background: var(--accent); color: #ffffff;">
             開啟原始 PDF (Drive) ↗
           </a>`
        : "";

      const sectionsHtml = doc.sections.map((sec) => {
        const collapsed = state.quickScan && !sec.isCore;
        return `
          <section id="${sec.id}" class="sec-card ${collapsed ? "collapsed" : ""}">
            <button type="button" class="sec-header" data-toggle-sec="${sec.id}">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-xs font-bold px-2 py-0.5 rounded-md shrink-0"
                  style="background: var(--accent-soft); color: var(--accent-text);">${escapeHtml(sec.label)}</span>
                <span class="font-bold text-sm sm:text-base truncate">${escapeHtml(sec.heading)}</span>
              </div>
              <svg class="sec-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="sec-content article-body">${sec.html}</div>
          </section>
        `;
      }).join("");

      els.readerArticle.innerHTML = `
        <div class="card rounded-2xl p-4 sm:p-5 mb-4">
          <div class="flex items-center gap-1.5 flex-wrap mb-2">
            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full"
              style="background: var(--accent-soft); color: var(--accent-text);">${escapeHtml(doc.primaryTopic)}</span>
            <span class="text-[11px] px-2 py-0.5 rounded-full"
              style="background: var(--surface-alt); color: var(--text-muted);">${doc.isTopicWiki ? "Topic Wiki" : "Paper Wiki"}</span>
            ${qcBadge}
          </div>
          <h1 class="text-xl sm:text-2xl font-bold leading-snug tracking-tight mb-2">${escapeHtml(doc.title)}</h1>
          <div class="text-xs sm:text-sm mb-3" style="color: var(--text-muted);">
            <span class="font-medium">${escapeHtml(doc.authors)}</span>
            <span class="mx-1.5">·</span>
            <span>${escapeHtml(doc.year)}</span>
            ${doc.version ? `<span class="mx-1.5">·</span><span>${escapeHtml(doc.version)}</span>` : ""}
          </div>
          ${tagsHtml ? `<div class="flex flex-wrap gap-1.5 mb-3">${tagsHtml}</div>` : ""}
          <div class="flex items-center gap-2 flex-wrap pt-2 border-t" style="border-color: var(--border);">
            ${pdfBtn}
            <span class="text-[11px] ml-auto" style="color: var(--text-muted);">${escapeHtml(doc.filename)}</span>
          </div>
        </div>
        ${doc.introHtml ? `<div class="card rounded-2xl p-4 mb-4 article-body">${doc.introHtml}</div>` : ""}
        <div>${sectionsHtml}</div>
      `;

      renderMathSafe(els.readerArticle);
      updatePrevNext();
      renderPaperList();

      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function updatePrevNext() {
      const list = getFilteredDocs();
      const idx = list.findIndex((d) => d.id === state.activeId);
      const prev = idx > 0 ? list[idx - 1] : null;
      const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;

      els.prevPaperBtn.disabled = !prev;
      els.prevPaperBtn.dataset.targetId = prev ? prev.id : "";
      els.prevPaperTitle.textContent = prev ? prev.title : "已到第一篇";

      els.nextPaperBtn.disabled = !next;
      els.nextPaperBtn.dataset.targetId = next ? next.id : "";
      els.nextPaperTitle.textContent = next ? next.title : "已到最後一篇";
    }

    // Event Listeners
    els.menuBtn.addEventListener("click", openDrawer);
    els.closeDrawerBtn.addEventListener("click", closeDrawer);
    els.drawerBackdrop.addEventListener("click", closeDrawer);

    els.searchInput.addEventListener("input", (e) => {
      state.query = e.target.value;
      renderPaperList();
      updatePrevNext();
    });

    els.categoryPills.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-cat]");
      if (!btn) return;
      state.category = btn.dataset.cat;
      renderCategories();
      renderPaperList();
      updatePrevNext();
    });

    els.paperList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-doc-id]");
      if (!btn) return;
      state.activeId = btn.dataset.docId;
      renderActiveDoc(true);
      closeDrawer();
    });

    els.jumpPills.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-jump]");
      if (!btn) return;
      const sec = document.getElementById(btn.dataset.jump);
      if (sec) {
        sec.classList.remove("collapsed");
        sec.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    els.readerArticle.addEventListener("click", (e) => {
      const hdr = e.target.closest("[data-toggle-sec]");
      if (!hdr) return;
      const sec = document.getElementById(hdr.dataset.toggleSec);
      if (sec) sec.classList.toggle("collapsed");
    });

    els.scanModeBtn.addEventListener("click", () => {
      state.quickScan = !state.quickScan;
      safeSave("qrv_quickscan", state.quickScan);
      applyPrefs();
      renderActiveDoc(false);
      showToast(state.quickScan ? "已切換通勤速讀（僅展開 L0–L1）" : "已展開全部章節");
    });

    els.themeBtn.addEventListener("click", () => {
      const idx = THEMES.findIndex((t) => t.id === state.theme);
      state.theme = THEMES[(idx + 1) % THEMES.length].id;
      safeSave("qrv_theme", state.theme);
      applyPrefs();
      const label = THEMES.find((t) => t.id === state.theme).label;
      showToast(`已切換「${label}」模式`);
    });

    els.fontBtn.addEventListener("click", () => {
      const idx = FONTS.findIndex((f) => f.id === state.font);
      state.font = FONTS[(idx + 1) % FONTS.length].id;
      safeSave("qrv_font", state.font);
      applyPrefs();
    });

    els.bookmarkBtn.addEventListener("click", () => {
      if (state.bookmarks.has(state.activeId)) {
        state.bookmarks.delete(state.activeId);
        showToast("已取消收藏");
      } else {
        state.bookmarks.add(state.activeId);
        showToast("已加入收藏 ★");
      }
      safeSave("qrv_bookmarks", Array.from(state.bookmarks));
      updateBookmarkBtn();
      renderPaperList();
      updatePrevNext();
    });

    els.prevPaperBtn.addEventListener("click", () => {
      const id = els.prevPaperBtn.dataset.targetId;
      if (id) {
        state.activeId = id;
        renderActiveDoc(true);
      }
    });

    els.nextPaperBtn.addEventListener("click", () => {
      const id = els.nextPaperBtn.dataset.targetId;
      if (id) {
        state.activeId = id;
        renderActiveDoc(true);
      }
    });

    window.addEventListener("hashchange", () => {
      const hashId = window.location.hash.replace(/^#/, "");
      if (hashId && WIKI_DOCS.some((d) => d.id === hashId) && hashId !== state.activeId) {
        state.activeId = hashId;
        renderActiveDoc(true);
      }
    });

    // Init
    window.addEventListener("DOMContentLoaded", () => {
      applyPrefs();
      const hashId = window.location.hash.replace(/^#/, "");
      const savedId = safeLoad("qrv_last_id", "");
      if (hashId && WIKI_DOCS.some((d) => d.id === hashId)) {
        state.activeId = hashId;
      } else if (savedId && WIKI_DOCS.some((d) => d.id === savedId)) {
        state.activeId = savedId;
      }
      renderCategories();
      renderActiveDoc(false);
    });

    window.addEventListener("load", () => {
      renderMathSafe(els.readerArticle);
    });
  </script>
