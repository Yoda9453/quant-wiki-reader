<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" data-font="md">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Quant Vault" />
  <title>Quant Research Vault — Mobile Wiki Reader</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-text: #1d4ed8;
      --code-bg: #f1f5f9;
      --quote-bg: #f8fafc;
      --quote-border: #3b82f6;
      --font-body: 16px;
      --line-body: 1.72;
    }
    html[data-theme="sepia"] {
      --bg: #f5efe6;
      --surface: #fbf7f0;
      --surface-alt: #ede4d5;
      --border: #dfd3c0;
      --text: #2c241b;
      --text-muted: #665847;
      --accent: #9a5b13;
      --accent-soft: #f3e6d3;
      --accent-text: #7c470b;
      --code-bg: #eee5d6;
      --quote-bg: #f3ebde;
      --quote-border: #b4691a;
    }
    html[data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-alt: #1e293b;
      --border: #263348;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #60a5fa;
      --accent-soft: #172554;
      --accent-text: #93c5fd;
      --code-bg: #1e293b;
      --quote-bg: #151f32;
      --quote-border: #60a5fa;
    }
    html[data-font="sm"] { --font-body: 14.5px; --line-body: 1.65; }
    html[data-font="md"] { --font-body: 16px; --line-body: 1.72; }
    html[data-font="lg"] { --font-body: 18px; --line-body: 1.8; }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; background: var(--bg); color: var(--text); }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .pill {
      background: var(--surface-alt);
      color: var(--text-muted);
      border: 1px solid transparent;
    }
    .pill.active {
      background: var(--accent-soft);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 600;
    }
    .paper-item {
      border: 1px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .paper-item:hover {
      background: var(--surface-alt);
    }
    .paper-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    /* Article Typography */
    .article-body {
      font-size: var(--font-body);
      line-height: var(--line-body);
      color: var(--text);
      word-break: break-word;
    }
    .wiki-p { margin: 0 0 0.9rem 0; }
    .wiki-h3 {
      font-size: 1.06em;
      font-weight: 700;
      margin: 1.25rem 0 0.5rem 0;
      color: var(--text);
    }
    .wiki-h4 {
      font-size: 0.98em;
      font-weight: 700;
      margin: 1rem 0 0.4rem 0;
      color: var(--text-muted);
    }
    .wiki-ul, .wiki-ol {
      margin: 0 0 0.95rem 0;
      padding-left: 1.35rem;
    }
    .wiki-ul { list-style-type: disc; }
    .wiki-ol { list-style-type: decimal; }
    .wiki-ul li, .wiki-ol li { margin-bottom: 0.45rem; }
    .wiki-ul li.sub-li { margin-left: 1rem; list-style-type: circle; }
    .wiki-quote {
      margin: 0.9rem 0;
      padding: 0.75rem 1rem;
      background: var(--quote-bg);
      border-left: 3px solid var(--quote-border);
      border-radius: 0 0.5rem 0.5rem 0;
      color: var(--text-muted);
      font-size: 0.95em;
    }
    .wiki-hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }
    .article-body code {
      background: var(--code-bg);
      padding: 0.12rem 0.36rem;
      border-radius: 0.3rem;
      font-size: 0.86em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .code-block {
      background: var(--code-bg);
      padding: 0.85rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      font-size: 0.85em;
      margin: 0.9rem 0;
    }
    .math-block {
      overflow-x: auto;
      padding: 0.6rem 0.25rem;
      margin: 0.75rem 0;
      text-align: center;
    }
    .wiki-link {
      color: var(--accent-text);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0.9rem 0;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
    }
    .wiki-table {
      width: 100%;
      min-width: 480px;
      border-collapse: collapse;
      font-size: 0.88em;
      line-height: 1.5;
    }
    .wiki-table th {
      background: var(--surface-alt);
      color: var(--text);
      font-weight: 600;
      text-align: left;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .wiki-table td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .wiki-table tr:last-child td { border-bottom: none; }

    /* Hide scrollbar on horizontal pill strips */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Section accordion */
    .sec-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      margin-bottom: 0.85rem;
      overflow: hidden;
      scroll-margin-top: 112px;
    }
    .sec-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.85rem 1rem;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
    }
    .sec-header:hover { background: var(--surface-alt); }
    .sec-chevron {
      transition: transform 0.2s ease;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .sec-card.collapsed .sec-chevron { transform: rotate(-90deg); }
    .sec-card.collapsed .sec-content { display: none; }
    .sec-content {
      padding: 0.15rem 1rem 1rem 1rem;
      border-top: 1px solid var(--border);
    }

    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Sticky Top Bar -->
  <header class="topbar sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <button id="menuBtn" type="button" aria-label="開啟目錄"
          class="lg:hidden inline-flex items-center justify-center w-10 h-10 rounded-xl border border-transparent hover:opacity-80 active:scale-95 transition"
          style="background: var(--surface-alt); color: var(--text);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="17" x2="20" y2="17"></line>
          </svg>
        </button>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-bold text-base tracking-tight truncate">Quant Vault</span>
            <span id="totalBadge" class="text-xs px-2 py-0.5 rounded-full font-medium shrink-0"
              style="background: var(--accent-soft); color: var(--accent-text);">26</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="fontBtn" type="button" title="切換字體大小"
          class="h-9 px-2.5 rounded-xl text-xs font-semibold transition active:scale-95"
          style="background: var(--surface-alt); color: var(--text);">A 中</button>
        <button id="themeBtn" type="button" title="切換閱讀主題"
          class="h-9 px-2.5 rounded-xl text-xs font-semibold transition active:scale-95"
          style="background: var(--surface-alt); color: var(--text);">淺色</button>
        <button id="bookmarkBtn" type="button" title="收藏此篇"
          class="h-9 w-9 inline-flex items-center justify-center rounded-xl transition active:scale-95"
          style="background: var(--surface-alt); color: var(--text-muted);" aria-label="收藏此篇">
          <svg id="bookmarkIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer Backdrop -->
  <div id="drawerBackdrop" class="fixed inset-0 bg-black/45 z-40 hidden lg:hidden"></div>

  <!-- Main Shell -->
  <div class="max-w-7xl w-full mx-auto flex-1 flex relative">
    <!-- Sidebar / Mobile Drawer -->
    <aside id="sidebar"
      class="sidebar fixed lg:sticky top-0 lg:top-14 left-0 z-50 lg:z-20 h-full lg:h-[calc(100vh-3.5rem)] w-[86vw] max-w-sm lg:w-80 shrink-0 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out">
      <div class="p-3 border-b flex items-center justify-between lg:hidden" style="border-color: var(--border);">
        <span class="font-bold text-sm">Wiki 論文目錄</span>
        <button id="closeDrawerBtn" type="button" aria-label="關閉目錄"
          class="w-8 h-8 rounded-lg inline-flex items-center justify-center"
          style="background: var(--surface-alt); color: var(--text);">✕</button>
      </div>

      <!-- Search -->
      <div class="p-3 border-b space-y-2.5" style="border-color: var(--border);">
        <div class="relative">
          <input id="searchInput" type="search" placeholder="搜尋論文標題、作者、方法..."
            class="w-full h-10 pl-9 pr-3 rounded-xl text-sm outline-none border"
            style="background: var(--surface-alt); border-color: var(--border); color: var(--text);" />
          <svg class="absolute left-3 top-2.5 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" style="color: var(--text-muted);">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <!-- Category Filter Pills -->
        <div id="categoryPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
      </div>

      <!-- Paper List -->
      <div id="paperList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>

      <div class="px-3 py-2 text-xs border-t flex items-center justify-between" style="border-color: var(--border); color: var(--text-muted);">
        <span id="listCountText">顯示 26 篇</span>
        <span id="readProgressText">已讀 0 / 26</span>
      </div>
    </aside>

    <!-- Main Reader Area -->
    <main class="flex-1 min-w-0 flex flex-col">
      <!-- Sticky Section Jump Bar -->
      <div id="jumpBarWrap" class="sticky top-14 z-30 border-b px-3 sm:px-6 py-2 flex items-center justify-between gap-2"
        style="background: var(--bg); border-color: var(--border);">
        <div id="jumpPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
        <button id="scanModeBtn" type="button"
          class="shrink-0 text-xs font-semibold px-2.5 py-1.5 rounded-lg border transition active:scale-95"
          style="background: var(--surface); border-color: var(--border); color: var(--accent-text);">
          通勤速讀
        </button>
      </div>

      <!-- Article Container -->
      <article id="readerArticle" class="w-full max-w-3xl mx-auto px-3.5 sm:px-6 py-4 sm:py-6 flex-1">
        <!-- Rendered dynamically -->
      </article>

      <!-- Bottom Prev / Next Bar -->
      <nav class="w-full max-w-3xl mx-auto px-3.5 sm:px-6 pb-8 pt-2">
        <div class="grid grid-cols-2 gap-2.5">
          <button id="prevPaperBtn" type="button"
            class="card rounded-xl p-3 text-left transition active:scale-[0.99] disabled:opacity-40">
            <div class="text-xs mb-0.5" style="color: var(--text-muted);">← 上一篇</div>
            <div id="prevPaperTitle" class="text-xs sm:text-sm font-semibold line-clamp-1">—</div>
          </button>
          <button id="nextPaperBtn" type="button"
            class="card rounded-xl p-3 text-right transition active:scale-[0.99] disabled:opacity-40">
            <div class="text-xs mb-0.5" style="color: var(--text-muted);">下一篇 →</div>
            <div id="nextPaperTitle" class="text-xs sm:text-sm font-semibold line-clamp-1">—</div>
          </button>
        </div>
      </nav>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-xs font-semibold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"
    style="background: var(--text); color: var(--bg);"></div>

  <script>
    const WIKI_DOCS = [{"id": "halperin_2026_omd_three_matrices", "filename": "Halperin__2026__Paper_Wiki__L0-L7_.md", "title": "Are Three Matrices All You Need To Beat the Market? Observable Matrix Dynamics for Portfolio Optimization", "authors": "Igor Halperin", "year": "2026", "pubDate": "2026-07-31", "version": "arXiv:2607.27461v1 (29 Jul 2026)", "primaryTopic": "Portfolio Construction & Matrix Dynamics", "category": "ML & Portfolio", "isTopicWiki": false, "tags": ["Markov Chains", "Information Theory", "Covariance Alternatives", "S&P 500 Equities", "Geodesic Distance Matrix", "Markov Transition Matrix"], "rawUrl": "https://drive.google.com/file/d/1efnRNT60fAbi9UK8hJkWO9itYLI7kJmv/view", "rawId": "1efnRNT60fAbi9UK8hJkWO9itYLI7kJmv", "status": "carded", "reviewStatus": "pending_review", "qcPass": 2, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Can dynamic equity portfolio optimization beat the S&amp;P 500, minimum-variance, and maximum-diversification benchmarks using <em>only<\/em> daily prices, volumes, and market caps—represented by three fixed-size matrices with <strong>no covariance matrix inversion<\/strong> and <strong>no black-box ML<\/strong>? <em>(pp. 1–3)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Yes. Replacing Markowitz&#x27;s $(\\mu, \\Sigma)$ with (1) an arccos correlation-distance matrix and (2–3) two covariate-conditioned Markov transition matrices for monthly return ranks and volatility ranks reveals that <strong>volatility rank is forecastable one step ahead while return rank is nearly unforecastable<\/strong> <em>(pp. 1, 4)<\/em>. Blending a market-neutral momentum long-short sleeve with an opportunistic long-only sleeve beats the market on two non-overlapping OOS windows—<strong>Jan 2022–Dec 2024<\/strong> (Sharpe <strong>1.06<\/strong> vs. market <strong>0.78<\/strong>) and <strong>Jan 2025–Jul 2026<\/strong> (Sharpe <strong>1.32<\/strong> vs. market <strong>1.14<\/strong>), net of 5 bps trading cost <em>(p. 1)<\/em>. Adding residual-distance diversification lifts Sharpe to <strong>1.08<\/strong> and <strong>1.44<\/strong> (annualized returns <strong>20%<\/strong> and <strong>56%<\/strong>) <em>(p. 1)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> Both OOS windows are very short (3 years and 1.5 years, totaling 4.5 years—primarily a concentrated mega-cap/momentum-friendly equity regime), and the paper&#x27;s footnote discloses that all code, numerical analysis, and manuscript preparation were executed by an AI assistant under author supervision <em>(p. 1 fn.)<\/em>. Exact sleeve-blending weights, drawdown numbers, and full benchmark tables require full-PDF verification before coding.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> Classical Markowitz optimization fails out-of-sample because raw return means are noisy and inverting sample covariance matrices amplifies estimation error. Converting correlations into a <strong>geodesic distance matrix<\/strong> ($M_{ij} = \\arccos G_{ij}$) and raw returns/volatilities into <strong>ordinal decile ranks<\/strong> ($1 \\dots 10$) makes the state representation outlier-robust and market-neutral by construction <em>(pp. 3–5)<\/em>. Conditioning the two Markov chains on market covariates (size, beta, Amihud illiquidity, momentum, reversal, multi-horizon volatility, plus 3 distance-matrix network features) via log-linear conditional logit reveals strong directional &quot;arrow of time&quot; (entropy production) in risk descriptors, making next-month volatility rank predictable even though return rank remains mostly noisy <em>(pp. 3–4)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> Stripping away the physics/information-theory framing (entropy production, transfer entropy, random distance matrices), the investable engine rests on three well-known practitioner pillars: (1) <strong>cross-sectional volatility is persistent and forecastable<\/strong>, whereas raw returns are noisy; (2) <strong>rank-based / correlation-distance diversification<\/strong> avoids unstable $\\Sigma^{-1}$ inversions (conceptually akin to Hierarchical Risk Parity); and (3) <strong>regime-blending a market-neutral momentum sleeve with a directional long sleeve<\/strong> using recent market return sign captures upside beta in bull regimes while dampening drawdowns.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li><strong>Universe &amp; Data:<\/strong> S&amp;P 500 constituents (daily prices, trading volumes, market caps; variable $N &lt; 500$ held fixed per lookback $L \\in [6\\text{m}, 2\\text{y}]$ such that $N/L \\gtrsim 1$, both $&gt; 100$) <em>(pp. 1, 5)<\/em>. In-sample calibration: <strong>2018–2021<\/strong>; OOS 1: <strong>Jan 2022–Dec 2024<\/strong>; clean forward OOS 2: <strong>Jan 2025–Jul 2026<\/strong> <em>(pp. 1, 4)<\/em>.<\/li><li>**Matrix 1 — Geodesic Correlation-Distance Matrix <em>(pp. 4–5, Eq. 1)<\/em>:<strong> $$M_{ij}(t) = \\arccos G_{ij}(t), \\quad G_{ij}(t) = \\frac{C_{ij}(t)}{\\sqrt{C_{ii}(t) C_{jj}(t)}} \\in [-1, 1], \\quad M_{ij} \\in [0, \\pi]$$ where $C(t)$ is the trailing $L$-day Pearson correlation matrix ($M_{ii}=0$, orthogonal $= \\pi/2$, anticorrelated $= \\pi$). Enters the pipeline three times: (1) leading eigenvector, row-mean centrality, and transfer-entropy lead-lag score as covariates; (2) market-mode-removed <\/strong>residual distance matrix<strong> to diversify the long sleeve; (3) transfer-entropy <\/strong>information-leader long-short overlay** to insure the market-neutral sleeve <em>(p. 3)<\/em>.<\/li><li>**Matrices 2 &amp; 3 — Return-Rank and Volatility-Rank Markov Chains <em>(p. 5, Eqs. 2–3)<\/em>:**<\/li><li class=\"sub-li\">Trailing mean return $\\bar{r}_i(t) = \\frac{1}{\\tau_R} \\sum_{s=t-\\tau_R+1}^t r_i(s)$ (rank 1 = highest return) and trailing realized volatility $\\bar{v}_i(t)$ over $\\tau_V$ (rank 1 = lowest volatility).<\/li><li class=\"sub-li\">Coarse-grained into $K=10$ equal cross-sectional deciles: $c_i(t) = \\lceil K \\cdot \\text{rk}_i(t) / N \\rceil \\in \\{1, \\dots, 10\\}$, yielding class processes $a_i^R(t)$ and $a_i^V(t)$ <em>(p. 5)<\/em>.<\/li><li>**Covariate Conditioning <em>(pp. 3–4)<\/em>:**<\/li><li class=\"sub-li\">Market covariates (all cross-sectionally decile-bucketed into $\\{1, \\dots, 10\\}$): market cap, market beta, Amihud illiquidity, trailing momentum, short-term reversal, multi-window realized volatility, plus the 3 distance-matrix features.<\/li><li class=\"sub-li\">Transitions parameterized via a <strong>log-linear conditional-logit model<\/strong> nesting the unconditional Markov chain at zero coefficients <em>(p. 3)<\/em>.<\/li><li>**Portfolio Architecture <em>(pp. 1, 3–4)<\/em>:**<\/li><li class=\"sub-li\">Monthly-rebalanced blend of a market-neutral momentum long-short sleeve + an opportunistic long-only sleeve (regime weight driven by recent market return sign—spectral early-warning signals did not beat simple market-return sign in ablations) <em>(pp. 1, 4)<\/em>.<\/li><li class=\"sub-li\">Marked to market daily; net of <strong>5 bps<\/strong> trading cost <em>(p. 1)<\/em>.<\/li><li><strong>Unresolved extraction details:<\/strong> Exact conditional-logit equations, exact lookback lengths $(\\tau_R, \\tau_V, L)$, exact adaptive sleeve-blending rule, exact residual-distance weighting formula, and Section 4–5 drawdown/turnover tables were not in retrieved snippets (<code>Pending source verification<\/code>).<\/li><\/ul>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Finding<\/th><th>Reported value<\/th><th>Sample / comparator<\/th><th>Source locator<\/th><\/tr><\/thead><tbody><tr><td>Base OMD Portfolio (OOS 1)<\/td><td>Sharpe <strong>1.06<\/strong>, Ann. Ret <strong>18%<\/strong><\/td><td>Jan 2022–Dec 2024; Market Sharpe <strong>0.78<\/strong>; net of 5 bps<\/td><td>Abstract, p. 1<\/td><\/tr><tr><td>Base OMD Portfolio (OOS 2)<\/td><td>Sharpe <strong>1.32<\/strong>, Ann. Ret <strong>44%<\/strong><\/td><td>Jan 2025–Jul 2026; Market Sharpe <strong>1.14<\/strong> ($\\approx 2\\times$ market return); net of 5 bps<\/td><td>Abstract &amp; Sec. 1, pp. 1, 4<\/td><\/tr><tr><td>+ Residual-Distance Diversification<\/td><td>Sharpe <strong>1.08<\/strong> (OOS 1, <strong>20%<\/strong> ret) &amp; <strong>1.44<\/strong> (OOS 2, <strong>56%<\/strong> ret)<\/td><td>Improves both OOS windows over base OMD<\/td><td>Abstract, p. 1<\/td><\/tr><tr><td>+ Information-Leader Overlay<\/td><td>Shallower drawdown &amp; added convexity at small return cost; Sharpe unchanged<\/td><td>Insures market-neutral sleeve<\/td><td>Abstract &amp; Sec. 1, pp. 1, 4<\/td><\/tr><tr><td>Classical Benchmarks Comparison<\/td><td>Beats minimum-variance and maximum-diversification portfolios<\/td><td>Exact benchmark Sharpe/DD values <code>Pending source verification<\/code><\/td><td>Abstract &amp; Sec. 1, pp. 1, 4<\/td><\/tr><tr><td>Fundamentals Ablation<\/td><td>Value/quality leads return rank but adds little to directional book and nothing to market-neutral core<\/td><td>Half-century ablation (Appendix A)<\/td><td>Sec. 1, p. 3<\/td><\/tr><tr><td>Volume / Turnover Information (Daily)<\/td><td>Share turnover level: net TE = <strong>+15.8<\/strong>, OOS log-lik gain = <strong>+14.2<\/strong> ($\\times 10^{-3}$ nats); gross daily Sharpe <strong>0.25<\/strong> $\\to$ net <strong>$-0.91$<\/strong> ($\\approx 400\\times$ ann. turnover)<\/td><td>CRSP daily panel 2015–2024 (OOS 2022–2024); real info, untradeable net of cost<\/td><td>Table 16 &amp; p. 48–49<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s limitations / negative findings (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Return rank stays close to unforecastable one step ahead; predictability lives primarily in the volatility rank <em>(pp. 1, 4)<\/em>.<\/li><li>Spectral early-warning signals from OMD-Stocks do <strong>not<\/strong> beat the simple sign of recent market returns for timing the regime weight <em>(p. 4)<\/em>.<\/li><li>Neither conviction sizing nor fragility sizing improves risk-adjusted performance <em>(p. 4)<\/em>.<\/li><li>Daily share turnover carries genuine OOS information about next-day return rank, but $400\\times$ annualized turnover destroys it net of costs (Sharpe $-0.91$) <em>(pp. 48–49)<\/em>.<\/li><\/ul>\n<p class=\"wiki-p\"><strong>Analyst concerns (<code>analyst_inference<\/code>):<\/strong><\/p>\n<ol class=\"wiki-ol\"><li><strong>Short OOS Horizon &amp; Bull-Market Tail:<\/strong> 4.5 years total OOS (2022–2026) with a 1.5-year second window where annualized return hits 44%–56% is far too short to distinguish structural alpha from a favorable S&amp;P 500 momentum/volatility regime.<\/li><li><strong>Survivorship &amp; Point-in-Time Universe Check Needed:<\/strong> Using S&amp;P 500 names with a fixed $N &lt; 500$ per window requires verifying that constituent lists are strictly point-in-time (no survivorship bias).<\/li><li><strong>5 bps Trading Cost Assumption:<\/strong> Reasonable for S&amp;P 500 monthly rebalancing, but short-borrow costs and market-neutral financing/cash-rate conventions need verification in Section 4.<\/li><li><strong>Complexity-to-Edge Ratio:<\/strong> Given the author&#x27;s own honest ablations (return rank unforecastable; spectral EWS loses to simple market return sign), a key question is whether a much simpler <strong>vol-rank forecast + residual-correlation HRP + momentum L/S<\/strong> captures 95% of the edge without Markov conditional-logit machinery.<\/li><\/ol>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable relationship and what a proxy must preserve (<code>proposed_test<\/code>):<\/strong> Cross-sectional <strong>volatility-rank forecasting<\/strong> (without covariance inversion) paired with <strong>market-mode-removed geodesic distance diversification<\/strong> ($M = \\arccos C_{\\text{resid}}$) outperforms classical minimum-variance and market benchmarks on S&amp;P 500 equities out-of-sample. The MVP preserves: (1) decile-rank discretization of return/vol and market covariates, (2) geodesic distance matrix without $\\Sigma^{-1}$, and (3) monthly rebalancing net of costs—while stripping out the transfer-entropy overlay initially.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Available data and instruments:<\/strong> Point-in-time S&amp;P 500 daily price/volume/market-cap panel (or liquid top-500 U.S. equities).<\/li><li><strong>Signal timestamp and first eligible trade:<\/strong> Compute trailing return/vol ranks, covariates, and 1-year correlation distance matrix at month-end close $t$; rebalance at $t+1$ close/VWAP.<\/li><li><strong>Positions, cash, costs, leverage, liquidity, other constraints:<\/strong> Long-only sleeve (100% invested) + dollar-neutral momentum L/S sleeve; charge 5 bps and 15 bps one-way cost + 50 bps/yr short borrow; daily mark-to-market.<\/li><li><strong>Deviations from paper:<\/strong> Test over a <strong>longer 15–20 year OOS<\/strong> (e.g., 2006–2026 covering 2008 GFC, 2020 COVID, and 2022 bear market) rather than only 2022–2026; benchmark directly against Shrinkage Min-Var (Ledoit-Wolf) and HRP.<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<ul class=\"wiki-ul\"><li><strong>Question and null:<\/strong> Does residual-distance diversification + forecasted low-volatility-rank selection outperform Ledoit-Wolf Minimum-Variance, HRP, and Equal-Weight S&amp;P 500 across a full 20-year cycle? ($H_0: \\text{Sharpe}_{\\text{OMD-MVP}} \\le \\text{Sharpe}_{\\text{HRP}}$).<\/li><li><strong>Market-data proxy and sample:<\/strong> Point-in-time S&amp;P 500 daily panel, 2004–2026 (rolling 4-year calibration, 2008–2026 OOS).<\/li><li><strong>Signal and parameter specification:<\/strong> Monthly 10-decile volatility rank transition model conditioned on size, beta, trailing vol, and Amihud illiquidity (multinomial logit); residual correlation matrix $C_{\\text{resid}}$ (1-factor SPY market mode removed) mapped to $M_{\\text{resid}} = \\arccos C_{\\text{resid}}$ for inverse-centrality / distance-weighted long allocation.<\/li><li><strong>Benchmark and position rule:<\/strong> Compare against (a) SPY buy-and-hold, (b) Ledoit-Wolf Min-Var, (c) HRP, and (d) simple trailing-vol ranking (no Markov model).<\/li><li><strong>OOS / look-ahead controls / execution:<\/strong> Expanding or 4-year rolling calibration; strictly $T+1$ execution after month-end; point-in-time constituents only.<\/li><li><strong>Costs and primary metrics:<\/strong> Net Sharpe, Sortino, MaxDD, annualized turnover, Calmar ratio, and crisis-period drawdown (2008, 2020, 2022).<\/li><li><strong>Robustness and predeclared continuation/failure criteria:<\/strong><\/li><li class=\"sub-li\"><em>Continue:<\/em> Beats both Ledoit-Wolf Min-Var and HRP by $\\ge +0.15$ net Sharpe over 2008–2026 with lower MaxDD and comparable turnover.<\/li><li class=\"sub-li\"><em>Stop / Kill:<\/em> If simple trailing-vol ranking + HRP matches the conditional-logit Markov chain within 0.05 Sharpe (indicating the Markov machinery adds complexity without incremental edge).<\/li><\/ul>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Not pursued<\/strong> — exact replication requires author&#x27;s private GitHub repo (<code>github.com/ighalp/omd_portfolio<\/code>) and full Section 4 equations not yet extracted.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Related papers / projects:<\/strong><\/li><li class=\"sub-li\"><em>Evidence:<\/em> Extends Halperin&#x27;s <em>OMD-Stocks<\/em> (<code>arXiv:2607.19005<\/code>) and builds on Fernholz&#x27;s Stochastic Portfolio Theory (rank-based portfolios) <em>(pp. 2, 4)<\/em>.<\/li><li class=\"sub-li\"><em>Proposal:<\/em> Strong conceptual bridge to <strong>Bai &amp; Pukthuanthong (2026)<\/strong> — both papers independently conclude that <strong>discretizing continuous financial variables into 10 cross-sectional deciles and modeling them with conditional/multinomial logit (cross-entropy)<\/strong> beats raw continuous Gaussian/MSE assumptions. Also directly relevant to covariance-shrinkage / condition-number portfolio work (Ledoit-Wolf / HRP) as a matrix-inversion-free alternative.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source-backed claim (<code>author_reported<\/code>):<\/strong> A 3-matrix rank-and-distance framework (no $\\Sigma^{-1}$, price/volume data only) beats the S&amp;P 500, Min-Var, and Max-Diversification portfolios across 2022–2024 (Sharpe 1.08) and Jan 2025–Jul 2026 (Sharpe 1.44) net of 5 bps <em>(p. 1)<\/em>.<\/li><li><strong>Proposed falsifiable next test (<code>proposed_test<\/code>):<\/strong> Test the residual-distance long sleeve + vol-rank Markov forecast over a full 2008–2026 cycle against Ledoit-Wolf Min-Var and HRP to see if the edge survives outside 2022–2026.<\/li><li><strong>Verdict and decision owner:<\/strong> <strong>Pending review<\/strong> — <strong>High-interest portfolio-construction architecture.<\/strong> Refreshingly honest ablations (admitting where signals fail), but needs a longer OOS backtest and full Section 4 extraction before adoption.<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence<\/th><th>Reviewer/date<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>pass<\/td><td>Tagged by portfolio construction, Markov chains, distance matrix, transfer entropy, S&amp;P 500.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>pass<\/td><td>L0–L4 capture the 3-matrix intuition, equations (1)–(3), headline OOS results, and honest negative ablations.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>MVP defined, but exact Section 4 sleeve-blending &amp; residual-distance weight formulas pending full-PDF extraction.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract, Sec. 1–2, and Table 16 verified; Sec. 4–5 full performance/drawdown tables pending verification.<\/td><td>AI Draft / 2026-11-25<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Source Drive ID / version:<\/strong> <code>1efnRNT60fAbi9UK8hJkWO9itYLI7kJmv<\/code> — <a href=\"https://drive.google.com/file/d/1efnRNT60fAbi9UK8hJkWO9itYLI7kJmv/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Halperin (2026) - Are Three Matrices All You Need To Beat the Market - Observable Matrix Dynamics for Portfolio Optimization.pdf<\/a> (<code>arXiv:2607.27461v1<\/code>, archived in <code>03_Raw<\/code>)<\/li><li><strong>Schema version:<\/strong> 0.1.1<\/li><li><strong>Changes / reviewer:<\/strong> v0.1 initial draft created 2026-11-25; pending human review.<\/li><\/ul>"}], "searchText": "are three matrices all you need to beat the market? observable matrix dynamics for portfolio optimization igor halperin portfolio construction & matrix dynamics markov chains information theory covariance alternatives s&p 500 equities geodesic distance matrix markov transition matrix conditional logit transfer entropy # are three matrices all you need to beat the market? observable matrix dynamics for portfolio optimization ## l0 — research in one minute **question:** can dynamic equity portfolio optimization beat the s&p 500, minimum-variance, and maximum-diversification benchmarks using *only* daily prices, volumes, and market caps—represented by three fixed-size matrices with **no covariance matrix inversion** and **no black-box ml**? *(pp. 1–3)* **author-reported claim and findings (`author_reported`):** yes. replacing markowitz's $(\\mu, \\sigma)$ with (1) an arccos correlation-distance matrix and (2–3) two covariate-conditioned markov transition matrices for monthly return ranks and volatility ranks reveals that **volatility rank is forecastable one step ahead while return rank is nearly unforecastable** *(pp. 1, 4)*. blending a market-neutral momentum long-short sleeve with an opportunistic long-only sleeve beats the market on two non-overlapping oos windows—**jan 2022–dec 2024** (sharpe **1.06** vs. market **0.78**) and **jan 2025–jul 2026** (sharpe **1.32** vs. market **1.14**), net of 5 bps trading cost *(p. 1)*. adding residual-distance diversification lifts sharpe to **1.08** and **1.44** (annualized returns **20%** and **56%**) *(p. 1)*. **caveat (`analyst_inference`):** both oos windows are very short (3 years and 1.5 years, totaling 4.5 years—primarily a concentrated mega-cap/momentum-friendly equity regime), and the paper's footnote discloses that all code, numerical analysis, and manuscript preparation were executed by an ai assistant under author supervision *(p. 1 fn.)*. exact sleeve-blending weights, drawdown numbers, and full benchmark tables require full-pdf verification before coding. ## l1 — economic intuition **author's explanation (`author_reported`):** classical markowitz optimization fails out-of-sample because raw return means are noisy and inverting sample covariance matrices amplifies estimation error. converting correlations into a **geodesic distance matrix** ($m_{ij} = \\arccos g_{ij}$) and raw returns/volatilities into **ordinal decile ranks** ($1 \\dots 10$) makes the state representation outlier-robust and market-neutral by construction *(pp. 3–5)*. conditioning the two markov chains on market covariates (size, beta, amihud illiquidity, momentum, reversal, multi-horizon volatility, plus 3 distance-matrix network features) via log-linear conditional logit reveals strong directional \"arrow of time\" (entropy production) in risk descript", "sortRank": 0}, {"id": "paper-baldi-collindufresne-daniel-2026-air", "filename": "Asymmetric_Reversals_2026.md", "title": "Asymmetric Reversals", "authors": "Federico Baldi-Lanfranchi, Pierre Collin-Dufresne, Kent Daniel", "year": "2026", "pubDate": "2026-09-22", "version": "Source accessed 2026-10-23; revised status not independently checked", "primaryTopic": "statarb", "category": "StatArb & Topics", "isTopicWiki": false, "tags": ["mean-reversion", "asset-pricing", "market-microstructure", "idiosyncratic-volatility", "return-decomposition", "cross-sectional-regression"], "rawUrl": "https://drive.google.com/file/d/1Vqobq7RLVxIT_Itkhrcz59zs0cp3LD4I/view", "rawId": "1Vqobq7RLVxIT_Itkhrcz59zs0cp3LD4I", "status": "triaged", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<blockquote class=\"wiki-quote\"><strong>Research status:<\/strong> AI draft, pending validation. Source-backed author claims are explicitly separated from analyst hypotheses and proposed tests. This paper was <em>not<\/em> listed in the previous 2026-09-24 classification index; classification is proposed using its existing taxonomy.<\/blockquote>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> What component of a stock&#x27;s recent return predicts short-horizon reversal, and why do positive and negative residual shocks reverse at different speeds?<\/p>\n<p class=\"wiki-p\"><strong>Core author claim:<\/strong> Stock returns combine systematic / information-related movements (<code>SYS<\/code>), which tend to continue, and an orthogonal residual (<code>RES<\/code>), which tends to reverse. Reversal of negative residual shocks occurs much faster than reversal of positive shocks. An asymmetric idiosyncratic-reversal factor (<code>ASRES<\/code>) exploits these dynamics.<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headlines:<\/strong> Simple long-low-RES / short-high-RES strategy earns about <strong>1.07% per month<\/strong>; the ASRES factor has a reported annualized <strong>Sharpe ratio of 2.55<\/strong>. These are historical study outcomes, not independently reproduced live results. Source: Introduction pp. 1–4 and Conclusion §8; exact performance-table locator pending QC.<\/p>\n<p class=\"wiki-p\"><strong>Caution:<\/strong> Factor construction requires detailed residual estimation, data availability controls, lagged impulse responses and trade assumptions. The first Wiki draft is not a complete executable specification.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation:<\/strong> Information about firm fundamentals can lead to lasting price moves; temporary liquidity pressure can reverse. Because intermediaries initially cannot perfectly identify fire-sale pressure versus adverse information, negative idiosyncratic shocks can recover quickly when pressure abates, while positive shocks unwind more slowly. Authors discuss the mechanism further in their conclusion and refer to a companion theory paper (§8).<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation:<\/strong> A naive reversal strategy mixes an informational continuation component with liquidity-related reversal. Residualizing prices and separating signs might reduce this mixture. This interpretation does not establish the causal explanation.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Data and sample (source §2):<\/strong> Daily/monthly prices and returns, market capitalization, volume and shares from CRSP CIZ. U.S. common stocks on NYSE, Amex and NASDAQ, January <strong>1972–December 2022<\/strong>. Requires Fama–French 49-industry assignment and size screens; entry above <strong>0.003%<\/strong> of aggregate market capitalization, removal below <strong>0.002%<\/strong>. These thresholds are author-reported and must be reflected in an exact replication.<\/p>\n<p class=\"wiki-p\"><strong>Return decomposition (§3):<\/strong> A stock&#x27;s realized return is decomposed into systematic/information-linked <code>SYS<\/code> and orthogonal <code>RES<\/code> components; characteristic / industry controls and earnings-announcement adjustments matter. The authors use more than 150 firm characteristics (Introduction). Earnings windows spanning one trading day around announcements have residuals reset to zero with the removed component assigned to systematic returns (equations <strong>5–6<\/strong>, §3).<\/p>\n<p class=\"wiki-p\"><strong>Signed residuals (§5):<\/strong> Separate the positive and negative realized daily residual components and aggregate over the formation window. Their forecasting regression assesses <code>RES+<\/code>, <code>RES−<\/code>, IVOL and controls (equation <strong>16<\/strong>, §5.2). Sign convention and aggregation must be copied faithfully from the source before coding.<\/p>\n<p class=\"wiki-p\"><strong>ASRES (§7):<\/strong> The tradable factor weights past residual shocks using sign- and lag-dependent estimated impulse responses. Detailed signal formulas, re-estimation schedule, portfolio weight conventions, execution assumptions and cost treatment <strong>still require source-table/equation verification<\/strong>. Do <strong>not<\/strong> code from this high-level description alone.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Author-reported finding<\/th><th>Result<\/th><th>Source locator<\/th><th>Status<\/th><\/tr><\/thead><tbody><tr><td>Simple residual-reversal long/short premium<\/td><td>1.07% monthly<\/td><td>Introduction pp. 1–2<\/td><td>author_reported; table verification pending<\/td><\/tr><tr><td>First-day fraction of negative-shock reversal<\/td><td>29%<\/td><td>Introduction p. 2<\/td><td>author_reported; figure verification pending<\/td><\/tr><tr><td>First-day fraction of positive-shock reversal<\/td><td>4%<\/td><td>Introduction p. 2<\/td><td>author_reported; figure verification pending<\/td><\/tr><tr><td>ASRES historical Sharpe ratio<\/td><td>2.55 annualized<\/td><td>Introduction pp. 2–4 and §8<\/td><td>author_reported; table verification pending<\/td><\/tr><tr><td>IVOL incremental forecast effect after signed residual controls<\/td><td>Authors report little/no remaining effect<\/td><td>§5.2 and §8; equation 16<\/td><td>author_reported; regression verification pending<\/td><\/tr><tr><td>Systematic versus residual response<\/td><td>SYS continuation; RES reversal<\/td><td>Abstract, §§3–4<\/td><td>author_reported<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation restriction:<\/strong> The statistical results are historical, sample-dependent author claims, not prospective expectations. Reported net-of-cost performance has <strong>not<\/strong> been verified in this draft.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-stated implementation considerations:<\/strong> Discuss use of CRSP closing auctions, historical commissions/spreads/data access and availability of necessary data at least one trading day before trade (Introduction). These considerations are not equivalent to independently verified capacity for institutional size.<\/p>\n<p class=\"wiki-p\"><strong>Analyst-identified concerns:<\/strong> Residual estimates depend on rich characteristic data; universe screens and delisting returns matter; compare data timestamp to trade timestamp; verify factor fit and re-estimation using only available data; assess short borrow, turnover, funding, market impact, liquidity and crowding; avoid treating an in-sample estimated impulse-response profile as out-of-sample if the methodology doesn&#x27;t support it. These are evaluation questions, not paper findings.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Replication Blueprint", "isCore": false, "html": "<p class=\"wiki-p\"><strong>A. Exact-paper replication: pending technical extraction<\/strong><\/p>\n<ol class=\"wiki-ol\"><li>Reproduce CRSP CIZ universe, common-share filter, Fama–French 49-industry requirement and capitalization hysteresis (§2).<\/li><li>Specify characteristic controls and estimation (including the &gt;150 characteristic data inputs), handling of earnings event windows, and return decomposition (§3).<\/li><li>Implement signed residual aggregation and the lag-specific impulse-response estimation (§§5–6).<\/li><li>Implement §7 ASRES signal/weighting, rebalancing and timing only after verifying exact equations and tables.<\/li><li>Audit transaction prices, transaction costs, shorting constraints, out-of-sample timing, turnover, capacity and all return definitions.<\/li><\/ol>\n<p class=\"wiki-p\"><strong>B. Simplified demonstration — proposed test, not exact reproduction<\/strong><\/p>\n<ol class=\"wiki-ol\"><li>Compute rolling single-stock residual returns against an ex-ante market/industry factor model.<\/li><li>Create lagged positive and negative residual predictors from information available by decision time.<\/li><li>Compare forward 1-, 5-, 10- and 20-day returns; run split-sample / walk-forward analysis.<\/li><li>Compare residual-sign variants with raw-return reversal on matched universe and cost assumptions.<\/li><li>Record OOS Sharpe, turnover, drawdown, liquidity exposure, tail behavior and statistical confidence.<\/li><\/ol>\n<p class=\"wiki-p\"><strong>Open details:<\/strong> Precise ASRES formula, portfolio weighting, cross-sectional ranking, costs, sample splits and reproducibility materials. Q3 cannot pass until addressed.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-grounded:<\/strong> The authors explicitly compare reversals, IVOL and related one-month anomalies, referencing classical short-term reversal and liquidity-provision literature (Introduction and §§5–7).<\/p>\n<p class=\"wiki-p\"><strong>Proposed internal connection:<\/strong> Compare positive/negative residual reversal to the previously studied SPY mean-reversion signals. This is a speculative research extension; SPY index-level signals and cross-sectional individual-stock residual factors differ materially in universe and implementation.<\/p>\n<p class=\"wiki-p\"><strong>Proposed Topic Wiki:<\/strong> <code>02_Wiki/Topics/Short_Term_Mean_Reversion.md<\/code> (currently a draft, not a completed synthesis).<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<ul class=\"wiki-ul\"><li><strong>Claim (author-reported):<\/strong> Signed residual shocks have asymmetric reversal speeds; exploiting lag/sign response can improve short-horizon prediction versus naive return reversal.<\/li><li><strong>Next falsifiable test (proposed):<\/strong> On a survivorship-bias-controlled U.S. stock sample, independently estimate signed residual predictors using only ex-ante data; test whether positive and negative residual coefficients / impulse responses differ out of sample and after costs.<\/li><li><strong>Current verdict:<\/strong> Interesting replication candidate, <strong>not validated<\/strong>.<\/li><li><strong>Decision owner:<\/strong> Human research reviewer; not yet assigned.<\/li><\/ul>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / remaining requirement<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Tags and aliases included; actual keyword/metadata retrieval benchmark not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>L0–L4 drafted; requires independent reader review<\/td><\/tr><tr><td>Q3 Replicability<\/td><td>needs_review<\/td><td>Precise §7 ASRES implementation and formula verification not complete<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source link, sections and some preliminary pages supplied; empirical table / figure and equation locators need verification<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source / Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw: <a href=\"https://drive.google.com/file/d/1Vqobq7RLVxIT_Itkhrcz59zs0cp3LD4I/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">https://drive.google.com/file/d/1Vqobq7RLVxIT_Itkhrcz59zs0cp3LD4I/view<\/a> · Drive file ID <code>1Vqobq7RLVxIT_Itkhrcz59zs0cp3LD4I<\/code>.<\/li><li>Original paper date: September 22, 2026. Parsed text retrieved from connected Drive October 23, 2026.<\/li><li>October 23, 2026: draft v0.1 created under new Schema. No experiment run. No Google Drive changes performed.<\/li><\/ul>"}], "searchText": "asymmetric reversals federico baldi-lanfranchi, pierre collin-dufresne, kent daniel statarb mean-reversion asset-pricing market-microstructure idiosyncratic-volatility return-decomposition cross-sectional-regression impulse-response factor-construction # asymmetric reversals — pilot paper wiki > **research status:** ai draft, pending validation. source-backed author claims are explicitly separated from analyst hypotheses and proposed tests. this paper was *not* listed in the previous 2026-09-24 classification index; classification is proposed using its existing taxonomy. ## l0 — research in one minute **question:** what component of a stock's recent return predicts short-horizon reversal, and why do positive and negative residual shocks reverse at different speeds? **core author claim:** stock returns combine systematic / information-related movements (`sys`), which tend to continue, and an orthogonal residual (`res`), which tends to reverse. reversal of negative residual shocks occurs much faster than reversal of positive shocks. an asymmetric idiosyncratic-reversal factor (`asres`) exploits these dynamics. **author-reported headlines:** simple long-low-res / short-high-res strategy earns about **1.07% per month**; the asres factor has a reported annualized **sharpe ratio of 2.55**. these are historical study outcomes, not independently reproduced live results. source: introduction pp. 1–4 and conclusion §8; exact performance-table locator pending qc. **caution:** factor construction requires detailed residual estimation, data availability controls, lagged impulse responses and trade assumptions. the first wiki draft is not a complete executable specification. ## l1 — economic intuition **author's explanation:** information about firm fundamentals can lead to lasting price moves; temporary liquidity pressure can reverse. because intermediaries initially cannot perfectly identify fire-sale pressure versus adverse information, negative idiosyncratic shocks can recover quickly when pressure abates, while positive shocks unwind more slowly. authors discuss the mechanism further in their conclusion and refer to a companion theory paper (§8). **analyst interpretation:** a naive reversal strategy mixes an informational continuation component with liquidity-related reversal. residualizing prices and separating signs might reduce this mixture. this interpretation does not establish the causal explanation. ## l2 — model construction **data and sample (source §2):** daily/monthly prices and returns, market capitalization, volume and shares from crsp ciz. u.s. common stocks on nyse, amex and nasdaq, january **1972–december 2022**. requires fama–french 49-industry assignment and size screens; entry above ", "sortRank": 0}, {"id": "clenow-2023-following-the-trend", "filename": "Clenow_2023_Trend_Following_Portfolio_Risk_v0.1.md", "title": "Following the Trend: Diversified Managed Futures Trading (2nd ed.)", "authors": "Andreas F. Clenow", "year": "2023", "pubDate": "2023", "version": "", "primaryTopic": "Trend Following & Momentum", "category": "Trend & Momentum", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1_JBITNvYyuMWvnUuIywyzNjrglS1cxvr/view", "rawId": "1_JBITNvYyuMWvnUuIywyzNjrglS1cxvr", "status": "carded", "reviewStatus": "v0.1_note", "qcPass": 0, "qcTotal": 0, "introHtml": "<p class=\"wiki-p\"><strong>Research note:<\/strong> v0.1 — 2026-10-28 <strong>Status:<\/strong> Primary-source reading completed for key sections; open questions retained for replication. <strong>Primary source:<\/strong> Andreas F. Clenow, <em>Following the Trend: Diversified Managed Futures Trading<\/em>, 2nd ed. (Wiley, 2023). Stored in <code>Quant Research Vault/00_Inbox<\/code>. <strong>Source URL:<\/strong> <a href=\"https://drive.google.com/file/d/1_JBITNvYyuMWvnUuIywyzNjrglS1cxvr/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">https://drive.google.com/file/d/1_JBITNvYyuMWvnUuIywyzNjrglS1cxvr/view<\/a> <strong>Purpose:<\/strong> Establish a canonical, source-grounded reference before QuantLab implementation. Page numbers below refer to the <strong>printed book page numbers<\/strong>.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Executive findings", "isCore": true, "html": "<ol class=\"wiki-ol\"><li><strong>The core 2023 signal model is EMA50/EMA100 as trend filter, combined with 100-day closing-price breakout entries and 50-day opposing closing-price exits<\/strong> (p. 74). The base risk factor is 15bp of equity for the target daily <em>per-position<\/em> ATR move.<\/li><li><strong>Risk is normalized per trade, not optimized at the portfolio level.<\/strong> Clenow uses an exponentially smoothed ATR and contract point value to make very different futures markets have comparable approximate daily P&amp;L impact (pp. 51–53).<\/li><li><strong>The core strategy deliberately keeps contract count constant throughout each trade<\/strong>: it does not automatically resize existing positions for later changes in volatility, equity, or correlations (pp. 52, 255–256).<\/li><li><strong>Broad diversification across futures markets is fundamental.<\/strong> Clenow trades across agriculture, other commodities, currencies, equity indexes, and rates, prioritizing liquid contracts (pp. 49–51).<\/li><li><strong>Portfolio-level covariance risk is a recognized limitation, not an implemented constraint in the core model.<\/strong> He discusses correlations, VaR, and incremental VaR as potential enhancements (pp. 255–257), including the danger of many trades becoming one underlying macro bet.<\/li><li><strong>Risk factor determines return/drawdown scaling.<\/strong> Chapter 4 Table 4.5 demonstrates materially greater volatility and drawdowns at larger risk factors (p. 77). These are the author&#x27;s historical simulations, not forward forecasts.<\/li><li><strong>Style diversification is distinct from market diversification.<\/strong> Chapter 9 combines trend, countertrend, and curve trading with approximate 34%/33%/33% strategy allocations, rebalanced monthly as a demonstration (pp. 258–261).<\/li><\/ol>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Canonical 2023 core trading rules", "isCore": true, "html": "<p class=\"wiki-p\">Source: Chapter 4, <strong>A Core Trend-Following Strategy<\/strong>, p. 74; basic models pp. 59–61.<\/p>\n<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Component<\/th><th>Rule<\/th><\/tr><\/thead><tbody><tr><td>Universe<\/td><td>Liquid futures in all major sectors, both long and short<\/td><\/tr><tr><td>Frequency<\/td><td>Daily signals from closing data; trade next trading day<\/td><\/tr><tr><td>Bull regime<\/td><td>EMA(50) &gt; EMA(100)<\/td><\/tr><tr><td>Bear regime<\/td><td>EMA(50) &lt; EMA(100)<\/td><\/tr><tr><td>Long entry<\/td><td>New 100-day closing high AND bullish regime<\/td><\/tr><tr><td>Short entry<\/td><td>New 100-day closing low AND bearish regime<\/td><\/tr><tr><td>Long exit<\/td><td>50-day closing low OR bearish trend<\/td><\/tr><tr><td>Short exit<\/td><td>50-day closing high OR bullish trend<\/td><\/tr><tr><td>Size<\/td><td>20-day exponentially smoothed ATR; 15bp target daily position movement<\/td><\/tr><tr><td>Traditional stop<\/td><td><strong>None<\/strong> in the 2023 core model; separate ATR-based trailing stop discussed later as an optional variation (pp. 262–263)<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Execution fidelity:<\/strong> Book states that the basic models generate end-of-day signals and trade the next day, modeling slippage and commissions (pp. 60–61). Clearly define whether breakout ranges exclude the signal day in implementation; no same-day close-fill assumption.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Position sizing", "isCore": false, "html": "<p class=\"wiki-p\">Source: Chapter 3 <strong>Position Sizing<\/strong>, pp. 51–53; Chapter 4 pp. 74, 76–78.<\/p>\n<div class=\"math-block\">\\[\nN_i = \\left\\lfloor \\frac{E \\times r}{ATR_{20,i} \\times M_i \\times FX_i} \\right\\rfloor\n\\]<\/div>\n<ul class=\"wiki-ul\"><li><code>E<\/code>: equity assigned to the strategy (base currency).<\/li><li><code>r<\/code>: risk factor, 0.0015 for the final Chapter 4 core model.<\/li><li><code>ATR20<\/code>: exponential average of true range in the instrument&#x27;s own price units.<\/li><li><code>M<\/code>: point value / futures contract multiplier.<\/li><li><code>FX<\/code>: conversion from contract P&amp;L currency to strategy base currency; use 1 when same currency.<\/li><li><code>N<\/code>: whole contracts, rounded downward.<\/li><\/ul>\n<p class=\"wiki-p\">Clenow first illustrates <strong>20bp<\/strong> in Chapter 3 (pp. 52–53), then uses <strong>15bp<\/strong> for the core model (p. 74); do not conflate them. The target is an approximate daily position P&amp;L movement <strong>not<\/strong> a fixed maximum loss per trade and <strong>not<\/strong> a 15bp portfolio-volatility target. Clenow deliberately holds number of contracts constant between entry and exit (p. 52).<\/p>\n<p class=\"wiki-p\"><strong>Book example:<\/strong> $1m account; 20bp budget = $2,000 daily position movement. Gold ATR $10/oz and 100 oz multiplier means ~$1,000 per contract; enter 2 contracts (p. 52). This example illustrates the preliminary 20bp setup, not the final 15bp rule.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Portfolio construction", "isCore": false, "html": "<p class=\"wiki-p\">Source: Chapter 3 <strong>The Investment Universe<\/strong>, pp. 49–51; Chapter 1 pp. 3–4; Chapter 9 pp. 255–261.<\/p>\n<ul class=\"wiki-ul\"><li>Trade a broad, sufficiently liquid list of futures across <strong>agricultural commodities, non-agricultural commodities, currencies, equities, and rates<\/strong>. Table 3.2 is a concrete universe, with somewhat more agricultural instruments.<\/li><li>Allow all instruments to be eligible for long and short trading; the individual direction is rule-based. Do not remove a market merely because of recent unprofitable signals, as future trend regimes are unknowable (pp. 49–50).<\/li><li>The portfolio&#x27;s risk is an <strong>emergent consequence<\/strong> of active signals, individual ATR sizing, market count, and cross-market correlations. Equal position <em>notional<\/em> weights are not the method.<\/li><li>There is <strong>no evidence in the core Chapter 4 specification of an explicit target portfolio annualized volatility, covariance-adjusted weights, per-sector risk budgets, or dynamic total-gross limit<\/strong>. These should be classified as candidate enhancements rather than attributed to Clenow&#x27;s simple core implementation.<\/li><li>Clenow warns small accounts struggle with contract indivisibility and diversified coverage (Chapter 10, pp. 265–267).<\/li><\/ul>\n<h3 class=\"wiki-h3\">Why does 15bp per trade lead to ~26% realized portfolio annualized volatility?<\/h3>\n<p class=\"wiki-p\">Not a contradiction: 15bp controls the <strong>estimated ATR move of each newly opened contract position<\/strong>, not the variability of the combined strategy. A portfolio with many simultaneous positions can generate much larger daily P&amp;L moves. ATR is also not the same as standard deviation, and position exposures drift during trends. The empirical realized total is affected by number of active positions and their correlations. <strong>We have not independently reproduced the book&#x27;s 25.9% volatility<\/strong>; it is the historical statistic printed in Table 4.4 (p. 73) for the core simulation.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Risk control and known deficiencies", "isCore": false, "html": "<p class=\"wiki-p\">Source: Chapter 9 <strong>Correlation Matrices, Position Sizing, and Risk<\/strong>, pp. 255–257; <strong>Volatility-Based Stop Loss<\/strong>, pp. 262–263.<\/p>\n<h3 class=\"wiki-h3\">In the core model<\/h3>\n<ol class=\"wiki-ol\"><li>Smaller position sizes for more volatile instruments via ATR/point value.<\/li><li>Exit through opposite 50-day breakout or EMA trend flip.<\/li><li>Broad market diversification, disciplined next-day execution, commission/slippage modeling.<\/li><li>Fixed contract count within a trade, rather than automatic rebalancing.<\/li><\/ol>\n<h3 class=\"wiki-h3\">Deliberate limitations acknowledged by Clenow<\/h3>\n<ul class=\"wiki-ul\"><li>Multiple futures trades can amount to <strong>one correlated macro bet<\/strong> (e.g. long bonds, short equities, short foreign currencies and commodities during a crisis).<\/li><li>As a trend continues, notional position values and volatility change while number of contracts remains fixed.<\/li><li>A core ATR-only risk metric <strong>ignores covariance and portfolio concentration<\/strong>.<\/li><li>He suggests dynamic correlation/covariance analysis, portfolio VaR and <strong>incremental VaR before trades<\/strong> as more professional methods (pp. 255–257), but does not provide a unique fully specified portfolio VaR-based sizing rule here.<\/li><li>For global markets closing in different time zones, he suggests using overlapping <strong>10-day log returns<\/strong> for correlation estimation to reduce nonsynchronous-closing distortion (pp. 256–257). This is a research suggestion, not a core-position rule.<\/li><li>The 2023 core model does <strong>not<\/strong> include traditional stop loss logic; an ATR-based trailing stop is discussed as a separate optional tweak, and adding one can raise whipsaw risk (pp. 262–263).<\/li><\/ul>\n<h3 class=\"wiki-h3\">Operational risk controls<\/h3>\n<ul class=\"wiki-ul\"><li>Backtests assume $1 per contract commission plus $1.50 exchange fee and a volume-based adverse slippage model (p. 54).<\/li><li>Futures require separate margin/cash planning across currencies; Chapter 4 pp. 78–83 and Chapter 10 pp. 269–272 cover cash collateral and government-security income.<\/li><li>On launch, Clenow advises entering the entire model-indicated existing portfolio rather than waiting for fresh signals; position sizing must reflect historic entry conditions if matching the simulation is the goal (p. 267).<\/li><li>Real-world performance should be monitored against conservative simulations, inclusive of management/performance fees, with systematic divergence investigated (pp. 273–274).<\/li><\/ul>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Risk factor sensitivity reported by the author", "isCore": false, "html": "<p class=\"wiki-p\">Source: Chapter 4, Table 4.5, p. 77. Historical simulation, no replication performed here.<\/p>\n<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Risk factor<\/th><th>Annualized compounded return<\/th><th>Worst drawdown<\/th><th>Annualized volatility<\/th><th>Zero-rate Sharpe<\/th><\/tr><\/thead><tbody><tr><td>7.5bp<\/td><td>8.88%<\/td><td>-22.23%<\/td><td>13.08%<\/td><td>0.72<\/td><\/tr><tr><td>10bp<\/td><td>11.63%<\/td><td>-28.69%<\/td><td>17.41%<\/td><td>0.72<\/td><\/tr><tr><td>15bp<\/td><td>15.81%<\/td><td>-39.43%<\/td><td>25.90%<\/td><td>0.72<\/td><\/tr><tr><td>30bp<\/td><td>25.94%<\/td><td>-64.66%<\/td><td>49.57%<\/td><td>0.71<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\">Interpretation: larger risk factor largely changes portfolio scale and drawdown, while Sharpe is comparatively stable in these examples. Extreme drawdowns are economically critical.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Style diversification", "isCore": false, "html": "<p class=\"wiki-p\">Source: Chapter 9, pp. 258–261, Table 9.2 p. 261.<\/p>\n<p class=\"wiki-p\">Clenow combines (1) trend following, (2) countertrend and (3) futures curve strategies. Demonstration capital allocation is <strong>34% / 33% / 33%<\/strong>, with monthly rebalancing. He states real implementations may prefer rebalancing thresholds, liquidity-based weights or risk-based weights.<\/p>\n<p class=\"wiki-p\">Table 9.2 reports combined portfolio annualized return <strong>27.3%<\/strong>, worst drawdown <strong>-23.8%<\/strong>, annualized volatility <strong>20.2%<\/strong>, and Sharpe <strong>1.29<\/strong>; treat as an illustrative backtest, not a live-return prediction. The component performance reporting in Tables 9.1/9.2 differs for countertrend; compare simulation setup before drawing conclusions.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Repository audit and QuantLab research agenda", "isCore": false, "html": "<h3 class=\"wiki-h3\">Source-to-code comparison<\/h3>\n<ul class=\"wiki-ul\"><li><strong>lilechen/trend-trading:<\/strong> Captures the 2023 signal lookbacks and ATR principle but is primarily a current-state signal interpreter, <strong>not<\/strong> a full historical portfolio simulator. Its <code>clenow.py<\/code> sizing output omits contract multiplier / currency conversion and does not maintain persistent position state. These are implementation limitations, not features of the book.<\/li><li class=\"sub-li\"><a href=\"https://github.com/lilechen/trend-trading/blob/main/trend_trading/systems/clenow.py\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">https://github.com/lilechen/trend-trading/blob/main/trend_trading/systems/clenow.py<\/a><\/li><li><strong>sherrytp/TradingEvolved:<\/strong> Implements a <em>Trading Evolved<\/em> Chapter 15 futures strategy with EMA40/80, 50-day closing breakout, 40-day price-difference volatility sizing and a 3σ stop. It is a distinct Clenow example and <strong>not<\/strong> the 2023 Chapter 4 canonical rules.<\/li><li class=\"sub-li\"><a href=\"https://github.com/sherrytp/TradingEvolved/blob/main/Chapter%2015%20-%20Futures%20Trend%20Following/TrendModel.py\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">https://github.com/sherrytp/TradingEvolved/blob/main/Chapter%2015%20-%20Futures%20Trend%20Following/TrendModel.py<\/a><\/li><\/ul>\n<h3 class=\"wiki-h3\">Proposed replication sequence (our research proposals, not claims from Clenow)<\/h3>\n<ol class=\"wiki-ol\"><li><strong>Faithful core 2023<\/strong>: futures rolls, FX, EMA50/100, prior-100/50 closing breakouts, ATR20, sizing at trade entry, no traditional stop, next-day orders, conservative costs.<\/li><li><strong>Portfolio risk monitor (read-only)<\/strong>: active count, gross/notional exposure, approximate ex ante covariance volatility, sector exposure, correlation clustering, VaR, incremental VaR, margin liquidity.<\/li><li><strong>Controlled overlays (separate experiments)<\/strong>: position re-sizing, portfolio volatility targeting, cross-asset correlation adjustment, sector limits and 3-ATR trailing stops.<\/li><li><strong>Style diversification<\/strong>: only after the single-strategy reproduction passes unit tests and backtest reconciliation.<\/li><\/ol>\n<h3 class=\"wiki-h3\">Open questions / validation checklist<\/h3>\n<ul class=\"wiki-ul\"><li>Verify precise timing convention for rolling breakout extrema, fills, and futures rollover versus signal series.<\/li><li>Reproduce the 2023 book&#x27;s universe and metadata, and reconcile contract multiplier and FX treatment.<\/li><li>Distinguish ATR smoothing from Wilder ATR and confirm implementation equivalence.<\/li><li>Confirm whether core&#x27;s 15bp budget is set relative to current net equity on entry, including fees/cash accrual.<\/li><li>Examine Chapter 5 sector attribution and Chapter 9 risk passages for portfolio concentration diagnostics.<\/li><li>Verify reported Table 4.4/4.5 statistics in an independent test, not solely from the book.<\/li><\/ul>\n<hr class=\"wiki-hr\" />\n<p class=\"wiki-p\"><strong>Research principle:<\/strong> Keep the <em>author&#x27;s core model<\/em>, <em>author&#x27;s optional suggestions<\/em>, and <em>our QuantLab enhancements<\/em> in separate layers. Never pass an improvement off as an original Clenow rule.<\/p>"}], "searchText": "following the trend: diversified managed futures trading (2nd ed.) andreas f. clenow trend following & momentum # clenow (2023) — trend following, portfolio construction & risk control **research note:** v0.1 — 2026-10-28 **status:** primary-source reading completed for key sections; open questions retained for replication. **primary source:** andreas f. clenow, *following the trend: diversified managed futures trading*, 2nd ed. (wiley, 2023). stored in `quant research vault/00_inbox`. **source url:** https://drive.google.com/file/d/1_jbitnvyyumwvnuuiywyznjrgls1cxvr/view **purpose:** establish a canonical, source-grounded reference before quantlab implementation. page numbers below refer to the **printed book page numbers**. ## l0 — executive findings 1. **the core 2023 signal model is ema50/ema100 as trend filter, combined with 100-day closing-price breakout entries and 50-day opposing closing-price exits** (p. 74). the base risk factor is 15bp of equity for the target daily *per-position* atr move. 2. **risk is normalized per trade, not optimized at the portfolio level.** clenow uses an exponentially smoothed atr and contract point value to make very different futures markets have comparable approximate daily p&l impact (pp. 51–53). 3. **the core strategy deliberately keeps contract count constant throughout each trade**: it does not automatically resize existing positions for later changes in volatility, equity, or correlations (pp. 52, 255–256). 4. **broad diversification across futures markets is fundamental.** clenow trades across agriculture, other commodities, currencies, equity indexes, and rates, prioritizing liquid contracts (pp. 49–51). 5. **portfolio-level covariance risk is a recognized limitation, not an implemented constraint in the core model.** he discusses correlations, var, and incremental var as potential enhancements (pp. 255–257), including the danger of many trades becoming one underlying macro bet. 6. **risk factor determines return/drawdown scaling.** chapter 4 table 4.5 demonstrates materially greater volatility and drawdowns at larger risk factors (p. 77). these are the author's historical simulations, not forward forecasts. 7. **style diversification is distinct from market diversification.** chapter 9 combines trend, countertrend, and curve trading with approximate 34%/33%/33% strategy allocations, rebalanced monthly as a demonstration (pp. 258–261). ## l1 — canonical 2023 core trading rules source: chapter 4, **a core trend-following strategy**, p. 74; basic models pp. 59–61. | component | rule | |---|---| | universe | li", "sortRank": 0}, {"id": "singha_aguilera_lahiri_2025_gold_ftf", "filename": "Forecast-to-Fill_Paper_Wiki__L0-L7_.md", "title": "Forecast-to-Fill: Benchmark-Neutral Alpha and Billion-Dollar Capacity in Gold Futures (2015-2025)", "authors": "Mainak Singha, Jose Aguilera-Toste, Vinayak Lahiri", "year": "2025", "pubDate": "2025-11-12", "version": "arXiv:2511.08571v1", "primaryTopic": "Trend Following & Momentum", "category": "Trend & Momentum", "isTopicWiki": false, "tags": ["Execution & Capacity", "Position Sizing", "Commodities / Gold", "EMA", "ATR Stops", "Volatility Targeting"], "rawUrl": "https://drive.google.com/file/d/150LlbvcECZgsGBajzof2a7hYuCztW_N8/view", "rawId": "150LlbvcECZgsGBajzof2a7hYuCztW_N8", "status": "carded", "reviewStatus": "pending_review", "qcPass": 2, "qcTotal": 4, "introHtml": "", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Can a simple, interpretable trend–momentum signal in gold futures generate durable, benchmark-neutral, billion-dollar-scalable out-of-sample alpha once volatility targeting, transaction costs, square-root market impact, and ATR exits are integrated end-to-end? <em>(pp. 1–2)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Author-reported claim and findings (<code>author_reported<\/code>):<\/strong> Across a rolling 10-year train / 6-month test walk-forward (2015–2025; 2,793 trading days), a long-only gold futures strategy achieves an out-of-sample Sharpe of <strong>2.88<\/strong>, CAGR of <strong>2.65%<\/strong> at <strong>0.91%<\/strong> realized volatility, MaxDD of <strong>0.52%<\/strong>, and gold CAPM beta of <strong>0.03<\/strong> (annualized alpha <strong>2.25%<\/strong>, IR <strong>2.09<\/strong>), net of 0.7 bps round-trip cost and square-root impact ($\\gamma = 0.02$). Scaling linearly to a 15% volatility target implies ~43% annualized return and ~37% alpha, with positive log-growth up to ~$0.8–1.0B AUM. <em>(Abstract, pp. 13–18)<\/em><\/p>\n<p class=\"wiki-p\"><strong>Caveat (<code>analyst_inference<\/code>):<\/strong> High skepticism is warranted before trusting headline numbers. The paper contains <strong>material internal contradictions<\/strong>: (1) $T+0$ vs. $T+1$ execution drops Sharpe by 0.60 ($2.88 \\to 2.28$), raising same-bar look-ahead concerns; (2) Table 3 reports $\\text{Sharpe} = 0.937$ at $1.0\\times$ cost while the text directly below it claims $&gt; 2.5$; (3) linear $16.5\\times$ scaling to 15% vol violates the strategy&#x27;s own $W_{\\max}=2.0$ leverage cap; and (4) the capacity arithmetic in Section 10 is off by ~2 orders of magnitude ($L_{\\max}\\cdot \\text{ADV}/|\\Delta w_t| \\approx \\$2.2\\text{M}$, not $\\$760\\text{M}$).<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Author&#x27;s explanation (<code>author_reported<\/code>):<\/strong> Gold is information-driven without cash flows or credit risk <em>(p. 2)<\/em>. Institutional hedgers (producers, refiners, ETF issuers) adjust positions gradually under funding or margin constraints, creating transient directional persistence <em>(pp. 2, 23)<\/em>. The strategy does not predict exact price levels; it harvests a state-dependent risk premium by selectively supplying liquidity in trending states, while volatility targeting, friction-aware Kelly sizing, and ATR stops shape returns into a positively skewed profile (capped downside, open-ended upside) <em>(pp. 22–24)<\/em>.<\/p>\n<p class=\"wiki-p\"><strong>Analyst inference (<code>analyst_inference<\/code>):<\/strong> Economically, time-series momentum in gold is well-documented (Moskowitz et al., 2012), but a <strong>65.8% daily hit rate with a $1.49\\times$ payoff ratio<\/strong> <em>(p. 14)<\/em> and <strong>$\\text{Sharpe} \\approx 2.9$<\/strong> on a single liquid futures contract using a basic EMA + 50-day breakout is far outside normal CTA empirical bounds (typically Sharpe 0.4–0.9 on a single market). This strongly suggests either subtle look-ahead/execution-timing leakage in the $T+0$ close-to-close pipeline or an artifact of how overlapping OOS windows and ATR stops are evaluated.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original inputs, sample, equations, timing and methods (<code>author_reported<\/code>):<\/strong><\/p>\n<ul class=\"wiki-ul\"><li><strong>Data &amp; Sample:<\/strong> Daily CME Gold (GC) front-month continuous futures total returns (rolled 2 business days before first notice; LBMA PM fix used only as benchmark regressor) <em>(p. 27)<\/em>. Effective sample: 2005–2025 (first 10-year train starts Jan 2005; OOS runs Jan 2015 – Oct 31, 2025; 2,793 days; NYSE calendar with price carry-forward on holidays) <em>(p. 3)<\/em>.<\/li><li><strong>Walk-Forward Protocol:<\/strong> Rolling 10-year train $\\to$ 6-month test, stepped forward monthly (creating overlapping 6-month OOS slices) <em>(pp. 2, 27)<\/em>. All parameters frozen prior to each OOS slice <em>(pp. 8–9)<\/em>.<\/li><li>**Smoothed Trend &amp; Standardized Slope <em>(pp. 5, 10)<\/em>:**<\/li><li class=\"sub-li\">Log-price $y_t = \\log P_t$; EMA $\\tilde{y}_t = \\lambda \\tilde{y}_{t-1} + (1-\\lambda) y_t$; slope $\\Delta \\tilde{y}_t = \\tilde{y}_t - \\tilde{y}_{t-1}$.<\/li><li class=\"sub-li\">Standardized using training-window mean/std: $z_t = (\\Delta \\tilde{y}_t - \\mu_{\\text{train}})/\\sigma_{\\text{train}}$.<\/li><li class=\"sub-li\">Bounded trend score: $\\bar{z}_t = \\min(\\max(z_t, -3), 3)$, $p_{\\text{trend}}(t) = (\\bar{z}_t + 3)/6 \\in [0,1]$.<\/li><li>**Momentum &amp; Blended Regime Probability <em>(pp. 5, 10)<\/em>:**<\/li><li class=\"sub-li\">Binary 50-day momentum: $m_t = \\mathbb{I}\\{P_t / P_{t-50} &gt; 1\\}$.<\/li><li class=\"sub-li\">Blended score: $p_{\\text{bull}}(t) = \\omega p_{\\text{trend}}(t) + (1-\\omega) m_t$ with $\\omega = 0.6$; $p_{\\text{bear}}(t) = 1 - p_{\\text{bull}}(t)$.<\/li><li>**Entry &amp; Exit Rules (Long-Only) <em>(pp. 5–6, 11)<\/em>:**<\/li><li class=\"sub-li\">Enter long if $p_{\\text{bull}}(t) \\ge 0.52$ and $\\Delta \\tilde{y}_t &gt; 0$.<\/li><li class=\"sub-li\">Exit on any of: (1) Hard stop at $P_{\\text{ent}} - 2\\cdot \\text{ATR}_{14}(t)$; (2) Trailing stop at $\\text{Peak} - 1.5\\cdot \\text{ATR}_{14}(t)$; (3) Timeout after 30 trading days; (4) De-risk (halve or close) if $p_{\\text{bear}}(t) &gt; 0.50$.<\/li><li>**Volatility Targeting &amp; Confidence Shaping <em>(pp. 6–7, 12)<\/em>:**<\/li><li class=\"sub-li\">EWMA variance forecast: $\\hat{\\sigma}_{t+1}^2 = \\theta \\hat{\\sigma}_t^2 + (1-\\theta) r_t^2$ (20-day EWMA noted on p. 25).<\/li><li class=\"sub-li\">Target $\\sigma^\\star = 0.15/\\sqrt{252}$; leverage cap $W_{\\max} = 2.0$; $w_t^{(\\text{vol})} = \\min(W_{\\max}, \\sigma^\\star / \\hat{\\sigma}_{t+1})$.<\/li><li class=\"sub-li\">Confidence-shaped weight: $w_t^{(\\text{conf})} = w_t^{(\\text{vol})} \\cdot \\frac{p_{\\text{bull}}(t) - 0.5}{0.5}$.<\/li><li>**Friction-Adjusted Kelly Sizing <em>(pp. 7–8, 12)<\/em>:**<\/li><li class=\"sub-li\">Objective: $g(f) \\approx \\mu f - \\frac{1}{2}\\sigma^2 f^2 - nkf - \\gamma (nf)^{3/2}$, where $k = 0.7\\text{ bps}$ round-trip, $\\gamma = 0.02$, $n \\le 1$.<\/li><li class=\"sub-li\">Optimal fraction $f^\\star = (x^\\star)^2$ where $x^\\star = \\frac{-3\\gamma n^{3/2} + \\sqrt{9\\gamma^2
