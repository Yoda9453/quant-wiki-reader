0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Taleb, Yarckin, Mann, Delic &amp; Spitznagel <strong>Date/version:<\/strong> 2023; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1hql6zEwNr4bbYFWSNzYgu0HeD0Mo9UDL/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Measurement / pricing <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Do observed deep-OTM option prices exhibit a locally stable power-law strike decay?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> Proposes a relative tail-option pricing heuristic, not a verified trading alpha (Abstract; Sections I–II).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> A power-law tail exponent can help extrapolate relative deep-tail option prices.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> A regular-variation tail and Karamata-constant approximation produces strike-relative prices calibrated from an anchor tail option.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Proposes a relative tail-option pricing heuristic, not a verified trading alpha (Abstract; Sections I–II).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Do observed deep-OTM option prices exhibit a locally stable power-law strike decay?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> A power-law tail exponent can help extrapolate relative deep-tail option prices.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> At matched expiry, fit a tail slope from liquid anchor OTM put quotes; hold out deeper strikes and compare forecast mid-price error with bid/ask spread and no-arbitrage bounds.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Do observed deep-OTM option prices exhibit a locally stable power-law strike decay?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> At matched expiry, fit a tail slope from liquid anchor OTM put quotes; hold out deeper strikes and compare forecast mid-price error with bid/ask spread and no-arbitrage bounds.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Proposes a relative tail-option pricing heuristic, not a verified trading alpha (Abstract; Sections I–II).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1hql6zEwNr4bbYFWSNzYgu0HeD0Mo9UDL<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "tail option pricing under power laws taleb, yarckin, mann, delic & spitznagel tail risk measurement / pricing # tail option pricing under power laws **authors:** taleb, yarckin, mann, delic & spitznagel **date/version:** 2023; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1hql6zewnr4bbyfwsnzygu0hed0mo9udl/view) **track:** measurement / pricing **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** do observed deep-otm option prices exhibit a locally stable power-law strike decay? **author-reported headline:** proposes a relative tail-option pricing heuristic, not a verified trading alpha (abstract; sections i–ii). **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** a power-law tail exponent can help extrapolate relative deep-tail option prices. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** a regular-variation tail and karamata-constant approximation produces strike-relative prices calibrated from an anchor tail option. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | proposes a relative tail-option pricing heuristic, not a verified trading alpha (abstract; sections i–ii). | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the original authors, not to an executed vault strategy. ## l4 — research eval", "sortRank": 1}, {"id": "kelly-jiang-2013-tail-risk-and-asset-prices", "filename": "Kelly_Jiang_2013_Tail_Risk_and_Asset_Prices_v0.1.1.md", "title": "Tail Risk and Asset Prices", "authors": "{}", "year": "2013", "pubDate": "2013-08", "version": "0.1.1", "primaryTopic": "Tail Risk Measurement & Pricing", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1aLMNHJMKJdhcKns7_nQjA_arn9DIKSF7/view", "rawId": "1aLMNHJMKJdhcKns7_nQjA_arn9DIKSF7", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1aLMNHJMKJdhcKns7_nQjA_arn9DIKSF7/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">The paper extracts a time-varying common left-tail risk factor from contemporaneous extreme individual-stock returns, then tests whether it predicts market risk premia and cross-sectional returns. The August 2013 NBER working-paper abstract reports that a one-standard-deviation increase in tail risk predicts approximately 4.5 percentage points higher excess market return over the following year, and a 5.4% annual three-factor alpha difference between high and low tail-risk-loading stocks. These are the authors’ in-sample claims, not an immediately tradable forecast.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">A large equity cross-section contains more extreme-return observations within a month than the aggregate index alone. Under a shared dynamic power-law tail assumption, current downside tail thickness can be estimated without decades of historical index crashes. Risk premia can rise after perceived disaster risk increases; note that a higher <em>expected return<\/em> forecast is not the same as a warning of an imminent negative return.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">Authors posit conditional left-tail power-law distributions with asset-specific parameters and a shared time-varying factor λ_t; they estimate the factor from extreme individual-stock observations using a Hill-style cross-sectional tail estimator. Original empirical sample: daily CRSP NYSE/AMEX/NASDAQ common stocks, share codes 10/11, January 1963–December 2010. Tail factor constructed monthly. Exact threshold, estimation weighting and missing-stock rules must be verified from methods before any faithful reproduction. Sources: paper Eq. (1), methods on cross-sectional estimation, Section 3.1.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Reported λ_t monthly AR(1) persistence ≈0.927 (introductory discussion).<\/li><li>One-standard-deviation increase in estimated tail risk associated with +4.5 percentage points of excess-market-return forecast over next year (abstract).<\/li><li>High-minus-low tail-risk loading portfolio three-factor alpha spread ≈5.4% annually (abstract).<\/li><li>The abstract describes correlation with index-option-based tail-risk measures, not an identical construct.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Strength: market-data measurement without needing option chain. Concerns: expensive CRSP-type point-in-time universe, survivorship and delisting returns, threshold choice, structural change in equity breadth, and overlapping long-horizon predictability. Most importantly, higher predicted returns after risk shocks do not establish crash timing. Reported findings are from a 2013 working-paper version.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> Cross-sectional downside-shock breadth may contain incremental information about future equity risk premia beyond realized market volatility.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Use daily point-in-time U.S. stock returns with delisted stocks where available; if not, a fixed and explicitly biased liquid universe as a feasibility pilot. At each completed month, compute fraction of names with return below a prespecified -5% daily threshold (simple proxy, not original Hill estimator), optionally market-cap breadth; aggregate monthly. Trade signal no earlier than next month. Forecast SPY 1/3/12-month excess return as <strong>research diagnostic<\/strong>, before considering dynamic allocation.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: monthly negative-return breadth adds no out-of-sample predictive information beyond lagged SPY realized vol and return. Start with fixed -5% shock share and a 12-month rolling z-score (no parameter sweep on final holdout); test expanding-window next-month return regression, sign and quantile forecasts versus historical mean and vol-only baseline. Use 60 months minimum training and a final 30% chronological holdout. Evaluate OOS R², predictive-slope stability, calibration, Newey-West/overlap-aware inference for longer horizons. Decision: continue only on stable incremental OOS predictive value across subperiods and feasible data; stop proxy if gains vanish when cross-section and delisting are corrected. No execution until trading policy explicitly specified.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Exact paper replication optional: CRSP point-in-time daily returns, original tail threshold, Hill estimator, λ_t normalization and factor-loading sorts.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> The paper extracts a time-varying common left-tail risk factor from contemporaneous extreme individual-stock returns, then tests whether it predicts market risk premia and cross-sectional returns.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Metadata/tags exist; search-index retrieval not yet tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Core question and findings present; human reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form protocol proposed; second-analyst specification review pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Source sections indicated; exhibit/page image confirmation pending for quantitative material<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1aLMNHJMKJdhcKns7_nQjA_arn9DIKSF7<\/code>.<\/li><li>Draft generated under Schema v0.1.1 on 2026-10-24.<\/li><li>Figures and parameter choices in L5 are <strong>researcher proposals<\/strong> unless clearly identified as paper content. No tests were executed.<\/li><\/ul>"}], "searchText": "tail risk and asset prices {} tail risk measurement & pricing # tail risk and asset prices **source:** [original pdf](https://drive.google.com/file/d/1almnhjmkjdhckns7_nqja_arn9diksf7/view) · **research status:** draft, pending human review. this card is source-based but not a full academic replication. ## l0 — research in one minute the paper extracts a time-varying common left-tail risk factor from contemporaneous extreme individual-stock returns, then tests whether it predicts market risk premia and cross-sectional returns. the august 2013 nber working-paper abstract reports that a one-standard-deviation increase in tail risk predicts approximately 4.5 percentage points higher excess market return over the following year, and a 5.4% annual three-factor alpha difference between high and low tail-risk-loading stocks. these are the authors’ in-sample claims, not an immediately tradable forecast. ## l1 — economic intuition a large equity cross-section contains more extreme-return observations within a month than the aggregate index alone. under a shared dynamic power-law tail assumption, current downside tail thickness can be estimated without decades of historical index crashes. risk premia can rise after perceived disaster risk increases; note that a higher *expected return* forecast is not the same as a warning of an imminent negative return. ## l2 — model construction authors posit conditional left-tail power-law distributions with asset-specific parameters and a shared time-varying factor λ_t; they estimate the factor from extreme individual-stock observations using a hill-style cross-sectional tail estimator. original empirical sample: daily crsp nyse/amex/nasdaq common stocks, share codes 10/11, january 1963–december 2010. tail factor constructed monthly. exact threshold, estimation weighting and missing-stock rules must be verified from methods before any faithful reproduction. sources: paper eq. (1), methods on cross-sectional estimation, section 3.1. ## l3 — empirical findings **author-reported; not independently verified:** - reported λ_t monthly ar(1) persistence ≈0.927 (introductory discussion). - one-standard-deviation increase in estimated tail risk associated with +4.5 percentage points of excess-market-return forecast over next year (abstract). - high-minus-low tail-risk loading portfolio three-factor alpha spread ≈5.4% annually (abstract). - the abstract describes correlation with index-option-based tail-risk measures, not an identical construct. ## l4 — research evaluation strength: market-dat", "sortRank": 1}, {"id": "gao-lu-song-2017", "filename": "Gao_Lu_Song_2017_v0.1.1.md", "title": "Tail Risk Concerns Everywhere", "authors": "Gao, Lu & Song", "year": "2017", "pubDate": "2017", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["Measurement / pricing"], "rawUrl": "https://drive.google.com/file/d/1o5iRztYB9qZ8qMQ2i1QPaE7_GDVfEkqk/view", "rawId": "1o5iRztYB9qZ8qMQ2i1QPaE7_GDVfEkqk", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Authors:<\/strong> Gao, Lu &amp; Song <strong>Date/version:<\/strong> 2017; more precise version information pending verification. <strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1o5iRztYB9qZ8qMQ2i1QPaE7_GDVfEkqk/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> <strong>Track:<\/strong> Measurement / pricing <strong>Evidence status:<\/strong> Source-backed first-pass Wiki, not a verified replication or investment recommendation.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Question:<\/strong> Does joint equity/FX/bond option skew predict cross-asset downside returns beyond VIX?<\/p>\n<p class=\"wiki-p\"><strong>Author-reported headline:<\/strong> GRIX beta negatively explains cross-sectional returns; broader asset-class coverage strengthens pricing power (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>One caution:<\/strong> The study&#x27;s particular data, definitions, selected events and estimation setup may not generalize to live trading. No findings in L5 have been tested.<\/p>\n<p class=\"wiki-p\"><strong>Source locator:<\/strong> Opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Core mechanism:<\/strong> A global option-implied tail-concern factor (GRIX) prices cross-asset returns.<\/p>\n<p class=\"wiki-p\"><strong>Analyst interpretation (not a source claim):<\/strong> If the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. A negative proxy result would not refute the full paper.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> OTM options across international equity, FX and government-bond markets form GRIX; securities are tested for sensitivity to global concerns.<\/p>\n<p class=\"wiki-p\"><strong>Replication-sensitive details:<\/strong> Reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. Do not substitute the simplified L5 construction for the source methodology.<\/p>\n<p class=\"wiki-p\"><strong>Primary source locator:<\/strong> Abstract and introductory methodology; equation-/table-level audit remains pending.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-reported item<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>GRIX beta negatively explains cross-sectional returns; broader asset-class coverage strengthens pricing power (Abstract).<\/td><td>Abstract / executive summary<\/td><\/tr><tr><td>Independently validated replication<\/td><td>Not performed<\/td><td>Research status<\/td><\/tr><tr><td>Numerical chart/table re-extraction<\/td><td>Pending<\/td><td>Source figures/tables need visual verification<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"wiki-p\"><strong>Interpretation:<\/strong> Findings belong to the original authors, not to an executed Vault strategy.<\/p>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Strength:<\/strong> The paper offers a mechanism that can be challenged using observable returns, prices, option indicators, cross-country data or drawdown outcomes.<\/p>\n<p class=\"wiki-p\"><strong>Source-specific concern:<\/strong> The published construction differs from a reduced-form proxy; data availability, market microstructure, sample selection, model fit and tail-event rarity may materially affect the conclusion.<\/p>\n<p class=\"wiki-p\"><strong>Research controls:<\/strong> Use non-overlapping final evaluation data; enforce information release dates, realistic execution, financing, liquidity and transaction costs. Compare with a transparent simple baseline. Treat multiple parameter tries as exploratory.<\/p>\n<p class=\"wiki-p\"><strong>Further verification:<\/strong> Detailed author-stated limitations and full exhibit-level evidence still require human review of the PDF.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable thesis (analyst-proposed):<\/strong> Does joint equity/FX/bond option skew predict cross-asset downside returns beyond VIX?<\/p>\n<p class=\"wiki-p\"><strong>Mechanism to preserve:<\/strong> A global option-implied tail-concern factor (GRIX) prices cross-asset returns.<\/p>\n<p class=\"wiki-p\"><strong>Permitted simplification:<\/strong> Use transparent, low-parameter market proxies rather than reproduce proprietary or mathematically elaborate original machinery. Document lost information.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Data and instruments:<\/strong> Combine monthly standardized equity skew, FX risk reversals and bond-volatility proxies; regress next-month outcomes against VIX-only and rolling-vol controls.<\/p>\n<p class=\"wiki-p\"><strong>Trading / observation clock:<\/strong> Form indicators only after the final input becomes observable at t; act no earlier than a feasible subsequent trade at t+1. For returns, use only periods after executable allocation. If data are released with lag or revised, use vintage-aware observations or add a conservative lag.<\/p>\n<p class=\"wiki-p\"><strong>Portfolio treatment:<\/strong> Keep initial notional, return convention, defensive/cash leg, collateral, leverage limits and asset turnover explicit. If the experiment is predictive rather than tradable, classify its results as forecasting tests, not trading P&amp;L.<\/p>\n<p class=\"wiki-p\"><strong>Costs:<\/strong> Predeclare base 5bps one-way and sensitivity 0/10/20bps for ETF-like trades where relevant; option/VIX futures tests require bid/ask, roll carry, commission and collateral specific to the instrument. These are proposed evaluation assumptions, not source estimates.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Test question:<\/strong> Does joint equity/FX/bond option skew predict cross-asset downside returns beyond VIX?<\/p>\n<p class=\"wiki-p\"><strong>Fixed reduced-form specification:<\/strong> Combine monthly standardized equity skew, FX risk reversals and bond-volatility proxies; regress next-month outcomes against VIX-only and rolling-vol controls.<\/p>\n<p class=\"wiki-p\"><strong>Benchmarks:<\/strong> Unconditional historical mean or rolling volatility-only indicator for forecasting; buy-and-hold/equal weight or inverse volatility for allocation; unhedged portfolio for hedging. Select the comparator before results.<\/p>\n<p class=\"wiki-p\"><strong>OOS rule:<\/strong> Maintain expanding-window estimates and a final contiguous holdout; no fit, threshold selection or security-filter changes on the final holdout. Require sufficient lookback history and evaluate both normal and crisis regimes.<\/p>\n<p class=\"wiki-p\"><strong>Primary criterion:<\/strong> Evaluate the metric matching the claim: predictive calibration/quantile loss for forecasting, conditional downside returns and hedge carry for hedging, and after-cost expected shortfall / maximum drawdown for allocation. Report turnover, event counts, uncertainty and benchmark-relative effects.<\/p>\n<p class=\"wiki-p\"><strong>Decision rule (proposed):<\/strong> Continue if direction is stable across reasonable frozen windows, survives fees and improves the relevant primary metric in OOS. Revise if improvement hinges on one event or one parameter. Stop this <em>proxy<\/em> if it consistently fails against the simple benchmark. These are research triage guidelines, not author-derived performance thresholds.<\/p>\n<p class=\"wiki-p\"><strong>Interpretation limit:<\/strong> An experiment result would validate only this deliberately reduced representation, not the paper&#x27;s full estimated model.<\/p>\n<p class=\"wiki-p\"><strong>Execution status:<\/strong> Specified / <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\"><strong>Decision:<\/strong> Not pursued in this scalability batch. Detailed equations, instrument universes and estimator conventions require a focused source audit if later prioritized.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Related Vault theme:<\/strong> <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Tail Risk AQR Put versus Trend Wiki<\/a>. The connection is conceptual and not a jointly verified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> GRIX beta negatively explains cross-sectional returns; broader asset-class coverage strengthens pricing power (Abstract).<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1o5iRztYB9qZ8qMQ2i1QPaE7_GDVfEkqk<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "tail risk concerns everywhere gao, lu & song tail risk measurement / pricing # tail risk concerns everywhere **authors:** gao, lu & song **date/version:** 2017; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1o5irztyb9qz8qmq2i1qpae7_gdvfekqk/view) **track:** measurement / pricing **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 rified result.<\/p>\n<p class=\"wiki-p\"><strong>Potential research system:<\/strong> Reusable market-data proxy with explicit timestamps; comparison against a risk-management baseline. Reuse signal, execution, accounting and performance modules only after source definition and experiment specification are approved.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> Abstract argues tail constraints produce barbell-like low-risk/high-risk payoff structures; not an empirical trading backtest.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Implement the frozen L5.C specification with actual historical data and independent result logs. Do not promote a source narrative into an observed portfolio improvement.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Worth screening as a reduced-form hypothesis. Human review pending; no backtest or investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Gap<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Titles, roles and tags written; Catalog search not run<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>First-pass summary; deep source audit pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Reduced-form plan proposed; precise data contract and researcher sign-off pending<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract-level evidence; exact figure/table/page verification pending<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source & Revision Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Raw Google Drive ID: <code>1biP0uhWmWoUt4-6lYrhuP3mNxBeewq4o<\/code>.<\/li><li>v0.1.1 schema batch draft on 2026-10-24.<\/li><li>No source PDFs renamed, replaced or relocated.<\/li><\/ul>"}], "searchText": "tail risk constraints and maximum entropy donald geman, hélyette geman & nassim nicholas taleb tail risk portfolio construction # tail risk constraints and maximum entropy **authors:** donald geman, hélyette geman & nassim nicholas taleb **date/version:** unverified; more precise version information pending verification. **source:** [original pdf](https://drive.google.com/file/d/1bip0uhwmwout4-6lyrhup3mnxbeewq4o/view) **track:** portfolio construction **evidence status:** source-backed first-pass wiki, not a verified replication or investment recommendation. ## l0 — research in one minute **question:** can a simple cash-plus-risky barbell satisfy loss limits more reliably than a fixed balanced portfolio? **author-reported headline:** abstract argues tail constraints produce barbell-like low-risk/high-risk payoff structures; not an empirical trading backtest. **one caution:** the study's particular data, definitions, selected events and estimation setup may not generalize to live trading. no findings in l5 have been tested. **source locator:** opening abstract or executive summary; inspect original paper before quoting exact numerical exhibits. ## l1 — economic intuition **core mechanism:** tail constraints can dominate variance-based design and motivate barbell allocations. **analyst interpretation (not a source claim):** if the relationship is economically meaningful, a deliberately simplified observable proxy should show some directional evidence when evaluated after information and execution lags. a negative proxy result would not refute the full paper. ## l2 — model construction **original method:** maximum-entropy distributions subject to left-tail constraints and expectations. **replication-sensitive details:** reopen original equations, sample filters, point-in-time membership, input definitions, estimation windows and publication timing before exact replication. do not substitute the simplified l5 construction for the source methodology. **primary source locator:** abstract and introductory methodology; equation-/table-level audit remains pending. ## l3 — empirical findings | source-reported item | result | locator | |---|---|---| | main finding | abstract argues tail constraints produce barbell-like low-risk/high-risk payoff structures; not an empirical trading backtest. | abstract / executive summary | | independently validated replication | not performed | research status | | numerical chart/table re-extraction | pending | source figures/tables need visual verification | **interpretation:** findings belong to the original authors, not to an executed ", "sortRank": 1}, {"id": "chang-holdom-bhansali-2021-tail-hedging-performance", "filename": "Chang_Holdom_Bhansali_2021_Tail_Hedging_Performance_v0.1.1.md", "title": "Tail Risk Hedging Performance: Measuring What Counts", "authors": "{}", "year": "2021", "pubDate": "2021", "version": "0.1.1", "primaryTopic": "Tail Risk Hedging / Measurement", "category": "Tail Risk", "isTopicWiki": false, "tags": [], "rawUrl": "https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view", "rawId": "1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a> · <strong>Research status:<\/strong> Draft, pending human review. This card is source-based but not a full academic replication.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\">This LongTail Alpha practitioner paper argues that NAV-compounded hedge returns alone can mislead when premiums, subscriptions, redemptions and leveraged crisis payouts vary over time. It recommends comparing capital flows alongside NAV and assessing the hedge’s economic role inside the whole investment portfolio. The PDF opening carries different 2021 revision dates; record the version ambiguity.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">Insurance is purchased for liquidity in adverse states, not for attractive standalone average returns. A profitable crisis payout may matter more when it allows forced sales to be avoided or portfolio exposure to be restored at depressed prices. Conversely, a very high return on a tiny options premium may have little whole-portfolio effect.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\">The paper contrasts NAV-based compounded return measures with actual investor subscription/redemption schedules and dollar P&amp;L. Exhibit 1 presents simple subscription examples; other exhibits illustrate timing and magnitude of cash flows. Exact exhibit-specific numerical claims require visual verification because extracted financial tables are imperfect.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported; not independently verified:<\/strong><\/p>\n<ul class=\"wiki-ul\"><li>Abstract: authors claim ignoring the timing and magnitude of cash flows can materially misrepresent hedging economics.<\/li><li>Key takeaways: NAV, cash flows and NAV-based returns should be viewed together; qualitative implementation/reliability considerations matter.<\/li><li>The document presents illustrative economic/accounting examples, <strong>not<\/strong> evidence that every particular hedge has positive expected return.<\/li><\/ul>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\">Strength: corrects denominator and portfolio-level evaluation errors in convex strategies. Caveats: practitioner viewpoint, choice of reinvestment and monetization rules, scenario dependence and assumptions about accessing liquidity at stressed prices. A theoretical portfolio benefit should not be claimed without a coherent self-financing ledger.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Falsifiable analyst hypothesis:<\/strong> Hedge value is sensitive to the <em>timing and use<\/em> of cash flows, and may be poorly ranked by standalone NAV-return metrics.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\">Construct explicit daily whole-portfolio ledger with equity core + option-protection budget; record premium debits, option MTM, expiries, payouts, cash balance, proceeds realized and deployment policy. Synthetic cash-flow examples can test the accounting before actual option data are obtained.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Proposed, not executed:<\/strong> Null: adding timed hedge cash flows and reinvestment rules does not materially change the ranking of two candidate strategies versus rankings using compounded hedge NAV returns alone. Create two or three <strong>predeclared hypothetical<\/strong> hedge payout paths with identical total cash inflow and different timing, and evaluate (a) compounded hedge return, (b) investor dollar P&amp;L, (c) whole-portfolio terminal wealth/max drawdown with a fixed monetization rule; then repeat on actual strategy P&amp;L when available. Verify ledger identity and that no proceeds are reinvested before receipt. Assess sensitivity to payout timing, capital allocation and transaction costs. Continue if rankings change materially and accounting reconciles; otherwise document when NAV-based views suffice.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">No exact full-paper replication required; reproducing verified cash-flow exhibits can be a useful accounting unit test.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Shared topic: <em>Tail Risk<\/em> research sprint (measurement / forecasting / hedging / construction). The presence of related topics does not imply joint author conclusions.<\/li><li>Compare implementation objectives against <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Ilmanen et al. (2021), Put versus Trend<\/a> and <a href=\"https://drive.google.com/file/d/1K7GWBfo-fJVwxE4adbltLDR90gv-Q2iD/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Chang et al., cash-flow-aware hedging<\/a> when relevant.<\/li><li>Potential integration: a research experiment module with stable ID, point-in-time data, trading clock and holdout protocol, not a production allocation mandate.<\/li><\/ul>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Source-backed claim:<\/strong> This LongTail Alpha practitioner paper argues that NAV-compounded hedge returns alone can mislead when premiums, subscriptions, redemptions and leveraged crisis payouts vary over time.<\/p>\n<p class=\"wiki-p\"><strong>Next test:<\/strong> Execute L5.C&#x27;s smallest specified market-data test, after owner confirms costs and data.<\/p>\n<p class=\"wiki-p\"><strong>Verdict:<\/strong> Candidate for reduced-form evaluation; no independent validation; no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Evidence / blocker<\/th><\/tr><\/thead ": false, "tags": ["Option pricing"], "rawUrl": "https://drive.google.com/file/d/1hElt8ztBdlJFoRwdXPu5nNTR5Y6OhDZp/view", "rawId": "1hElt8ztBdlJFoRwdXPu5nNTR5Y6OhDZp", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1hElt8ztBdlJFoRwdXPu5nNTR5Y6OhDZp/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a>. <strong>Authors:<\/strong> Michal Czerwonko; Russell Davidson; Stylianos Perrakis. <strong>Year:<\/strong> 2021. Draft pending human review; not independently replicated.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Research question:<\/strong> Can the paper&#x27;s identified downside-tail mechanism matter to risk management? <strong>Source-reported finding:<\/strong> The authors report that most apparent option-overpricing puzzles disappear with these considerations (Abstract). <strong>Caution:<\/strong> The source results are not trading signals or OOS validation.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">The core mechanism is that adverse outcomes can behave differently from average market conditions. <strong>Analyst inference:<\/strong> A simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> Almost stochastic dominance models S&amp;P 500 OTM-put and ATM-straddle anomalies while incorporating bid-ask frictions, market segmentation and maturity differences. This is the authors&#x27; method, distinct from the proxy proposed under L5. Exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-based evidence<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>The authors report that most apparent option-overpricing puzzles disappear with these considerations (Abstract).<\/td><td>Abstract; introductory discussion<\/td><\/tr><tr><td>Independently verified experiment<\/td><td>None<\/td><td>Not run<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Value:<\/strong> Offers a testable downside-risk question. <strong>Concerns:<\/strong> Tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. Confirm exact sample and empirical figure details from the source before approving Q4.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Reduced-form question:<\/strong> Does the core downside-risk relationship survive a simpler point-in-time market-data test? Preserve the timing and conditional downside feature, but not necessarily all original equations.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Available inputs and trading/observation proxy:<\/strong> With an SPX option chain, assess midquote versus executable bid/ask outcomes for short fixed-moneyness put positions and compare realized tails; do not infer profit from midpoint backtests. <strong>Execution:<\/strong> Use only observations known as of decision time t; trade no earlier than a feasible next opportunity if a strategy is tested. Account for spreads, commissions, turnover, funding and missing market data. A forecasting-only test must not be presented as trading P&amp;L.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Hypothesis:<\/strong> The simplified downside indicator improves a tail outcome versus its predeclared simple baseline. <strong>Frozen baseline experiment:<\/strong> With an SPX option chain, assess midquote versus executable bid/ask outcomes for short fixed-moneyness put positions and compare realized tails; do not infer profit from midpoint backtests. <strong>Comparator:<\/strong> An unconditional historical rate, ordinary market beta, rolling volatility or unhedged benchmark, as appropriate to the specific dependent variable. Select before testing. <strong>Evaluation:<\/strong> Expanding/rolling training windows, strict chronological holdout, no future-informed thresholds, downside hit rates or expected shortfall, MaxDD, and if tradable after-cost results. <strong>Decision rule:<\/strong> Continue only if improvements persist out of sample, survive realistic trading frictions and at least one reasonable parameter perturbation; otherwise revise or stop this proxy (not the original theory). <strong>Status:<\/strong> Experiment specified but <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Not pursued in this batch; exact estimation requires full figure/equation inspection and source-specific data contracts.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\">Conceptually related to <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">AQR&#x27;s Tail Risk Hedging<\/a> as an additional dimension of tail-risk measurement, forecasting or hedging. This is a suggested connection, not a conclusion jointly established by authors.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported claim:<\/strong> The authors report that most apparent option-overpricing puzzles disappear with these considerations (Abstract). <strong>Next falsifiable test:<\/strong> Run the frozen L5.C proxy using point-in-time data and transparent OOS accounting. <strong>Verdict:<\/strong> Research draft worth triage; pending review, no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Live retrieval not tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Abstract-level card, reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Dataset and precise timing assumptions require a second analyst&#x27;s check<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract/introduction locator; exhibits and equations still unverified<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Source Drive file ID: <code>1hElt8ztBdlJFoRwdXPu5nNTR5Y6OhDZp<\/code>; PDF content never altered.<\/li><li>First-pass Schema v0.1.1 card, processed with Skill v0.1.2 on 2026-10-25.<\/li><\/ul>"}], "searchText": "tail risk, almost stochastic dominance and index option anomalies michal czerwonko; russell davidson; stylianos perrakis tail risk option pricing # tail risk, almost stochastic dominance and index option anomalies **source:** [original pdf](https://drive.google.com/file/d/1helt8ztbdljforwdxpu5nntr5y6ohdzp/view). **authors:** michal czerwonko; russell davidson; stylianos perrakis. **year:** 2021. draft pending human review; not independently replicated. ## l0 — research in one minute **research question:** can the paper's identified downside-tail mechanism matter to risk management? **source-reported finding:** the authors report that most apparent option-overpricing puzzles disappear with these considerations (abstract). **caution:** the source results are not trading signals or oos validation. ## l1 — economic intuition the core mechanism is that adverse outcomes can behave differently from average market conditions. **analyst inference:** a simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research. ## l2 — model construction **original method:** almost stochastic dominance models s&p 500 otm-put and atm-straddle anomalies while incorporating bid-ask frictions, market segmentation and maturity differences. this is the authors' method, distinct from the proxy proposed under l5. exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim. ## l3 — empirical findings | source-based evidence | result | locator | |---|---|---| | main finding | the authors report that most apparent option-overpricing puzzles disappear with these considerations (abstract). | abstract; introductory discussion | | independently verified experiment | none | not run | ## l4 — research evaluation **value:** offers a testable downside-risk question. **concerns:** tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. confirm exact sample and empirical figure details from the source before approving q4. ## l5 — practical research lab ### l5.a — core mechanism **reduced-form question:** does the core downside-risk relationship survive a simpler point-in-time market-data test? preserve the timing and conditional downside feature, but not necessarily all original equations. ### l5.b — practical implementation **available inputs and trading/observation proxy:** with an spx option chain, assess midquote versus executable bid/ask outcomes for short fixed-moneyness put positions and compare realized tails; do not infer p", "sortRank": 1}, {"id": "lee-wang-2016", "filename": "Lee_Wang_2016_v0.1.1.md", "title": "Tales of Tails: Jumps in Currency Markets", "authors": "Suzanne S. Lee; Minho Wang", "year": "2016", "pubDate": "2016", "version": "0.1.1", "primaryTopic": "Tail Risk", "category": "Tail Risk", "isTopicWiki": false, "tags": ["FX jumps"], "rawUrl": "https://drive.google.com/file/d/1St_W_bAkHG5l3gppdvPMlKokQSL2mHbT/view", "rawId": "1St_W_bAkHG5l3gppdvPMlKokQSL2mHbT", "status": "carded", "reviewStatus": "pending_review", "qcPass": 0, "qcTotal": 4, "introHtml": "<p class=\"wiki-p\"><strong>Source:<\/strong> <a href=\"https://drive.google.com/file/d/1St_W_bAkHG5l3gppdvPMlKokQSL2mHbT/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">Original PDF<\/a>. <strong>Authors:<\/strong> Suzanne S. Lee; Minho Wang. <strong>Year:<\/strong> 2016. Draft pending human review; not independently replicated.<\/p>", "sections": [{"id": "sec-0", "label": "L0", "heading": "L0 — Research in One Minute", "isCore": true, "html": "<p class=\"wiki-p\"><strong>Research question:<\/strong> Can the paper&#x27;s identified downside-tail mechanism matter to risk management? <strong>Source-reported finding:<\/strong> Authors find intraday jump clustering and jump relationships with U.S. macro news, notably FOMC announcements (Abstract and Introduction). <strong>Caution:<\/strong> The source results are not trading signals or OOS validation.<\/p>"}, {"id": "sec-1", "label": "L1", "heading": "L1 — Economic Intuition", "isCore": true, "html": "<p class=\"wiki-p\">The core mechanism is that adverse outcomes can behave differently from average market conditions. <strong>Analyst inference:<\/strong> A simple observable proxy can establish whether a narrower version of the source hypothesis deserves more research.<\/p>"}, {"id": "sec-2", "label": "L2", "heading": "L2 — Model Construction", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Original method:<\/strong> A 16-currency panel of 15-minute exchange rates is analyzed using general jump regression, event timing, and jump clustering. This is the authors&#x27; method, distinct from the proxy proposed under L5. Exact estimator parameters, equations and full sampling rules require a separate in-depth audit before a replication claim.<\/p>"}, {"id": "sec-3", "label": "L3", "heading": "L3 — Empirical Findings", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Source-based evidence<\/th><th>Result<\/th><th>Locator<\/th><\/tr><\/thead><tbody><tr><td>Main finding<\/td><td>Authors find intraday jump clustering and jump relationships with U.S. macro news, notably FOMC announcements (Abstract and Introduction).<\/td><td>Abstract; introductory discussion<\/td><\/tr><tr><td>Independently verified experiment<\/td><td>None<\/td><td>Not run<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-4", "label": "L4", "heading": "L4 — Research Evaluation", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Value:<\/strong> Offers a testable downside-risk question. <strong>Concerns:<\/strong> Tail sample scarcity, selection bias, data timing, surviving fund/index members, market spreads and regime instability can cause misleading results. Confirm exact sample and empirical figure details from the source before approving Q4.<\/p>"}, {"id": "sec-5", "label": "L5", "heading": "L5 — Practical Research Lab", "isCore": false, "html": "<h3 class=\"wiki-h3\">L5.A — Core Mechanism<\/h3>\n<p class=\"wiki-p\"><strong>Reduced-form question:<\/strong> Does the core downside-risk relationship survive a simpler point-in-time market-data test? Preserve the timing and conditional downside feature, but not necessarily all original equations.<\/p>\n<h3 class=\"wiki-h3\">L5.B — Practical Implementation<\/h3>\n<p class=\"wiki-p\"><strong>Available inputs and trading/observation proxy:<\/strong> Estimate whether prior-day large FX moves and a preannounced FOMC indicator predict next-day large FX moves and whether a fixed carry-risk reduction rule lowers drawdowns. <strong>Execution:<\/strong> Use only observations known as of decision time t; trade no earlier than a feasible next opportunity if a strategy is tested. Account for spreads, commissions, turnover, funding and missing market data. A forecasting-only test must not be presented as trading P&amp;L.<\/p>\n<h3 class=\"wiki-h3\">L5.C — Minimum Viable Experiment<\/h3>\n<p class=\"wiki-p\"><strong>Hypothesis:<\/strong> The simplified downside indicator improves a tail outcome versus its predeclared simple baseline. <strong>Frozen baseline experiment:<\/strong> Estimate whether prior-day large FX moves and a preannounced FOMC indicator predict next-day large FX moves and whether a fixed carry-risk reduction rule lowers drawdowns. <strong>Comparator:<\/strong> An unconditional historical rate, ordinary market beta, rolling volatility or unhedged benchmark, as appropriate to the specific dependent variable. Select before testing. <strong>Evaluation:<\/strong> Expanding/rolling training windows, strict chronological holdout, no future-informed thresholds, downside hit rates or expected shortfall, MaxDD, and if tradable after-cost results. <strong>Decision rule:<\/strong> Continue only if improvements persist out of sample, survive realistic trading frictions and at least one reasonable parameter perturbation; otherwise revise or stop this proxy (not the original theory). <strong>Status:<\/strong> Experiment specified but <strong>not run<\/strong>.<\/p>\n<h3 class=\"wiki-h3\">L5.D — Academic Replication (Optional)<\/h3>\n<p class=\"wiki-p\">Not pursued in this batch; exact estimation requires full figure/equation inspection and source-specific data contracts.<\/p>"}, {"id": "sec-6", "label": "L6", "heading": "L6 — Research Connections", "isCore": false, "html": "<p class=\"wiki-p\">Conceptually related to <a href=\"https://drive.google.com/file/d/1y0nlgQnE3bReh_XiOgmTIpoylmZI20pu/view\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"wiki-link\">AQR&#x27;s Tail Risk Hedging<\/a> as an additional dimension of tail-risk measurement, forecasting or hedging. This is a suggested connection, not a conclusion jointly established by authors.<\/p>"}, {"id": "sec-7", "label": "L7", "heading": "L7 — Claim / Next Test / Verdict", "isCore": false, "html": "<p class=\"wiki-p\"><strong>Author-reported claim:<\/strong> Authors find intraday jump clustering and jump relationships with U.S. macro news, notably FOMC announcements (Abstract and Introduction). <strong>Next falsifiable test:<\/strong> Run the frozen L5.C proxy using point-in-time data and transparent OOS accounting. <strong>Verdict:<\/strong> Research draft worth triage; pending review, no investment approval.<\/p>"}, {"id": "sec-8", "label": "QC", "heading": "Quality Gate Log", "isCore": false, "html": "<div class=\"table-wrap\"><table class=\"wiki-table\"><thead><tr><th>Gate<\/th><th>Status<\/th><th>Reason<\/th><\/tr><\/thead><tbody><tr><td>Q1 Searchability<\/td><td>needs_review<\/td><td>Live retrieval not tested<\/td><\/tr><tr><td>Q2 Comprehension<\/td><td>needs_review<\/td><td>Abstract-level card, reader review pending<\/td><\/tr><tr><td>Q3 Testability<\/td><td>needs_review<\/td><td>Dataset and precise timing assumptions require a second analyst&#x27;s check<\/td><\/tr><tr><td>Q4 Traceability<\/td><td>needs_review<\/td><td>Abstract/introduction locator; exhibits and equations still unverified<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "sec-9", "label": "Log", "heading": "Source and Change Log", "isCore": false, "html": "<ul class=\"wiki-ul\"><li>Source Drive file ID: <code>1St_W_bAkHG5l3gppdvPMlKokQSL2mHbT<\/code>; PDF content never altered.<\/li><li>First-pass Schema v0.1.1 card, processed with Skill
